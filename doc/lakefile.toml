name = "L4YamlDoc"

[leanOptions]
"autoImplicit" = false

# Verso pinned to the immutable `v4.33.0` tag — the same stack every doc workspace
# in the family renders with (PropertyKindCalculus/blueprint, soil-moisture-model/
# technical-reference, soil-moisture-workflows/blueprint), on the v4.33.0 toolchain.
# The `NicolasRouquette/verso` fork (`fix/combined-img-svg`) this replaced carried two
# patches, both now provided project-side instead of in verso: SVG images embed as
# `<object>` so Graphviz `URL=` node links stay clickable (scripts/svg-objects.py,
# run on html-multi after `lake exe l4yaml-doc`), and image URLs resolve via the
# per-page `<base>` tag against the site root, where `extraFilesHtml` now stages
# `graphs/` once (Doc/Main.lean) instead of once per referencing page.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.33.0"

[[lean_lib]]
name = "Doc.L4YAML"

[[lean_exe]]
name = "l4yaml-doc"
root = "Doc.Main"
supportInterpreter = true
