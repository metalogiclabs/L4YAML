name: Standalone Core Schema Lean 4.36 qualification
on:
  push:
    branches: [test/core-schema-lean436]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1bf6f061924812bc8671fed9d70af98e02991c21
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Bind exact source, tree, ancestors and pinned inputs
        run: |
          set -euo pipefail
          {
            test "$(git rev-parse HEAD)" = 1bf6f061924812bc8671fed9d70af98e02991c21
            test "$(git rev-parse HEAD^{tree})" = 98d5a6855da4f5395fe82302d5f5dfe2496225c1
            git show -s --format='source=%H tree=%T parents=%P' HEAD
            printf 'workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA"
            git merge-base --is-ancestor 37d8025ecc8c15e6764cc1a982104787de9463d8 HEAD
            git merge-base --is-ancestor 72c30c166d560219a9c33204c8f6a0d2dbeebc40 HEAD
            git diff --exit-code 37d8025ecc8c15e6764cc1a982104787de9463d8 HEAD -- lean-toolchain lake-manifest.json doc/lean-toolchain doc/lake-manifest.json .gitmodules yaml-test-suite
            git submodule status --recursive
            git submodule foreach --recursive 'test "$(git rev-parse HEAD)" = "$sha1" && git diff --exit-code'
            cat lean-toolchain
          } 2>&1 | tee "$RUNNER_TEMP/core436-source.log"
          sha256sum lean-toolchain lake-manifest.json lakefile.lean doc/lean-toolchain doc/lake-manifest.json doc/lakefile.toml .gitmodules > "$RUNNER_TEMP/core436-pins.sha256"
      - name: Install pinned Lean through verified elan bootstrap
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elan-bootstrap"
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan-bootstrap/elan.tar.gz"
          printf '%s  %s\n' 0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2 "$RUNNER_TEMP/elan-bootstrap/elan.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/elan-bootstrap/elan.tar.gz" -C "$RUNNER_TEMP/elan-bootstrap"
          "$RUNNER_TEMP/elan-bootstrap/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Build every default target and all suite executables
        run: |
          set -euo pipefail
          lean --version | tee "$RUNNER_TEMP/core436-toolchain.log"
          lake build 2>&1 | tee "$RUNNER_TEMP/core436-build.log"
          lake build tests demo limittests 2>&1 | tee "$RUNNER_TEMP/core436-extra-build.log"
      - name: Check native census readings and repository gates
        run: |
          set -euo pipefail
          lake run dead-census -- --check 2>&1 | tee "$RUNNER_TEMP/core436-census.log"
          lake run census-dashboard -- --check 2>&1 | tee "$RUNNER_TEMP/core436-dashboard.log"
          for gate in check-theorem-keyword check-import-closure check-reflection-index check-doc-graphs check-closure-log check-gate-vocab check-scripts-lean check-pack-births; do
            lake run "$gate" > "$RUNNER_TEMP/core436-$gate.log" 2>&1
          done
      - name: Recheck Core theorem and serialization axiom profiles
        run: |
          set -euo pipefail
          printf '%s\n' 'import L4YAML.Proofs.Schema.SchemaResolution' '#print axioms L4YAML.Proofs.SchemaResolution.coreTagCorrespondenceAll' > "$RUNNER_TEMP/CoreAxioms.lean"
          lake env lean "$RUNNER_TEMP/CoreAxioms.lean" 2>&1 | tee "$RUNNER_TEMP/core436-axioms.log"
          lake run check-serialization-proofs -- --keep "$RUNNER_TEMP/core436-serialization" 2>&1 | tee "$RUNNER_TEMP/core436-serialization.log"
      - name: Run adversarial suite, all ordinary suites, corpus and event axis
        run: |
          set -euo pipefail
          lake exe adversarialinstantiation > "$RUNNER_TEMP/core436-adversarial.log" 2>&1
          tail -5 "$RUNNER_TEMP/core436-adversarial.log"
          lake run run-all-tests -- docs/reports > "$RUNNER_TEMP/core436-suites.log" 2>&1
          tail -20 "$RUNNER_TEMP/core436-suites.log"
          lake exe eventscore --suite yaml-test-suite > "$RUNNER_TEMP/core436-events.log" 2>&1
      - name: Verify preserved source and pins
        if: always()
        run: |
          set -euo pipefail
          {
            test "$(git rev-parse HEAD)" = 1bf6f061924812bc8671fed9d70af98e02991c21
            test "$(git rev-parse HEAD^{tree})" = 98d5a6855da4f5395fe82302d5f5dfe2496225c1
            sha256sum -c "$RUNNER_TEMP/core436-pins.sha256"
            git diff --exit-code
            git diff --cached --exit-code
            git submodule foreach --recursive 'test "$(git rev-parse HEAD)" = "$sha1" && git diff --exit-code'
          } 2>&1 | tee "$RUNNER_TEMP/core436-final-source.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: standalone-core-lean436-1bf6f061
          path: |
            ${{ runner.temp }}/core436-*
            docs/reports/*.txt
            docs/reports/*.json
          if-no-files-found: error
          include-hidden-files: true
