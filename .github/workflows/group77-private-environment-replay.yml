          def nonstandard (axs : Array Name) : Array Name :=
            axs.filter fun n => !L4YAML.allowedCapstoneAxioms.contains n
          def exactProfile (xs : Array Name) (expected : Array String) : Bool :=
            xs.size == expected.size && xs.all (fun n => expected.contains n.toString)
          def targetCheck : L4YAML.AxiomReplayM Bool := do
            let parent := `L4YAML.Proofs.Serialization.TraceOf.StreamBridge.TPendingNode.content_step_park
            let child := `L4YAML.Tests.Guards.ExplicitKeyRouteCut.key_value_content_step
            let prefix := `L4YAML.Tests.Guards.ScalarKeyProducer.scalar_key_prefix_from_scan
            let purePark := `L4YAML.Tests.Guards.ScalarKeyProducer.scalar_key_to_value_park
            let empty := `L4YAML.Tests.Guards.ExplicitKeyRouteCut.key_can_close_empty
            let pa := nonstandard (← collectAxioms parent)
            let ca := nonstandard (← collectAxioms child)
            let ka := nonstandard (← collectAxioms prefix)
            let env := (← getEnv).setExporting false
            let readable := ca.filter (fun n => match env.toKernelEnv.find? n with
              | some (.axiomInfo _) => true
              | _ => false)
            IO.println s!"RAW_PARENT {pa.size}; RAW_CHILD {ca.size}; RAW_PREFIX {ka.size}"
            IO.println s!"READABLE {readable.size}/{ca.size}"
            IO.println s!"CHILD_ONLY {(ca.filter (fun n => !pa.contains n)).size}"
            IO.println s!"PREFIX_ONLY {(ka.filter (fun n => !ca.contains n)).size}"
            unless exactProfile pa expectedChild && exactProfile ca expectedChild &&
                exactProfile ka expectedPrefix && (nonstandard (← collectAxioms purePark)).isEmpty &&
                (nonstandard (← collectAxioms empty)).isEmpty do
              throwError "exact prior profile or pure-control mismatch"
            let mut accepted : Nat := 0
            for n in ca do
              let ok ← L4YAML.axiomAdmitted n
              IO.println s!"LEAF {n}: {ok}"
              if ok then accepted := accepted + 1
            -- Same invocation cache: the prefix cannot acquire a new warrant by name alone.
            let badPrefix ← L4YAML.unvalidatedAxioms prefix
            let badFalse ← L4YAML.unvalidatedAxioms
              `L4YAML.Tests.Guards.ImportedAxiomControls.badFalse
            let badBool ← L4YAML.unvalidatedAxioms
              `L4YAML.Tests.Guards.ImportedAxiomControls.badBoolean
            let good ← L4YAML.unvalidatedAxioms
              `L4YAML.Tests.Guards.ImportedAxiomControls.genuineNative
            let pureBad ← L4YAML.unvalidatedAxioms
              `L4YAML.Tests.Guards.ImportedAxiomControls.pureControl
            IO.println s!"VALIDATED {accepted}/45; PREFIX_UNVALIDATED {badPrefix.size}/39"
            IO.println s!"IMPORTED_CONTROLS false={badFalse.size} forged={badBool.size} real={good.size} pure={pureBad.size}"
            IO.println "PURE_REJECTED: child has raw nonstandard dependencies"
            return readable.size == 45 && accepted == 45 && badPrefix.isEmpty &&
              badFalse.size == 1 && badBool.size == 1 && good.isEmpty && pureBad.isEmpty
          unsafe def main : IO UInt32 := do
            Lean.initSearchPath (← Lean.findSysroot)
            Lean.enableInitializersExecution
            let env ← Lean.importModules #[
              { module := `Tests.Guards.Proofs.ExplicitKeyRouteCut },
              { module := `Tests.Guards.Proofs.ScalarKeyProducer },
              { module := `Tests.Guards.Proofs.ImportedAxiomControls }
            ] {} 0 (loadExts := true) (level := OLeanLevel.private)
            let coreCtx : Lean.Core.Context :=
              { fileName := "<group77-standalone-replay>", fileMap := default }
            let coreState : Lean.Core.State := { env }
            let (ok, _) ← (targetCheck.run' {}).toIO coreCtx coreState
            return if ok then 0 else 1
          end
          LEAN
          cp Tests/Guards/Proofs/StandaloneAxiomReplay.lean ../results/
          cp Tests/Guards/Proofs/ImportedAxiomControls.lean ../results/
          cat >> lakefile.lean <<'LEAN'

          lean_exe «group77-private-replay» where
            root := `Tests.Guards.Proofs.StandaloneAxiomReplay
            supportInterpreter := true
          LEAN
          lake build Tests.Guards.Proofs.ImportedAxiomControls group77-private-replay 2>&1 | tee ../results/standalone-build.log
          git diff --check
      - name: Replay 45 unique leaves once in initialized private environment
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          lake env .lake/build/bin/group77-private-replay 2>&1 | tee ../results/standalone-replay.log
          grep -Fx 'RAW_PARENT 45; RAW_CHILD 45; RAW_PREFIX 39' ../results/standalone-replay.log
          grep -Fx 'READABLE 45/45' ../results/standalone-replay.log
          grep -Fx 'CHILD_ONLY 0' ../results/standalone-replay.log
          grep -Fx 'PREFIX_ONLY 0' ../results/standalone-replay.log
          grep -Fx 'VALIDATED 45/45; PREFIX_UNVALIDATED 0/39' ../results/standalone-replay.log
          grep -Fx 'IMPORTED_CONTROLS false=1 forged=1 real=0 pure=0' ../results/standalone-replay.log
          grep -Fx 'PURE_REJECTED: child has raw nonstandard dependencies' ../results/standalone-replay.log
          test "$(grep -c '^LEAF ' ../results/standalone-replay.log)" = 45
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initialized-private-environment-replay
          path: results/
          if-no-files-found: error
