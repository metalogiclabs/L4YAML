name: Right-Wall fixed-source Arm B — semantic nonuse

on:
  push:
    branches: [research/right-wall-paired-b-20261120]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-b:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Build property-directed consumer and identify residual
        run: |
          git rev-parse HEAD
          lake build Tests.Guards.Proofs.RightWallPairedB
