name: Rule 211 source continuation flip
on:
  push:
    branches: [research/source-stream-rule211-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install repository toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Check exact flipped grammar
        run: |
          git rev-parse HEAD HEAD^{tree}
          lake --version
          lake build L4YAML.Surface.Document
      - name: Price first production accumulator consumer
        run: lake build L4YAML.Proofs.Production.StreamAccum
