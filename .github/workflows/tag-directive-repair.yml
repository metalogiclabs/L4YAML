name: Qualify PR 361 API documentation
on:
  push:
    branches: [test/tag-api-docs]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
      SOURCE: 0cbcd6caa72ae8b42dca351c327e334e5044f89a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0cbcd6caa72ae8b42dca351c327e334e5044f89a
          submodules: recursive
      - name: Bind source and install pinned Lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git rev-parse HEAD HEAD^{tree}
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Populate doc-gen4 module data in small batches
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          free -h
          df -h .
          python3 - <<'PY' > "$RUNNER_TEMP/doc-targets"
          from pathlib import Path
          import re
          seen = set()
          def visit(name):
              path = Path(name.replace(".", "/") + ".lean")
              if name in seen or not path.is_file():
                  return
              seen.add(name)
              for dep in re.findall(r"^(?:(?:public|meta)\s+)*import\s+(?:all\s+)?([\w.]+)", path.read_text(), re.M):
                  visit(dep)
              print("+" + name + ":docInfo")
          for root in ["L4YAML", "Tests.Guards", "Tests.DeclineReachCensus", "Tests.DeclineArmCensus", "Tests.DeclineCornerCensus", "Tests.Reflections"]:
              visit(root)
          PY
          wc -l "$RUNNER_TEMP/doc-targets"
          xargs -r -n 4 lake build < "$RUNNER_TEMP/doc-targets" > "$RUNNER_TEMP/doc-prime.log" 2>&1 || { tail -100 "$RUNNER_TEMP/doc-prime.log"; exit 1; }
      - name: Run the complete repository API documentation gate
        shell: bash
        run: |
          set -euo pipefail
          lake build :docs 2>&1 | tee "$RUNNER_TEMP/full-api-docs.log"
          test -s .lake/build/doc/index.html
          git diff --exit-code
          git rev-parse HEAD HEAD^{tree}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr361-api-docs-qualification
          path: |
            ${{ runner.temp }}/doc-targets
            ${{ runner.temp }}/doc-prime.log
            ${{ runner.temp }}/full-api-docs.log
