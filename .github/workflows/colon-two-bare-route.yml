name: Bounded annotated two-bare route proof
on:
  push:
    branches: [research/colon-two-bare-route-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Build bounded source-grammar proof
        run: |
          git rev-parse HEAD HEAD^{tree}
          lake --version
          lake build Tests.Guards.Proofs.ColonTwoBareDocuments
