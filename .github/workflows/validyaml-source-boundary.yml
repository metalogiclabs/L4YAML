name: ValidYaml source boundary qualification

on:
  push:
    branches:
      - experiment/validyaml-source-boundary-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build imported grammar and compile countermodel
        run: |
          set -euo pipefail
          cat lean-toolchain
          lake build L4YAML.Spec.Grammar
          lake env lean Tests/Research/ValidYamlSourceBoundary.lean
