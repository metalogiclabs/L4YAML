name: Source-pinned L4YAML 302 and 361 integration probe
on:
  push:
    branches:
      - experiment/merge-302-361-2836-20261123
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '302'
            head: bcc2a828addf4f3d8513aca681ae28fdeb2709a5
            output: experiment/refresh-302-2836-20261123
          - pr: '361'
            head: a4cb16d488f6c6cf325a1b03d3646e7b79227283
            output: experiment/refresh-361-2836-20261123
    steps:
      - name: Checkout tool branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Real Git three-way merge, exact source identities
        shell: bash
        env:
          OUR_HEAD: ${{ matrix.head }}
          PR: ${{ matrix.pr }}
          OUTPUT_BRANCH: ${{ matrix.output }}
          UPSTREAM_HEAD: 2836db2fef546ec69873297f499c43ec9aadf3c7
          COMMON_ANCESTOR: 9307af97a0bb330472b3a4be7026bfc4d04329b1
        run: |
          set -euo pipefail
          git config user.name "MathGraph integration qualification"
          git config user.email "mathgraph-integration@users.noreply.github.com"
          git remote add upstream https://github.com/nasa-jpl/L4YAML.git
          git fetch --no-tags origin "$OUR_HEAD"
          git fetch --no-tags upstream refs/heads/fix-a-grammar-completeness
          git cat-file -e "$UPSTREAM_HEAD^{commit}"
          test "$(git rev-parse "$OUR_HEAD")" = "$OUR_HEAD"
          git merge-base --is-ancestor "$COMMON_ANCESTOR" "$OUR_HEAD"
          git merge-base --is-ancestor "$COMMON_ANCESTOR" "$UPSTREAM_HEAD"
          git switch --detach "$OUR_HEAD"
          echo "Source: PR #$PR $OUR_HEAD"
          echo "Upstream exact: $UPSTREAM_HEAD"
          echo "Merge base: $(git merge-base "$OUR_HEAD" "$UPSTREAM_HEAD")"
          if ! git merge --no-ff --no-commit "$UPSTREAM_HEAD"; then
            echo "::notice::Automatic merge requires a generated-census reconciliation"
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "Tests/Guards/Proofs/DeadDeclarationCensus.lean" ]]; then
              echo "::error::Unexpected conflicts; refusing to publish any tree"
              printf '%s\n' "${conflicts[@]}"
              exit 2
            fi
            python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("Tests/Guards/Proofs/DeadDeclarationCensus.lean")
          s = path.read_text()
          assert s.count("<<<<<<< HEAD\n") == 1
          assert s.count("=======\n") == 1
          assert s.count(">>>>>>> 2836db2fef546ec69873297f499c43ec9aadf3c7\n") == 1
          before, rest = s.split("<<<<<<< HEAD\n", 1)
          ours, rest = rest.split("=======\n", 1)
          upstream, after = rest.split(">>>>>>> 2836db2fef546ec69873297f499c43ec9aadf3c7\n", 1)
          marker = "def expectedDeadCensus : String :=\n"
          assert ours.count(marker) == 1 and upstream.count(marker) == 1
          ours_history, ours_pin = ours.split(marker)
          upstream_history, upstream_pin = upstream.split(marker)
          assert "2026-11-22 (item 531" in upstream_history
          if os.environ["PR"] == "302":
              assert "#302 over item 529" in ours_history
              assert "population=14333" in ours_pin
          else:
              assert "TAG directive repair" in ours_history
              assert "population=14264" in ours_pin
          assert "population=14260" in upstream_pin
          # Keep both histories; retain the original PR census pin provisionally.
          # Actual merged source census MUST be re-measured by Lean before promotion.
          merged = before + upstream_history + ours_history + marker + ours_pin + after
          assert merged.count(marker) == 1
          assert "<<<<<<<" not in merged and ">>>>>>>" not in merged
          path.write_text(merged)
          print("Reconciled both audit histories. Census pin provisional; native remeasurement required.")
          PY
            git add Tests/Guards/Proofs/DeadDeclarationCensus.lean
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          test -f DOCS.md
          test -f Tests/AdversarialInstantiation.lean
          test -f Tests/Guards/Proofs/DeadDeclarationCensus.lean
          git diff --cached --check
          git commit -m "Merge upstream 2836db2f into PR #$PR for qualification"
          test "$(git rev-parse HEAD^1)" = "$OUR_HEAD"
          test "$(git rev-parse HEAD^2)" = "$UPSTREAM_HEAD"
          git diff "$OUR_HEAD" HEAD --stat
          git diff "$UPSTREAM_HEAD" HEAD --stat
          echo "Merged SHA=$(git rev-parse HEAD)"
          echo "Merged tree SHA=$(git rev-parse HEAD^{tree})"
          echo "Merged DOCS SHA=$(git rev-parse HEAD:DOCS.md)"
          git status --short
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          echo "Candidate integration branch: $OUTPUT_BRANCH"
