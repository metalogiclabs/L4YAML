name: Replay only API documentation on frozen item 541 candidate
on:
  push:
    branches: [test/content-slot-item541-qualification]
permissions:
  contents: read
  actions: read
concurrency:
  group: pr-384-item541-qualification
  cancel-in-progress: false
jobs:
  api-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: 1
      OLD: 05749b745f8c88fad8f1b6971aaa22b65155f489
      OWNER: 1383fa62e838576fb9c712b4af89b5e381aaaab4
      SOURCE: f667f7a7ec78931e2ac308bf31a29d9e37d6c75c
      TREE: 1db95bdc6b769fbd94199617cbd2e07f6c5f0d00
    steps:
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/L4YAML
          ref: 05749b745f8c88fad8f1b6971aaa22b65155f489
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Restore exact frozen native-qualified source
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p ../results ../replay
          git rev-parse HEAD HEAD^{tree} > ../replay/initial.txt
          test "$(git rev-parse HEAD)" = "$OLD"
          git fetch --no-tags https://github.com/nasa-jpl/L4YAML.git "$OWNER"
          test "$(git rev-parse "$OWNER^{tree}")" = 0c7dced413db0510b0a0a144ca2ca74111cf6a77
          gh api repos/metalogiclabs/L4YAML/actions/artifacts/15235219972/zip > "$RUNNER_TEMP/prior.zip"
          echo "2ad21b81badd79aa6eaaec48739d521ae0e35aeccd01a7ee4777cd559fe6e5da  $RUNNER_TEMP/prior.zip" | sha256sum -c -
          unzip -t "$RUNNER_TEMP/prior.zip" > ../replay/prior-crc.log
          unzip -q "$RUNNER_TEMP/prior.zip" -d ../results
          sha256sum -c ../results/qualified.sha256 | tee ../replay/qualified-digests.txt
          git bundle verify ../results/qualified.bundle > ../replay/bundle-verify.log 2>&1
          git fetch ../results/qualified.bundle HEAD
          git checkout --detach "$SOURCE"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          git merge-base --is-ancestor "$OLD" HEAD
          git merge-base --is-ancestor "$OWNER" HEAD
          git diff --exit-code "$OWNER" HEAD -- lean-toolchain lake-manifest.json doc/lean-toolchain doc/lake-manifest.json .gitmodules .github/workflows
          cmp ../results/axioms-before.log ../results/axioms-after.log
          cmp ../results/root-axioms-before.log ../results/root-axioms-after.log
          git rev-parse HEAD HEAD^{tree} > ../replay/source.txt
          git diff --binary "$OLD" HEAD > ../replay/publication.patch
          git diff --binary "$OWNER" HEAD > ../replay/owner-delta.patch
          git ls-tree -r HEAD > ../replay/qualified-tree.txt
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.36.0
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - uses: actions/cache/restore@v4
        with:
          path: source/.lake
          key: pr-refresh-item541-384-46068890855
      - name: Replay API documentation only with one Lean thread
        working-directory: source
        run: |
          set -Eeuo pipefail
          lean --version | tee ../replay/lean-version.txt
          free -h > ../replay/memory-before.txt
          /usr/bin/time -v lake build :docs > ../replay/api-docs.log 2>&1
          tail -30 ../replay/api-docs.log
          git diff --exit-code
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          printf 'API_DOCS_QUALIFIED SOURCE=%s TREE=%s; prior native/bindings/Verso retained; no publication\n' "$SOURCE" "$TREE" | tee ../replay/qualification.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-384-item541-api-docs-only-evidence
          path: replay/
          if-no-files-found: error
