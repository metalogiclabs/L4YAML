name: MathGraph native explicit-tag fidelity probe
on:
  push:
    branches: [test/python-explicit-tag-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tag-fidelity:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: 218b41c974027f7433e6b0c369789a38e50b3740
      - name: Install pinned Lean toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact Lean and C sources
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          lean --version
          lake build L4YAML
          cmake -B ffi/out -S ffi
          cmake --build ffi/out -j 2
          test -f ffi/out/libl4yaml.so
      - name: Observe exact API outputs, raw tags, and controls
        env:
          PYTHONPATH: python
          L4YAML_LIB: ${{ github.workspace }}/ffi/out/libl4yaml.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/ffi/out
        run: |
          python3 -m pip install --user PyYAML pytest
          python3 - <<'PY'
          import json
          import yaml
          import l4yaml
          from l4yaml.compat import safe_load

          cases = [
              ('plain-false-control', 'false', False, 'bool', False),
              ('quoted-false-control', '"false"', 'false', 'str', False),
              ('plain-int-control', '42', 42, 'int', False),
              ('quoted-int-control', '"42"', '42', 'str', False),
              ('explicit-str-false', '!!str false', 'false', 'str', True),
              ('explicit-str-null', '!!str null', 'null', 'str', True),
              ('explicit-str-full-uri', '!<tag:yaml.org,2002:str> false', 'false', 'str', True),
              ('explicit-int-quoted', '!!int "42"', 42, 'int', True),
              ('explicit-bool-quoted', '!!bool "false"', False, 'bool', True),
              ('explicit-float-quoted', '!!float "3.14"', 3.14, 'float', True),
              ('explicit-str-quoted', '!!str "false"', 'false', 'str', True),
          ]
          observations=[]
          for name, source, expected, expected_type, tagged in cases:
              result={'case':name, 'source':source, 'expected':repr(expected),
                      'expected_type':expected_type, 'tagged':tagged}
              try:
                  raw=l4yaml.load(source)
                  result.update(raw_tag=raw.tag,raw_style=raw.style,
                                raw_content=raw.as_str())
              except Exception as exc:
                  result['raw_error']=type(exc).__name__+': '+str(exc)
              try:
                  actual=safe_load(source)
                  result.update(actual=repr(actual), actual_type=type(actual).__name__,
                                exact=(type(actual).__name__==expected_type and actual==expected))
              except Exception as exc:
                  result.update(actual_error=type(exc).__name__+': '+str(exc),exact=False)
              try:
                  reference=yaml.safe_load(source)
                  result.update(reference=repr(reference),
                                reference_type=type(reference).__name__)
              except Exception as exc:
                  result['reference_error']=type(exc).__name__+': '+str(exc)
              observations.append(result)
              print('NATIVE_TAG_OBSERVATION='+json.dumps(result,sort_keys=True))
          positives=[x for x in observations if not x['tagged']]
          print('NATIVE_TAG_SUMMARY='+json.dumps({
              'source_sha':'218b41c974027f7433e6b0c369789a38e50b3740',
              'positive_controls_correct':sum(x['exact'] for x in positives),
              'positive_controls_total':len(positives),
              'tagged_cases_correct':sum(x['exact'] for x in observations if x['tagged']),
              'tagged_cases_total':sum(x['tagged'] for x in observations),
          },sort_keys=True))
          assert all(x['exact'] for x in positives), 'A positive control failed'
          PY
