name: Normalize actual capstone key-slot callers and expose proof goals
on:
  push:
    branches: [test/root-domain-qualification]
    paths:
      - .github/workflows/actual-on-kslot-normalized.yml
      - Research/RootComposition/actual-on-kslot-normalized.json
permissions:
  contents: read
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/L4YAML
          ref: c5d6e3f5190d20d5f4bddfe6fb5ce48762407845
          path: evidence
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/L4YAML
          ref: 4c54da7e3716ab0197b126294474bb2868651402
          submodules: recursive
          path: source
      - name: Restore and check both exact qualified bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/price root-archive own-archive
          git -C harness rev-parse HEAD > results/harness.txt
          git -C evidence rev-parse HEAD > results/evidence-head.txt
          test "$(cat results/evidence-head.txt)" = c5d6e3f5190d20d5f4bddfe6fb5ce48762407845
          echo 'e72eccdef198414f90b8508cefd34aa7491afc3fcddbad067dc32ef2471c789c  evidence/Research/RootComposition/qualified-root-evidence.zip' | sha256sum -c -
          echo '022c53717d61556ab4b9a2a3048dfba6fb593d9904dd473cba136265a42b9c27  evidence/Research/RootComposition/qualified-r2-own-evidence.zip' | sha256sum -c -
          unzip -t evidence/Research/RootComposition/qualified-root-evidence.zip > results/root-zip-crc.txt
          unzip -t evidence/Research/RootComposition/qualified-r2-own-evidence.zip > results/own-zip-crc.txt
          unzip -q evidence/Research/RootComposition/qualified-root-evidence.zip -d root-archive
          unzip -q evidence/Research/RootComposition/qualified-r2-own-evidence.zip -d own-archive
          cp evidence/Research/RootComposition/{FINAL_ROOT_RECEIPT,R2_OWN_RECEIPT}.json results/
          cp harness/Research/RootComposition/actual-on-kslot-normalized.json results/
          sha256sum results/actual-on-kslot-normalized.json > results/spec-sha256.txt
          cd source
          git bundle verify ../root-archive/root-context/source.bundle
          git fetch ../root-archive/root-context/source.bundle HEAD
          git checkout --detach 967d3503b30dde555078929f118101cba9f95a56
          test "$(git rev-parse HEAD^{tree})" = 20e10d2041c66d199d4408b4c37f82b6ec8cddf0
          mapfile -t bundles < <(find ../own-archive -type f -name source.bundle)
          test "${#bundles[@]}" = 1
          git bundle verify "${bundles[0]}"
          git fetch "${bundles[0]}" HEAD
          git checkout --detach 9f59de2e097d0174f14651d91a88917c026e3acb
          test "$(git rev-parse HEAD)" = 9f59de2e097d0174f14651d91a88917c026e3acb
          test "$(git rev-parse HEAD^{tree})" = eec308182759db30ee036bbd0d845219b2386fcb
          test "$(git rev-parse HEAD^)" = 967d3503b30dde555078929f118101cba9f95a56
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} HEAD^ > ../results/source-identity.txt
          printf '%s\n' 'c9ae3a8aa8e07f617d78eab588205334d5ab4a0cd88e905ec7a3110bce75b6ed  L4YAML/Proofs/Production/StreamAccum.lean' 'd39cfff27b6fad724f60d507eba397cf08dba712ae3dabf423d6d00189e789cd  L4YAML/Proofs/Scanner/RegisterWitness.lean' > ../results/baseline-source-sha256.txt
          sha256sum -c ../results/baseline-source-sha256.txt
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.36.0
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: source/.lake
          key: actual-on-kslot-9f59de2e-lean4360-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            actual-on-kslot-9f59de2e-lean4360-${{ runner.os }}-
            r2-own-retirement-lean4360-${{ runner.os }}-45879351495
      - name: Bind actual ON roster and exact-source axiom baseline
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          lake build L4YAML scripts-flip > ../results/baseline-build.txt 2>&1
          lake run capstone-path > ../results/actual-capstone-path.txt 2>&1
          grep -E '^CAPSTONE-PATH .* on=7 ' ../results/actual-capstone-path.txt
          while IFS= read -r row; do
            grep -F -- "$row" ../results/actual-capstone-path.txt >> ../results/on-roster.txt
          done <<'ROSTER'
          L4YAML.Proofs.StreamAccum.PendingNode.pendingContent: [9].h_vpack ∨ PackAlt on-relay
          L4YAML.Proofs.StreamAccum.PendingNode.pendingBlockContent: [12].h_kslot ∨ PackAlt on-relay
          L4YAML.Proofs.StreamAccum.PendingNode.pendingBlock: [10].h_kslot ∨ PackAlt on-relay
          L4YAML.Proofs.StreamAccum.accum_block_on_closeThenBlock: [10].h_vpack ∨ PackAlt on-drop
          L4YAML.Proofs.StreamAccum.accum_block_on_pendingBlock: [13].h_kslot ∨ PackAlt on-drop
          L4YAML.Proofs.StreamAccum.accum_block_on_pendingBlockContent: [15].h_kslot ∨ PackAlt on-drop
          L4YAML.Proofs.StreamAccum.accum_block_on_pendingContent: [16].h_vpack ∨ PackAlt on-relay
          ROSTER
          for kind in final-axioms final-root-axioms; do
            mapfile -t paths < <(find ../own-archive -type f -name "$kind.txt")
            test "${#paths[@]}" = 1
            cp "${paths[0]}" "../results/retained-$kind.txt"
          done
          lake env lean Research/ContentSlot/AxiomAudit.lean > ../results/baseline-axioms.txt 2>&1
          lake env lean Research/ContentSlot/RootAudit.lean > ../results/baseline-root-axioms.txt 2>&1
          diff -u ../results/retained-final-axioms.txt ../results/baseline-axioms.txt
          diff -u ../results/retained-final-root-axioms.txt ../results/baseline-root-axioms.txt
          sha256sum -c ../results/baseline-source-sha256.txt
          test -z "$(git status --porcelain)"
      - name: Price normalized key-slot callers and restore the exact source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for family in normalized; do
            spec="../harness/Research/RootComposition/actual-on-kslot-normalized.json"
            lake exe scripts-flip "$spec" --rev HEAD --dry > "../results/price/$family-dry.txt" 2>&1
            status=0
            lake exe scripts-flip "$spec" --rev HEAD > "../results/price/$family-report.txt" 2>&1 || status=$?
            echo "$status" > "../results/price/$family-exit.txt"
            test "$status" = 0 -o "$status" = 3
            grep -E '^ACTUAL-ON|^--- site|^round |^after |^INCOMPLETE|^FLOOR|^restored |^rebuilt ' "../results/price/$family-report.txt" || true
            sha256sum -c ../results/baseline-source-sha256.txt
            test -z "$(git status --porcelain)"
            test "$(git rev-parse HEAD^{tree})" = eec308182759db30ee036bbd0d845219b2386fcb
            lake build L4YAML > "../results/price/$family-restored-build.txt" 2>&1
            lake env lean Research/ContentSlot/AxiomAudit.lean > "../results/price/$family-restored-axioms.txt" 2>&1
            lake env lean Research/ContentSlot/RootAudit.lean > "../results/price/$family-restored-root-axioms.txt" 2>&1
            diff -u ../results/baseline-axioms.txt "../results/price/$family-restored-axioms.txt"
            diff -u ../results/baseline-root-axioms.txt "../results/price/$family-restored-root-axioms.txt"
          done
          printf '%s\n' 'diagnostic_only=true' 'exact_source_restored=true' 'checked_axioms_unchanged=true' 'ON_retirement=NOT_CLAIMED' 'full_R2=NOT_CLAIMED' > ../results/outcomes.txt
      - uses: actions/cache/save@v4
        if: success()
        continue-on-error: true
        with:
          path: source/.lake
          key: actual-on-kslot-9f59de2e-lean4360-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-on-kslot-normalized
          path: results/
          if-no-files-found: error
