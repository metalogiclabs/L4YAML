name: Exact annotated colon decision
on:
  push:
    branches: [test/colon-annotated-decision]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install repository-pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Record exact source and verifier
        run: |
          git rev-parse HEAD HEAD^{tree}
          cat lean-toolchain
          lean --version
          lake --version
      - name: Check full annotated nonmembership and native S3 refutation
        run: lake build Tests.Guards.Proofs.ColonAnnotatedDecision
      - name: Check retained source-grammar positive witness
        run: lake build Tests.Guards.Proofs.TwoBareSurfaceWitness
