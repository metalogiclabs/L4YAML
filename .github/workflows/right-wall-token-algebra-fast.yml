name: Right-Wall fast token algebra feedback
on:
  push:
    branches: [research/right-wall-token-algebra-fast-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Prove universal token-event algebra
        run: |
          git rev-parse HEAD
          lake build Tests.Guards.Proofs.RightWallTokenAlgebraFast
