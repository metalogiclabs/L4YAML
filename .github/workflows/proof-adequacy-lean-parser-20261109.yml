name: Exact-source Lean parser adequacy control
on:
  push:
    branches: [ research/proof-adequacy-lean-parser-20261109 ]

permissions:
  contents: read

jobs:
  lean-parser-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the exact public upstream source
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/nasa-jpl/L4YAML.git
          git fetch --no-tags --depth=1 upstream fix-a-grammar-completeness
          git checkout --detach 46d33cf6123782f91c91e5fc396211c7e6bf4351
          test "$(git rev-parse HEAD)" = "46d33cf6123782f91c91e5fc396211c7e6bf4351"
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          echo "EXACT_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original universal source predicate and parser
        run: |
          lake build tryscan tryparse
          lake env lean Tests/Guards/Proofs/SuffixGapAudit.lean
          echo "SOURCE_UNIVERSAL_LEMMA_COMPILED"
      - name: Compile original universal lemma and parser guard in one Lean file
        run: |
          set -euo pipefail
          # Keep the upstream file unchanged. The ephemeral file preserves all
          # original source bytes and adds an independent executable check.
          cp Tests/Guards/Proofs/SuffixGapAudit.lean ProofAdequacyCombined.lean
          cat >> ProofAdequacyCombined.lean <<'LEAN'

          #check Tests.Guards.SuffixGapAudit.inYamlLanguage_everything

          private def proofAdequacyInvalidPlain : String :=
            "a: x" ++ String.singleton (Char.ofNat 0x01) ++ "y\n"

          #guard
            match L4YAML.TokenParser.parseYaml proofAdequacyInvalidPlain with
            | .error _ => true
            | .ok _ => false

          #eval
            match L4YAML.TokenParser.parseYaml proofAdequacyInvalidPlain with
            | .error _ => "REJECT"
            | .ok _ => "ACCEPT"
          LEAN
          lake env lean ProofAdequacyCombined.lean
          echo "SOURCE_LEMMA_AND_PARSER_GUARD_PASS_IN_ONE_FILE"
          rm ProofAdequacyCombined.lean
          test -z "$(git status --porcelain)"
