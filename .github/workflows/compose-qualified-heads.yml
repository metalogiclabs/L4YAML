name: Probe combined Core TAG exact-source composition
on:
  push:
    branches:
      - experiment/compose-qualified-pr-heads-20261123
permissions:
  contents: write
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Three-way compose merged Core and TAG trees
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MathGraph composition probe"
          git config user.email "mathgraph-integration@users.noreply.github.com"
          A=5df9d2a5970b32d658792b61862c9fd16a2981b7
          B=2fd1418f0ba8f54bb5549bdbef8e8f320c73bd93
          UP=2836db2fef546ec69873297f499c43ec9aadf3c7
          git fetch --no-tags origin "$A" "$B"
          test "$(git merge-base "$A" "$B")" = "$UP"
          git switch --detach "$A"
          if ! git merge --no-ff --no-commit "$B"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "Tests/Guards/Proofs/DeadDeclarationCensus.lean" ]]; then
              echo "::error::Unexpected Core/TAG overlap: manual review required"
              printf '%s\n' "${conflicts[@]}"
              exit 2
            fi
            python3 - <<'PY'
          from pathlib import Path
          p=Path("Tests/Guards/Proofs/DeadDeclarationCensus.lean")
          s=p.read_text()
          assert s.count("<<<<<<< HEAD\n")==1
          assert s.count("=======\n")==1
          marker=">>>>>>> 2fd1418f0ba8f54bb5549bdbef8e8f320c73bd93\n"
          assert s.count(marker)==1
          prefix,rest=s.split("<<<<<<< HEAD\n",1)
          core,rest=rest.split("=======\n",1)
          tag,suffix=rest.split(marker,1)
          needle="def expectedDeadCensus : String :=\n"
          assert core.count(needle)==1 and tag.count(needle)==1
          core_history,core_pin=core.split(needle)
          tag_history,tag_pin=tag.split(needle)
          assert "#302 over item 529" in core_history
          assert "TAG directive repair" in tag_history
          assert "B-roster=3533" in core_pin
          assert "B-roster=3344" in tag_pin
          # The TAG tree retains a 3344-member B-roster, so take its pin
          # as provisional; do NOT sum or guess the combined population.
          merged=prefix+core_history+tag_history+needle+tag_pin+suffix
          assert merged.count(needle)==1
          assert "<<<<<<<" not in merged and ">>>>>>>" not in merged
          p.write_text(merged)
          print("Kept both histories and TAG B-roster pin; combined census unmeasured.")
          PY
            git add Tests/Guards/Proofs/DeadDeclarationCensus.lean
          fi
          test -f L4YAML/Spec/CoreSchema.lean
          test -f Tests/Guards/Proofs/TagDirectiveRepair.lean
          grep -q "testCoreTagCorrespondence" Tests/AdversarialInstantiation.lean
          grep -q "testTagDirectiveUniqueness" Tests/AdversarialInstantiation.lean
          grep -q "TAG directive amendment" DOCS.md
          git diff --cached --check
          git commit -m "Merge Core #302 and TAG #361 integration candidates at upstream 2836db2f"
          test "$(git rev-parse HEAD^1)" = "$A"
          test "$(git rev-parse HEAD^2)" = "$B"
          echo "Combined SHA=$(git rev-parse HEAD)"
          echo "Combined tree=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:refs/heads/experiment/combined-qualified-heads-2836-20261123
