name: MathGraph Right-Wall semantic verdict test

on:
  push:
    branches:
      - research/right-wall-verdict-coherence-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Qualify logical requirement against exact source
        run: |
          git rev-parse HEAD
          lake build Tests.Guards.Proofs.RightWallVerdictCoherence
