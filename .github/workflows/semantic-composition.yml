name: Semantic composition experiment (300 x 370)
on:
  push:
    branches:
      - experiment/semantic-composition-300-370-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
      - name: Pin source and toolchain
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          cat lean-toolchain
          lean --version
          lake --version
      - name: Build Lean and the native C library
        run: |
          set -euxo pipefail
          lake build
          cmake -S ffi -B ffi/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ffi/build --parallel 2
          find ffi -name 'libl4yaml.so' -print
      - name: Run exact-source composition and numeric tests
        run: |
          set -euxo pipefail
          python3 -m pip install --user pytest
          LIB="$(find ffi -name 'libl4yaml.so' -type f | head -n 1)"
          test -n "$LIB"
          export L4YAML_LIB="$PWD/$LIB"
          export PYTHONPATH="$PWD/python"
          python3 -m pytest -q -ra python/tests/test_semantic_composition.py python/tests/test_compat_core_numeric_fidelity.py | tee semantic-composition-results.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-composition-${{ github.sha }}
          path: |
            semantic-composition-results.txt
            lean-toolchain
          if-no-files-found: warn
