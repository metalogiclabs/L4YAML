name: Five-way independent integration reconstruction
on:
  push:
    branches:
      - experiment/five-way-independent-replay-20261125
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    outputs:
      source: ${{ steps.freeze.outputs.source }}
      tree: ${{ steps.freeze.outputs.tree }}
    env:
      LEAN_NUM_THREADS: 2
      UP: cb899c0fa4529d4b40d701f04f5c494047a6b695
      PYTHON_HEAD: dcf6ad15503dd3be569fd983e94d8991a3379e00
      CORE_HEAD: dc9c881577286e1f27b1c4151f599716fe4c6152
      TAG_HEAD: e851e63003872d57509ed06e84346bd4ff893000
      DUMP_HEAD: e8db9cf2dff3eb4a857c4cfae852749326c021f6
      AXIOM_HEAD: c5e0f0c6b449261d23fef5ddd588c360d5e5d630
      CANDIDATE_BRANCH: experiment/five-way-independent-candidate-20261125
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Derive merged source from only upstream and exact reviewed heads
        shell: bash
        run: |
          set -Eeuo pipefail
          E="$RUNNER_TEMP/independent-evidence"
          mkdir -p "$E"
          export E
          exec > >(tee "$E/derivation.log") 2>&1
          git config user.name "MathGraph independent integration"
          git config user.email "mathgraph-qualification@users.noreply.github.com"
          git config rerere.enabled false
          git config merge.conflictStyle diff3
          for sha in "$UP" "$PYTHON_HEAD" "$CORE_HEAD" "$TAG_HEAD" "$DUMP_HEAD" "$AXIOM_HEAD"; do
            git cat-file -e "$sha^{commit}" || git fetch --no-tags origin "$sha"
          done
          git switch --detach "$UP"
          python3 - <<'PY'
          import difflib, json, os, re, subprocess
          from pathlib import Path
          E=Path(os.environ["E"])
          up=os.environ["UP"]
          heads=[(300,os.environ["PYTHON_HEAD"]),(302,os.environ["CORE_HEAD"]),(361,os.environ["TAG_HEAD"]),(370,os.environ["DUMP_HEAD"]),(371,os.environ["AXIOM_HEAD"])]
          C="Tests/Guards/Proofs/DeadDeclarationCensus.lean"
          R="Tests/Guards/Proofs/DeadDeclarationRoster.lean"
          P="L4YAML/Capstones.lean"
          def git(*args):
              return subprocess.check_output(["git",*args],text=True)
          def call(*args):
              subprocess.check_call(["git",*args])
          def source(ref,path):
              return git("show",f"{ref}:{path}")
          def write(path,t):
              Path(path).write_text(t)
          def save(name,t):
              (E/name).write_text(t)
          def delta(a,b):
              return "".join(difflib.unified_diff(a.splitlines(True),b.splitlines(True),fromfile="before",tofile="after"))
          pin=re.compile(r'^  "population=[^"\n]+"$',re.M)
          def normalized(t):
              assert len(pin.findall(t))==1
              return pin.sub('  "population=PROVISIONAL"',t)
          upc=source(up,C); upr=source(up,R)
          provisional=pin.findall(upc)[0]
          assert "A-orphan=" in provisional
          history=normalized(upc)
          save("upstream-census.lean",upc); save("upstream-roster.lean",upr)
          expected_counts={300:0,302:2,361:2,370:1,371:1}
          allowed_bases={300:"2836db2fef546ec69873297f499c43ec9aadf3c7",302:"ca977c71fd3f7ce2f4dad1697cbb434b83fb2124",361:"ca977c71fd3f7ce2f4dad1697cbb434b83fb2124",370:"ca977c71fd3f7ce2f4dad1697cbb434b83fb2124",371:"ca977c71fd3f7ce2f4dad1697cbb434b83fb2124"}
          allowed={C,R,P}
          records=[]
          def reconcile_capstone(pr,base,sha):
              ours=git("show",f":2:{P}")
              theirs=git("show",f":3:{P}")
              b=source(base,P)
              if pr==302:
                  # Core and upstream add different entries at the same position
                  # in the two capstone SET pins. Resolve from the source deltas,
                  # retaining both exact entries in lexical order within that slot.
                  aa=b.splitlines(True); bb=theirs.splitlines(True)
                  ops=[x for x in difflib.SequenceMatcher(None,aa,bb,autojunk=False).get_opcodes() if x[0]!="equal"]
                  assert len(ops)==4
                  t=ours
                  for tag,i,j,k,l in ops:
                      old="".join(aa[i:j]); new="".join(bb[k:l])
                      if tag=="replace":
                          assert old.startswith("| 5 values |") and new.startswith("| 5 values |") and "coreTagCorrespondenceAll" in new
                          assert t.count(old)==1
                          t=t.replace(old,new,1)
                      elif tag=="insert":
                          assert l-k==1 and i>0 and i<len(aa)
                          left,right=aa[i-1],aa[i]
                          assert t.count(left)==1 and t.count(right)==1
                          start=t.index(left)+len(left)
                          end=t.index(right,start)
                          gap=t[start:end]
                          if new.startswith("public import "):
                              assert new=="public import L4YAML.Proofs.Schema.SchemaResolution\n" and gap==""
                              insert=new
                          else:
                              assert new.startswith("L4YAML.Proofs.SchemaResolution.coreTagCorrespondenceAll")
                              assert gap.startswith("L4YAML.Proofs.Serialization.ScannerShape.scanFiltered_parseStream_ok_checkFrom_full") and len(gap.splitlines())==1
                              assert new.endswith(": pure\n")==gap.endswith(": pure\n")
                              insert="".join(sorted([new,gap]))
                          t=t[:start]+insert+t[end:]
                      else:
                          raise AssertionError(("Unexpected Core capstone delta",tag))
                  save("capstones-302-source-derived.delta",delta(ours,t))
                  write(P,t); call("add",P)
                  return
              block=""
              if pr==371:
                  m=re.search(r'(?m)^-- Replay needs the actual axiom types.*?\n(?=public meta import L4YAML.CapstoneAttr$)',theirs,re.S|re.M)
                  assert m, "No exact private replay import block"
                  block=m.group()
                  assert block not in b and block not in ours
                  assert len(re.findall(r"^import all ",block,re.M))==13
                  theirs=theirs[:m.start()]+theirs[m.end():]
              for k,t in (("ours",ours),("base",b),("incoming-normalized",theirs)):
                  save(f"capstones-{pr}-{k}.lean",t)
              result=subprocess.run(["git","merge-file","-p",str(E/f"capstones-{pr}-ours.lean"),str(E/f"capstones-{pr}-base.lean"),str(E/f"capstones-{pr}-incoming-normalized.lean")],capture_output=True,text=True)
              save(f"capstones-{pr}-threeway.lean",result.stdout)
              assert result.returncode==0,"Non-import capstone conflict requires review"
              t=result.stdout
              if block:
                  anchor="public meta import L4YAML.CapstoneAttr\n"
                  assert t.count(anchor)==1 and block not in t
                  t=t.replace(anchor,block+anchor)
              write(P,t); call("add",P)
          for pr,sha in heads:
              base=git("merge-base",up,sha).strip()
              assert base==allowed_bases[pr],(pr,base)
              before=git("rev-parse","HEAD").strip()
              # Read only the original reviewed PR delta against its true upstream ancestor.
              a=normalized(source(base,C)); b=normalized(source(sha,C))
              save(f"census-pr{pr}-original.delta",delta(a,b))
              aa=a.splitlines(True); bb=b.splitlines(True)
              ops=[x for x in difflib.SequenceMatcher(None,aa,bb,autojunk=False).get_opcodes() if x[0]!="equal"]
              assert len(ops)==expected_counts[pr],(pr,ops)
              prev=history
              for tag,i,j,k,l in ops:
                  old="".join(aa[i:j]); new="".join(bb[k:l])
                  if tag=="insert":
                      assert new.startswith("-- ") and all(x.startswith("--") for x in new.splitlines())
                      anchor=aa[i]
                      assert anchor.startswith("-- 2026-11-") and history.count(anchor)==1 and new not in history
                      history=history.replace(anchor,new+anchor,1)
                  elif tag=="replace":
                      assert pr==361 and old=="  a name leaving it was deleted or reached by a capstone.\n"
                      assert new=="  a name leaving it was deleted, reached by a library root, or reclassified\n  (including test-only reach).\n"
                      assert history.count(old)==1
                      history=history.replace(old,new,1)
                  else:
                      raise AssertionError(f"Unsupported census edit {pr} {tag}")
              save(f"census-pr{pr}-applied.delta",delta(prev,history))
              merge=subprocess.run(["git","merge","--no-ff","--no-commit",sha],capture_output=True,text=True)
              save(f"merge-pr{pr}.log",merge.stdout+merge.stderr)
              assert git("rev-parse","MERGE_HEAD").strip()==sha
              conflicts=set(git("diff","--name-only","--diff-filter=U").splitlines())
              save(f"pr{pr}-unmerged-index.txt",git("ls-files","-u"))
              assert conflicts<=allowed,(pr,conflicts)
              for idx,file in enumerate(sorted(conflicts)):
                  for stage in (1,2,3):
                      save(f"pr{pr}-conflict{idx}-stage{stage}.lean",git("show",f":{stage}:{file}"))
                  save(f"pr{pr}-conflict{idx}-path.txt",file+"\n")
              if P in conflicts:
                  reconcile_capstone(pr,base,sha)
              # Only exact duplicate private imports may be removed; never change public imports or other lines.
              t=Path(P).read_text()
              seen=set(); result=[]; removed=[]
              for line in t.splitlines(True):
                  if line.startswith("import all ") and line in seen:
                      removed.append(line); continue
                  if line.startswith("import all "): seen.add(line)
                  result.append(line)
              if removed:
                  assert pr==371
                  save(f"pr{pr}-duplicate-imports.txt","".join(removed))
                  write(P,"".join(result)); call("add",P)
              # Bootstrap with the internally consistent upstream measurements, not any guessed merged count.
              # The actual merged environment regenerates both generated values below.
              assert history.count('  "population=PROVISIONAL"')==1
              write(C,history.replace('  "population=PROVISIONAL"',provisional))
              write(R,upr)
              call("add",C,R)
              assert not git("diff","--name-only","--diff-filter=U").strip()
              call("diff","--cached","--check")
              save(f"pr{pr}-staged.patch",git("diff","--cached","--binary"))
              call("commit","-m",f"Independent exact-source merge PR {pr}; upstream census bootstrap")
              assert git("rev-parse","HEAD^1").strip()==before
              assert git("rev-parse","HEAD^2").strip()==sha
              records.append({"pr":pr,"head":sha,"base":base,"conflicts":sorted(conflicts),"merge":git("rev-parse","HEAD").strip(),"tree":git("rev-parse","HEAD^{tree}").strip()})
          for sha in [up]+[s for _,s in heads]:
              call("merge-base","--is-ancestor",sha,"HEAD")
          save("source-lineage.json",json.dumps(records,indent=2)+"\n")
          save("pre-native-tree.txt",git("rev-parse","HEAD","HEAD^{tree}"))
          save("pre-native.patch",git("diff","--binary",up,"HEAD"))
          save("provisional-census.lean",Path(C).read_text())
          print("SOURCE_DERIVATION_COMPLETE")
          PY
          git submodule update --init --recursive
          git submodule status --recursive > "$E/submodules.txt"
      - name: Retain source derivation before native qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-replay-source-derivation
          path: ${{ runner.temp }}/independent-evidence/
          if-no-files-found: warn
      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.36.0"
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Remeasure generated census and roster on actual native environment
        shell: bash
        run: |
          set -Eeuo pipefail
          E="$RUNNER_TEMP/independent-evidence"
          lean --version | tee "$E/lean-version.txt"
          lake build 2>&1 | tee "$E/build.log"
          lake build tests demo limittests 2>&1 | tee "$E/extra-build.log"
          lake run dead-census -- --write 2>&1 | tee "$E/census-write.log"
          lake build 2>&1 | tee "$E/post-census-build.log"
          lake run dead-census -- --check 2>&1 | tee "$E/census-check.log"
          lake run census-dashboard -- --check 2>&1 | tee "$E/dashboard.log"
          git diff --check
          git diff --binary > "$E/native-repin.patch"
          export E
          python3 - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          E=Path(os.environ["E"])
          C="Tests/Guards/Proofs/DeadDeclarationCensus.lean"
          R="Tests/Guards/Proofs/DeadDeclarationRoster.lean"
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed<={C,R},changed
          pin=re.compile(r'^  "population=[^"\n]+"$',re.M)
          before=(E/"provisional-census.lean").read_text()
          after=Path(C).read_text()
          assert len(pin.findall(before))==len(pin.findall(after))==1
          assert pin.sub("",before)==pin.sub("",after),"Non-numeric census content changed"
          def roster(t):
              m=re.search(r'def expectedDeadRoster : String := r"(.*?)"',t,re.S)
              assert m
              rows=[x for x in m.group(1).splitlines() if x]
              assert len(set(rows))==len(rows)
              return set(rows)
          old=roster((E/"upstream-roster.lean").read_text())
          new=roster(Path(R).read_text())
          (E/"roster-entered.txt").write_text("\n".join(sorted(new-old))+"\n")
          (E/"roster-left.txt").write_text("\n".join(sorted(old-new))+"\n")
          (E/"measured-summary.txt").write_text(pin.findall(after)[0]+"\n")
          assert len(new)==int(re.search(r"B-roster=(\d+)",after).group(1))
          print("NATIVE_ROSTER_DELTA",len(new-old),len(old-new))
          PY
      - name: Freeze independently derived source before any target comparison
        id: freeze
        shell: bash
        run: |
          set -Eeuo pipefail
          E="$RUNNER_TEMP/independent-evidence"
          git add Tests/Guards/Proofs/DeadDeclarationCensus.lean Tests/Guards/Proofs/DeadDeclarationRoster.lean
          if ! git diff --cached --quiet; then
            git commit -m "Measure exact independently derived five-way census"
          fi
          test -z "$(git diff --name-only)"
          for sha in "$UP" "$PYTHON_HEAD" "$CORE_HEAD" "$TAG_HEAD" "$DUMP_HEAD" "$AXIOM_HEAD"; do
            git merge-base --is-ancestor "$sha" HEAD
          done
          source=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          printf 'SOURCE=%s\nTREE=%s\n' "$source" "$tree" | tee "$E/frozen-candidate.txt"
          git diff --binary "$UP" HEAD > "$E/final-candidate.patch"
          if git ls-remote --exit-code origin "refs/heads/$CANDIDATE_BRANCH"; then
            echo "Candidate branch already exists; refuse overwrite"
            exit 1
          else
            test "$?" -eq 2
          fi
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          printf 'source=%s\ntree=%s\n' "$source" "$tree" >> "$GITHUB_OUTPUT"
      - name: Retain native derivation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-replay-native-evidence
          path: ${{ runner.temp }}/independent-evidence/
          if-no-files-found: warn
  compare:
    needs: derive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE: ${{ needs.derive.outputs.source }}
      CANDIDATE_TREE: ${{ needs.derive.outputs.tree }}
      REFERENCE: 117818c9ea72c184d66b9f3baed44d2f92ac702c
      REFERENCE_TREE: c22da9e09b42cbbafa569c24f747865b80602249
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.derive.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare frozen candidate to qualified reference without modifying either
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/comparison"
          E="$RUNNER_TEMP/comparison"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git cat-file -e "$REFERENCE^{commit}" || git fetch --no-tags origin "$REFERENCE"
          test "$(git rev-parse "$REFERENCE^{tree}")" = "$REFERENCE_TREE"
          git diff --name-status "$REFERENCE" "$CANDIDATE" | tee "$E/different-paths.txt"
          git diff --binary "$REFERENCE" "$CANDIDATE" > "$E/tree-difference.patch"
          printf 'CANDIDATE=%s\nCANDIDATE_TREE=%s\nREFERENCE=%s\nREFERENCE_TREE=%s\n' "$CANDIDATE" "$CANDIDATE_TREE" "$REFERENCE" "$REFERENCE_TREE" > "$E/comparison.txt"
          if test "$CANDIDATE_TREE" = "$REFERENCE_TREE"; then
            echo EXACT_TREE_MATCH | tee -a "$E/comparison.txt"
          else
            echo TREE_DIFFERENCE_REQUIRES_REVIEW | tee -a "$E/comparison.txt"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-replay-comparison
          path: ${{ runner.temp }}/comparison/
          if-no-files-found: warn
