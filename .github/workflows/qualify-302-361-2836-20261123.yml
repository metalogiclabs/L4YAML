name: Exact-commit Lean 4.36 PR302 PR361 upstream integration qualification
on:
  push:
    branches:
      - experiment/qualify-pinned-302-361-2836-gpt6-20261123
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '302'
            merged_sha: e3e5b0364d769b4e0a751fb0f15fa75f02351ab5
            original: bcc2a828addf4f3d8513aca681ae28fdeb2709a5
          - pr: '361'
            merged_sha: 0fcff4d2d1b4e0a5e290c08503279a8d1e0c00d1
            original: a4cb16d488f6c6cf325a1b03d3646e7b79227283
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Checkout exact merge object and submodule
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.merged_sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Verify source identities and preserve before pin
        shell: bash
        env:
          EXPECT_MERGE: ${{ matrix.merged_sha }}
          EXPECT_PR: ${{ matrix.original }}
          PR: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          test "$(git rev-parse HEAD)" = "$EXPECT_MERGE"
          test "$(git rev-parse HEAD^1)" = "$EXPECT_PR"
          test "$(git rev-parse HEAD^2)" = "2836db2fef546ec69873297f499c43ec9aadf3c7"
          git rev-parse HEAD HEAD^{tree} HEAD:DOCS.md HEAD:Tests/AdversarialInstantiation.lean
          git submodule status
          cat lean-toolchain | tee integration-evidence/lean-toolchain.txt
          grep 'expectedDeadCensus' Tests/Guards/Proofs/DeadDeclarationCensus.lean | tee integration-evidence/census-before.txt
          sed -n '/def expectedDeadCensus : String :=/,+1p' Tests/Guards/Proofs/DeadDeclarationCensus.lean | tee -a integration-evidence/census-before.txt
          git show -s --format='%H%n%P%n%B' HEAD > integration-evidence/commit-identity.txt
      - name: Install exact repository-pinned Lean 4.36
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Full Lean build and native declaration census remeasurement
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee integration-evidence/lean-version.txt
          lake build 2>&1 | tee integration-evidence/lean-build-initial.log
          lake run dead-census -- --write 2>&1 | tee integration-evidence/dead-census-remeasure.log
          git diff -- Tests/Guards/Proofs/DeadDeclarationCensus.lean Tests/Guards/Proofs/DeadDeclarationRoster.lean | tee integration-evidence/census-remeasure.diff
          sed -n '/def expectedDeadCensus : String :=/,+1p' Tests/Guards/Proofs/DeadDeclarationCensus.lean | tee integration-evidence/census-after.txt
          cp Tests/Guards/Proofs/DeadDeclarationCensus.lean integration-evidence/DeadDeclarationCensus.remeasured.lean
          cp Tests/Guards/Proofs/DeadDeclarationRoster.lean integration-evidence/DeadDeclarationRoster.remeasured.lean
          lake build 2>&1 | tee integration-evidence/lean-build-after-census.log
          lake run dead-census -- --check 2>&1 | tee integration-evidence/dead-census-check.log
          lake run census-dashboard -- --check 2>&1 | tee integration-evidence/census-dashboard.log
      - name: Verify proof guard boundaries
        shell: bash
        run: |
          set -euo pipefail
          for gate in check-theorem-keyword check-import-closure check-reflection-index check-gate-vocab check-closure-log check-scripts-lean check-pack-births; do
            lake run "$gate" 2>&1 | tee "integration-evidence/$gate.log"
          done
          lake run check-serialization-proofs -- --keep integration-evidence/serialization 2>&1 | tee integration-evidence/serialization-check.log
      - name: Adversarial qualification and complete executable suites
        shell: bash
        run: |
          set -euo pipefail
          lake exe adversarialinstantiation 2>&1 | tee integration-evidence/adversarial.log
          lake run run-all-tests -- docs/reports 2>&1 | tee integration-evidence/all-tests.log
          lake exe eventscore --suite yaml-test-suite 2>&1 | tee integration-evidence/eventscore.log
      - name: Preserve final source and pin changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          git rev-parse HEAD HEAD^{tree} > integration-evidence/exact-source-end.txt
          git status --short > integration-evidence/worktree-status.txt
          git diff -- Tests/Guards/Proofs/DeadDeclarationCensus.lean Tests/Guards/Proofs/DeadDeclarationRoster.lean > integration-evidence/final-census.diff
      - name: Upload measured provenance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-qual-PR${{ matrix.pr }}-2836
          path: integration-evidence/
          if-no-files-found: warn
