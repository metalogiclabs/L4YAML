name: Right-Wall P139 sampled source/event alignment
on:
  push:
    branches:
      - research/right-wall-event-alignment-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Rebuild and run all existing checks plus P139
        run: |
          git rev-parse HEAD
          lake build adversarialinstantiation
          lake exe adversarialinstantiation
