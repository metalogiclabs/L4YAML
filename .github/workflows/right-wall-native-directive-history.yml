name: MathGraph Right-Wall native directive history

on:
  push:
    branches:
      - research/right-wall-directive-history-step-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-directive-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Prove source-qualified real directive history preservation
        run: |
          git rev-parse HEAD
          lake --version
          lake build Tests.Guards.Proofs.RightWallDirectiveStep
