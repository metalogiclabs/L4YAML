name: Probe combined Core TAG exact-source composition
on:
  push:
    branches:
      - experiment/compose-core-tag-2836-20261123
permissions:
  contents: write
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Three-way compose merged Core and TAG trees
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MathGraph composition probe"
          git config user.email "mathgraph-integration@users.noreply.github.com"
          A=e3e5b0364d769b4e0a751fb0f15fa75f02351ab5
          B=0fcff4d2d1b4e0a5e290c08503279a8d1e0c00d1
          UP=2836db2fef546ec69873297f499c43ec9aadf3c7
          git fetch --no-tags origin "$A" "$B"
          test "$(git merge-base "$A" "$B")" = "$UP"
          git switch --detach "$A"
          if git merge --no-ff --no-commit "$B"; then
            git diff --cached --check
            git commit -m "Merge Core #302 and TAG #361 integration candidates at upstream 2836db2f"
            test "$(git rev-parse HEAD^1)" = "$A"
            test "$(git rev-parse HEAD^2)" = "$B"
            echo "Combined SHA=$(git rev-parse HEAD)"
            echo "Combined tree=$(git rev-parse HEAD^{tree})"
            git push origin HEAD:refs/heads/experiment/combined-core-tag-2836-20261123
          else
            echo "::notice::Combined source requires conflict resolution"
            git status --short
            git ls-files -u | cut -f2 | sort -u
            while IFS= read -r path; do
              echo "::group::Conflict $path"
              git diff -- "$path" | tail -n 250 || true
              echo "::endgroup::"
            done < <(git diff --name-only --diff-filter=U)
            exit 2
          fi
