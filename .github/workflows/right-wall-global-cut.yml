name: Right-Wall global S-to-T admission cut
on:
  push:
    branches:
      - research/right-wall-global-cut-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Compile source-to-event admission proof, print axioms
        run: |
          git rev-parse HEAD
          lake build Tests.Guards.Proofs.RightWallGlobalAdmissionCut
