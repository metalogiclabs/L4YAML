name: Combined Core and TAG qualification

on:
  push:
    branches: [test/core-tag-lean436]

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: 2
  QUALIFICATION_BASE: 37d8025ecc8c15e6764cc1a982104787de9463d8
  CORE_PARENT: 72c30c166d560219a9c33204c8f6a0d2dbeebc40
  TAG_PARENT: 0cbcd6caa72ae8b42dca351c327e334e5044f89a

defaults:
  run:
    shell: bash

jobs:
  core-bindings-verso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Bind the workflow, integration source, parents and pinned inputs
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/core-tag-full"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR/inputs"
          exec > >(tee "$EVIDENCE_DIR/source-identity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          printf 'workflow=%s\nworkflow_sha=%s\nrun=%s/%s\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          git show -s --format='commit=%H%ntree=%T%nparents=%P' HEAD
          git rev-parse HEAD:L4YAML
          for ancestor in "$QUALIFICATION_BASE" "$CORE_PARENT" "$TAG_PARENT"; do
            git merge-base --is-ancestor "$ancestor" HEAD
            git show -s --format='ancestor=%H tree=%T parents=%P' "$ancestor"
          done
          git diff --exit-code
          git diff --cached --exit-code
          git diff --exit-code "$QUALIFICATION_BASE" HEAD -- lean-toolchain lake-manifest.json doc/lean-toolchain doc/lake-manifest.json .gitmodules yaml-test-suite
          git submodule status --recursive | tee "$EVIDENCE_DIR/submodules.txt"
          if grep -E '^[-+U]' "$EVIDENCE_DIR/submodules.txt"; then exit 1; fi
          git submodule foreach --recursive 'test "$(git rev-parse HEAD)" = "$sha1" && git diff --exit-code && git diff --cached --exit-code'
          sha256sum lean-toolchain lake-manifest.json lakefile.lean doc/lean-toolchain doc/lake-manifest.json doc/lakefile.toml .gitmodules > "$EVIDENCE_DIR/pins.sha256"
          cp --parents lean-toolchain lake-manifest.json lakefile.lean doc/lean-toolchain doc/lake-manifest.json doc/lakefile.toml .gitmodules "$EVIDENCE_DIR/inputs/"
          cat "$EVIDENCE_DIR/pins.sha256"
          cat lean-toolchain doc/lean-toolchain
          sha256sum .github/workflows/core-tag-integration.yml Scripts/Main/DocInfoTargets.lean Tests/Guards/Proofs/TagDirectiveRepair.lean Tests/Guards/Proofs/TagDirectiveSoundness.lean Tests/Guards/Proofs/TagDirectiveSoundnessIx.lean Tests/Guards/Proofs/TagDirectiveConsumer.lean L4YAML/Proofs/Schema/SchemaResolution.lean
      - name: Install repository-pinned Lean
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elan-bootstrap"
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan-bootstrap/elan.tar.gz"
          printf '%s  %s\n' '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2' "$RUNNER_TEMP/elan-bootstrap/elan.tar.gz" | sha256sum -c
          sha256sum "$RUNNER_TEMP/elan-bootstrap/elan.tar.gz" | tee "$EVIDENCE_DIR/elan-bootstrap.sha256"
          tar -xzf "$RUNNER_TEMP/elan-bootstrap/elan.tar.gz" -C "$RUNNER_TEMP/elan-bootstrap"
          "$RUNNER_TEMP/elan-bootstrap/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" --version
      - name: Install binding and documentation prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cmake libclang-dev graphviz python3-venv
          python3 -m venv "$RUNNER_TEMP/core-tag-venv"
          mkdir -p "$RUNNER_TEMP/core-tag-venv/empty-pythonpath"
          export PYTHONPATH="$RUNNER_TEMP/core-tag-venv/empty-pythonpath"
          export PYTHONNOUSERSITE=1
          VPY="$RUNNER_TEMP/core-tag-venv/bin/python3"
          "$VPY" -m pip install --quiet pytest
          "$VPY" -m pytest --version
          echo "$RUNNER_TEMP/core-tag-venv/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          echo "PYTHONNOUSERSITE=1" >> "$GITHUB_ENV"
          echo "L4YAML_LIB=$GITHUB_WORKSPACE/ffi/out/libl4yaml.so" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/ffi/out:$(lean --print-prefix)/lib/lean" >> "$GITHUB_ENV"
          {
            lean --version
            rustc --version
            cargo --version
            "$VPY" --version
            cmake --version
            dot -V
            uname -a
            free -h
            df -h .
          } 2>&1 | tee "$EVIDENCE_DIR/tool-versions.log"
      - name: Build every default target and non-default test executables
        run: |
          set -euo pipefail
          lake build 2>&1 | tee "$EVIDENCE_DIR/build.log"
          JOBS=$(grep -oE '\([0-9]+ jobs\)' "$EVIDENCE_DIR/build.log" | tail -1 | grep -oE '[0-9]+')
          echo "BUILD_JOBS_TOTAL=$JOBS" >> "$GITHUB_ENV"
          echo "BUILD_JOBS_PASSED=$JOBS" >> "$GITHUB_ENV"
          lake build tests demo limittests 2>&1 | tee "$EVIDENCE_DIR/extra-build.log"
      - name: Replay the frozen source-contract witnesses on this integration tree
        run: |
          set -euo pipefail
          replay_source="$GITHUB_WORKSPACE/Tests/Integration/SourceContract"
          replay_output="$RUNNER_TEMP/core-tag-replay"
          mkdir -p "$replay_output/Tests/Guards/Proofs" "$EVIDENCE_DIR/replay"
          (cd "$replay_source" && sha256sum -c SHA256SUMS) 2>&1 | tee "$EVIDENCE_DIR/replay/checksums.log"
          cp "$replay_source/README.md" "$replay_source/SHA256SUMS" "$EVIDENCE_DIR/replay/"
          project_lean_path=$(lake env printenv LEAN_PATH)
          # Keep the original module names; only the fresh replay output is
          # prepended to Lake's path. No default test/census root imports these.
          for proof in UpstreamColonTrace UpstreamScannerTrace UpstreamColonRuntime UpstreamForwardCounterexample AcceptedTraceContract; do
            env LEAN_PATH="$replay_output:$project_lean_path" lean --root="$replay_source" \
              -o "$replay_output/Tests/Guards/Proofs/$proof.olean" \
              "$replay_source/Tests/Guards/Proofs/$proof.lean" \
              2>&1 | tee "$EVIDENCE_DIR/replay/$proof.log"
          done
      - name: Validate serialization, TAG, Core and replay axiom profiles
        run: |
          set -euo pipefail
          for proof in TagDirectiveSoundness TagDirectiveSoundnessIx TagDirectiveConsumer; do
            lake env lean "Tests/Guards/Proofs/$proof.lean"
          done 2>&1 | tee "$EVIDENCE_DIR/tag-axioms.log"
          cat > "$EVIDENCE_DIR/CoreAxioms.lean" <<'LEAN'
          import L4YAML.Proofs.Schema.SchemaResolution
          #print axioms L4YAML.Proofs.SchemaResolution.coreTagCorrespondenceAll
          LEAN
          lake env lean "$EVIDENCE_DIR/CoreAxioms.lean" 2>&1 | tee "$EVIDENCE_DIR/core-axioms.log"
          lake run check-serialization-proofs -- --keep "$EVIDENCE_DIR/serialization" 2>&1 | tee "$EVIDENCE_DIR/serialization.log"
          cat "$EVIDENCE_DIR/serialization/qualification.log" "$EVIDENCE_DIR/tag-axioms.log" "$EVIDENCE_DIR/core-axioms.log" "$EVIDENCE_DIR"/replay/Upstream*.log "$EVIDENCE_DIR/replay/AcceptedTraceContract.log" > "$EVIDENCE_DIR/combined-axioms.log"
          cp "$EVIDENCE_DIR/serialization/sites.txt" "$EVIDENCE_DIR/combined-sites.txt"
          cat >> "$EVIDENCE_DIR/combined-sites.txt" <<'SITES'
          L4YAML.Tests.Guards.TagDirectiveSoundness.duplicate_directives_refused
          L4YAML.Tests.Guards.TagDirectiveSoundness.duplicate_directives_refused_ix
          L4YAML.Tests.Guards.TagDirectiveSoundness.parseStream_directives_unique
          L4YAML.Tests.Guards.TagDirectiveSoundness.parseYamlRaw_directives_unique
          L4YAML.Tests.Guards.TagDirectiveSoundness.parseYaml_directives_unique
          L4YAML.Tests.Guards.TagDirectiveSoundnessIx.prepared_directives_unique
          L4YAML.Tests.Guards.TagDirectiveSoundnessIx.document_directives_unique
          L4YAML.Tests.Guards.TagDirectiveSoundnessIx.stream_loop_directives_unique
          L4YAML.Tests.Guards.TagDirectiveSoundnessIx.parseStreamIx_directives_unique
          L4YAML.Tests.Guards.TagDirectiveSoundnessIx.parseYamlRawIx_directives_unique
          L4YAML.Tests.Guards.TagDirectiveSoundnessIx.parseYamlIx_directives_unique
          L4YAML.Proofs.TokenGrammar.parseStream_accepts
          L4YAML.Proofs.TokenGrammar.checkTokenGrammar_sound
          L4YAML.Tests.Guards.TagDirectiveConsumer.single_scan
          L4YAML.Tests.Guards.TagDirectiveConsumer.duplicate_scan
          L4YAML.Tests.Guards.TagDirectiveConsumer.single_tokenGrammar
          L4YAML.Tests.Guards.TagDirectiveConsumer.single_tokenStateOk
          L4YAML.Tests.Guards.TagDirectiveConsumer.single_consumer
          L4YAML.Tests.Guards.TagDirectiveConsumer.single_pipeline
          L4YAML.Tests.Guards.TagDirectiveConsumer.duplicate_not_tokenGrammar
          L4YAML.Proofs.SchemaResolution.coreTagCorrespondenceAll
          L4YAML.Tests.Guards.UpstreamColonTrace.initial_key
          L4YAML.Tests.Guards.UpstreamColonTrace.first_bare
          L4YAML.Tests.Guards.UpstreamColonTrace.second_bare
          L4YAML.Tests.Guards.UpstreamColonTrace.second_is_not_explicit
          L4YAML.Tests.Guards.UpstreamColonTrace.annotated_stream_admits
          L4YAML.Tests.Guards.UpstreamColonTrace.traceOf_seven_bytes
          L4YAML.Tests.Guards.UpstreamScannerTrace.empty_trace_control
          L4YAML.Tests.Guards.UpstreamScannerTrace.exact_scanner_events
          L4YAML.Tests.Guards.UpstreamScannerTrace.exact_original_scanner_trace_of_success
          L4YAML.Tests.Guards.UpstreamScannerTrace.exact_original_scanner_trace
          L4YAML.Tests.Guards.UpstreamForwardCounterexample.empty_parser_control
          L4YAML.Tests.Guards.UpstreamForwardCounterexample.empty_trace_control
          L4YAML.Tests.Guards.UpstreamForwardCounterexample.bad_trace
          L4YAML.Tests.Guards.UpstreamForwardCounterexample.not_trace_well_formed
          L4YAML.Tests.Guards.UpstreamForwardCounterexample.parser_accepts_bit
          L4YAML.Tests.Guards.UpstreamForwardCounterexample.parser_accepts
          L4YAML.Tests.Guards.UpstreamForwardCounterexample.universal_forward_serialization_refuted
          L4YAML.Tests.Guards.UpstreamForwardCounterexample.no_biconditional
          L4YAML.Tests.Guards.AcceptedTraceContract.accepted_trace_exists
          L4YAML.Tests.Guards.AcceptedTraceContract.accepted_trace_contract_suffices_for_forward_serialization
          L4YAML.Tests.Guards.AcceptedTraceContract.scanned_trace_certificate_suffices_for_reverse_acceptance
          SITES
          lake run check-serialization-proofs -- --validate "$EVIDENCE_DIR/combined-axioms.log" "$EVIDENCE_DIR/serialization/sorry.log" "$EVIDENCE_DIR/combined-sites.txt" 2>&1 | tee "$EVIDENCE_DIR/axiom-validation.log"
      - name: Run the adversarial suite with Core and directive consumer checks
        run: |
          set -euo pipefail
          lake exe adversarialinstantiation 2>&1 | tee "$EVIDENCE_DIR/adversarial.log"
      - name: Run all executable suites and measure the event axis
        run: |
          set -euo pipefail
          lake run run-all-tests -- docs/reports 2>&1 | tee "$EVIDENCE_DIR/suites.log"
          # eventscore's exit code does not assert a conformance threshold;
          # retain its measured pass/diff/reject and error-ok/miss counts.
          lake exe eventscore --suite yaml-test-suite 2>&1 | tee "$EVIDENCE_DIR/events.log"
      - name: Check proof, documentation and census gates
        run: |
          set -euo pipefail
          for gate in check-theorem-keyword check-import-closure check-reflection-index check-doc-graphs check-closure-log check-gate-vocab check-scripts-lean check-pack-births; do
            lake run "$gate" 2>&1 | tee "$EVIDENCE_DIR/$gate.log"
          done
          lake run dead-census -- --check 2>&1 | tee "$EVIDENCE_DIR/dead-census.log"
          lake run census-dashboard -- --check 2>&1 | tee "$EVIDENCE_DIR/census.log"
          lake run census-dashboard -- --diff "$QUALIFICATION_BASE" 2>&1 | tee "$EVIDENCE_DIR/census-delta.log"
      - name: Build C and Rust bindings
        run: |
          set -euo pipefail
          cmake -B ffi/out -S ffi 2>&1 | tee "$EVIDENCE_DIR/c-configure.log"
          cmake --build ffi/out --parallel 2 2>&1 | tee "$EVIDENCE_DIR/c-build.log"
          test -f ffi/out/libl4yaml.so
          test -x ffi/out/tryparse_c
          (cd rust/l4yaml && cargo build --release --example tryparse --jobs 2) 2>&1 | tee "$EVIDENCE_DIR/rust-build.log"
          cargo test --manifest-path rust/Cargo.toml --workspace --release --locked --jobs 2 -- --test-threads=1 2>&1 | tee "$EVIDENCE_DIR/rust-tests.log"
          sha256sum ffi/out/libl4yaml.so ffi/out/tryparse_c rust/target/release/examples/tryparse | tee "$EVIDENCE_DIR/binding-identities.log"
      - name: Run Python bindings and cross-language comparison
        run: |
          set -euo pipefail
          python3 -m pytest Tests/test_python_ffi.py -v --tb=short --no-header --junitxml=docs/reports/python-ffi-junit.xml 2>&1 | tee docs/reports/python-ffi-tests.txt
          python3 -m pytest python/tests/ -v --tb=short --no-header --junitxml=docs/reports/python-package-junit.xml 2>&1 | tee docs/reports/python-package-tests.txt
          lake run cross-lang-compare -- docs/reports 2>&1 | tee docs/reports/cross-lang-comparison.txt
      - name: Generate reports and check compiled-environment hygiene
        run: |
          set -euo pipefail
          lake run test-reports -- docs/reports 2>&1 | tee "$EVIDENCE_DIR/reports.log"
          lake exe collect-stats --emit-lean 2>&1 | tee "$EVIDENCE_DIR/stats.log"
          cp doc/Doc/L4YAML/StatsData.lean "$EVIDENCE_DIR/StatsData.lean"
          git diff -- doc/Doc/L4YAML/StatsData.lean > "$EVIDENCE_DIR/stats-data.diff"
          lake run check-hygiene -- docs/reports/stats.json 2>&1 | tee "$EVIDENCE_DIR/hygiene.log"
      - name: Build and render Verso on pinned dependencies
        run: |
          set -euo pipefail
          (cd doc && lake build l4yaml-doc) 2>&1 | tee "$EVIDENCE_DIR/doc-build.log"
          lake build graph 2>&1 | tee "$EVIDENCE_DIR/graph-build.log"
          mkdir -p doc/Doc/L4YAML/graphs
          lake exe graph --to=L4YAML.Scanner.Scanner,L4YAML.Parser.Composition,L4YAML.Surface.Document,L4YAML.Output.Dump,L4YAML.Output.Emitter,L4YAML.FFI.FFI,L4YAML.Schema.Api,L4YAML.Config.Config doc/Doc/L4YAML/graphs/import-graph.dot
          dot -Tsvg doc/Doc/L4YAML/graphs/import-graph.dot -o doc/Doc/L4YAML/graphs/import-graph.svg
          lake run check-doc-graphs -- --strict 2>&1 | tee "$EVIDENCE_DIR/doc-graphs.log"
          (cd doc && lake exe l4yaml-doc) 2>&1 | tee "$EVIDENCE_DIR/doc-render.log"
          lake run svg-objects -- doc/_out/html-multi 2>&1 | tee "$EVIDENCE_DIR/svg.log"
      - name: Verify that qualification preserved its inputs
        if: always()
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/core-tag-full"
          mkdir -p "$EVIDENCE_DIR"
          exec > >(tee "$EVIDENCE_DIR/final-identity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum -c "$EVIDENCE_DIR/pins.sha256"
          git diff --cached --exit-code
          # collect-stats regenerates this one documented output for Verso.
          git diff --exit-code -- . ':!doc/Doc/L4YAML/StatsData.lean'
          git submodule status --recursive > "$EVIDENCE_DIR/submodules-final.txt"
          diff -u "$EVIDENCE_DIR/submodules.txt" "$EVIDENCE_DIR/submodules-final.txt"
          git submodule foreach --recursive 'test "$(git rev-parse HEAD)" = "$sha1" && git diff --exit-code && git diff --cached --exit-code'
          git show -s --format='commit=%H%ntree=%T%nparents=%P' HEAD
          git status --short
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-tag-full-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/core-tag-full/
            rust/Cargo.lock
            docs/reports/*.txt
            docs/reports/*.json
            docs/reports/*junit.xml
          if-no-files-found: error
          include-hidden-files: true

  api-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Bind the same workflow, integration source, parents and pinned inputs
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/core-tag-api-docs"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR/inputs"
          exec > >(tee "$EVIDENCE_DIR/source-identity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          printf 'workflow=%s\nworkflow_sha=%s\nrun=%s/%s\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          git show -s --format='commit=%H%ntree=%T%nparents=%P' HEAD
          git rev-parse HEAD:L4YAML
          for ancestor in "$QUALIFICATION_BASE" "$CORE_PARENT" "$TAG_PARENT"; do
            git merge-base --is-ancestor "$ancestor" HEAD
            git show -s --format='ancestor=%H tree=%T parents=%P' "$ancestor"
          done
          git diff --exit-code
          git diff --cached --exit-code
          git diff --exit-code "$QUALIFICATION_BASE" HEAD -- lean-toolchain lake-manifest.json doc/lean-toolchain doc/lake-manifest.json .gitmodules yaml-test-suite
          git submodule status --recursive | tee "$EVIDENCE_DIR/submodules.txt"
          if grep -E '^[-+U]' "$EVIDENCE_DIR/submodules.txt"; then exit 1; fi
          git submodule foreach --recursive 'test "$(git rev-parse HEAD)" = "$sha1" && git diff --exit-code && git diff --cached --exit-code'
          sha256sum lean-toolchain lake-manifest.json lakefile.lean doc/lean-toolchain doc/lake-manifest.json doc/lakefile.toml .gitmodules > "$EVIDENCE_DIR/pins.sha256"
          cp --parents lean-toolchain lake-manifest.json lakefile.lean doc/lean-toolchain doc/lake-manifest.json doc/lakefile.toml .gitmodules "$EVIDENCE_DIR/inputs/"
          cat "$EVIDENCE_DIR/pins.sha256"
          cat lean-toolchain doc/lean-toolchain
          sha256sum .github/workflows/core-tag-integration.yml Scripts/Main/DocInfoTargets.lean
      - name: Install repository-pinned Lean
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elan-bootstrap"
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan-bootstrap/elan.tar.gz"
          printf '%s  %s\n' '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2' "$RUNNER_TEMP/elan-bootstrap/elan.tar.gz" | sha256sum -c
          sha256sum "$RUNNER_TEMP/elan-bootstrap/elan.tar.gz" | tee "$EVIDENCE_DIR/elan-bootstrap.sha256"
          tar -xzf "$RUNNER_TEMP/elan-bootstrap/elan.tar.gz" -C "$RUNNER_TEMP/elan-bootstrap"
          "$RUNNER_TEMP/elan-bootstrap/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" --version
      - name: Add the proven documentation memory allowance
        run: |
          set -euo pipefail
          exec > >(tee "$EVIDENCE_DIR/resources.log") 2>&1
          lean --version
          uname -a
          sudo fallocate -l 24G /core-tag-docs.swap
          sudo chmod 600 /core-tag-docs.swap
          sudo mkswap /core-tag-docs.swap
          sudo swapon /core-tag-docs.swap
          free -h
          df -h .
      - name: Prime doc-gen4 in dependency-ordered batches of four
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/batches"
          lake build scripts-doc-info-targets > "$EVIDENCE_DIR/doc-targets-build.log" 2>&1
          lake env .lake/build/bin/scripts-doc-info-targets > "$EVIDENCE_DIR/doc-targets.txt" 2> "$EVIDENCE_DIR/doc-targets-run.log"
          test -s "$EVIDENCE_DIR/doc-targets.txt"
          if grep -nEv '^\+[A-Za-z0-9_.]+:docInfo$' "$EVIDENCE_DIR/doc-targets.txt"; then
            echo 'Invalid docInfo target list' >&2
            exit 1
          fi
          mapfile -t targets < "$EVIDENCE_DIR/doc-targets.txt"
          wc -l "$EVIDENCE_DIR/doc-targets.txt"
          printf 'batch\tstarted_utc\tfinished_utc\texit_code\n' > "$EVIDENCE_DIR/batches.tsv"
          for ((offset=0, batch=1; offset<${#targets[@]}; offset+=4, batch++)); do
            printf -v batch_name 'batch-%04d' "$batch"
            batch_log="$EVIDENCE_DIR/batches/$batch_name.log"
            printf '%s\n' "${targets[@]:offset:4}" > "$EVIDENCE_DIR/batches/$batch_name.targets"
            started=$(date -u +%FT%TZ)
            printf 'Building %s: %s\n' "$batch_name" "${targets[*]:offset:4}"
            if lake build "${targets[@]:offset:4}" > "$batch_log" 2>&1; then
              printf '%s\t%s\t%s\t0\n' "$batch_name" "$started" "$(date -u +%FT%TZ)" >> "$EVIDENCE_DIR/batches.tsv"
            else
              status=$?
              printf '%s\t%s\t%s\t%s\n' "$batch_name" "$started" "$(date -u +%FT%TZ)" "$status" >> "$EVIDENCE_DIR/batches.tsv"
              tail -100 "$batch_log"
              exit "$status"
            fi
          done
      - name: Run the complete repository API documentation gate
        run: |
          set -euo pipefail
          lake build :docs 2>&1 | tee "$EVIDENCE_DIR/full-api-docs.log"
          test -s .lake/build/doc/index.html
          sha256sum .lake/build/doc/index.html | tee "$EVIDENCE_DIR/api-index.sha256"
      - name: Verify that documentation preserved its inputs
        if: always()
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/core-tag-api-docs"
          mkdir -p "$EVIDENCE_DIR"
          exec > >(tee "$EVIDENCE_DIR/final-identity.log") 2>&1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum -c "$EVIDENCE_DIR/pins.sha256"
          git diff --exit-code
          git diff --cached --exit-code
          git submodule status --recursive > "$EVIDENCE_DIR/submodules-final.txt"
          diff -u "$EVIDENCE_DIR/submodules.txt" "$EVIDENCE_DIR/submodules-final.txt"
          git submodule foreach --recursive 'test "$(git rev-parse HEAD)" = "$sha1" && git diff --exit-code && git diff --cached --exit-code'
          git show -s --format='commit=%H%ntree=%T%nparents=%P' HEAD
          free -h
          df -h .
