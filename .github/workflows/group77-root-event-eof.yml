name: Group 7.7 consume root scalar key and value to actual filtered trace
on:
  push:
    branches: [research/group77-root-composed-trace-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: evidence
      - uses: actions/checkout@v4
        with:
          repository: nasa-jpl/L4YAML
          ref: 92c622bc1015febac29897be08192eb73c6aa744
          path: upstream
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/L4YAML
          ref: 26baf55ec8c3023d4903a9444505e1c88a3b5da9
          path: solution
      - name: Verify all pinned inputs
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../results
          test "$(git rev-parse HEAD)" = 92c622bc1015febac29897be08192eb73c6aa744
          test "$(git rev-parse HEAD:L4YAML/Proofs/Serialization/TraceOf/Document.lean)" = 29f20ab3947dacef278808153130ff7fcd1861b4
          test "$(git rev-parse HEAD:L4YAML/Proofs/Serialization/TraceOf/DocBridge.lean)" = 570e6330fd3d6f27df37fcd8a344b01552c2c7b3
          test "$(git rev-parse HEAD:L4YAML/Proofs/Serialization/TraceOf/StreamBridge.lean)" = 213a3576c024e3cc4b56d109942ec9085715f9d3
          test "$(git -C ../solution rev-parse HEAD)" = 26baf55ec8c3023d4903a9444505e1c88a3b5da9
          test "$(git -C ../solution rev-parse HEAD:Tests/Guards/Proofs/TraceOfBlockAmbiguity.lean)" = 4741497a77d31446a94c3ebfbfa512d50f2fce0b
          test "$(git rev-parse HEAD:L4YAML/Proofs/Production/StreamAccum.lean)" = b6379bb4ec2d3a46b1c80edf72413a18fb98e77a
          test "$(git rev-parse HEAD:L4YAML/Proofs/Serialization/TraceOf/ContentBridge.lean)" = 818ebca6feb6e357d2a5456cb4072968aff310c6
          test "$(git rev-parse HEAD:L4YAML)" = 19f54b7a36b0b170aa24375889ff86196e7fa475
          test "$(git rev-parse HEAD:L4YAML/Proofs/Scanner/ScanStrictCoupling.lean)" = 01e90531afc2066917416909d660aa04d3d5495a
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.36.0
          git rev-parse HEAD HEAD:L4YAML > ../results/source.txt
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Compile source-connected EOF theorem and vacuity control
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/ReachableEOF.lean <<'LEAN'
          module
          public import L4YAML.Proofs.Scanner.ScanStrictCoupling
          public section
          set_option autoImplicit false
          namespace L4YAML.Proofs.ReachableEOF
          open L4YAML L4YAML.Surface L4YAML.Scanner
          open L4YAML.Proofs.CloseStaleExplicitKey
          open L4YAML.Proofs.CouplingBridge L4YAML.Proofs.ScannerCoupling
          open L4YAML.Proofs.ScalarCoupling L4YAML.Proofs.StructureCoupling
          open L4YAML.Proofs.ScanStrictCoupling
          open L4YAML.Proofs.BlockScalarFlowGuard L4YAML.Proofs.FlowAdjacency
          
          /-- Negative adequacy control: the registered conclusion requires no scanner
              premises at all. Not a claim that the implementation drops characters. -/
          theorem old_conclusion_without_execution : ∃ p : SurfPos, p.chars = [] :=
            ⟨⟨[], 0⟩, rfl⟩
          
          /-- Preserve the actual EOF state and the correspondence used by the original
              proof, instead of discarding both at existential introduction. -/
          lemma preprocess_none_reachable_eof (sc : ScannerState) (sp : SurfPos)
              (hcorr : ScannerSurfCorr sc sp)
              (hok : scanNextToken_preprocess sc = .ok none) :
              ∃ (e : ScannerState) (p : SurfPos), skipToContent sc = .ok e ∧
                ScannerSurfCorr e p ∧ ¬ e.hasMore ∧ p.chars = [] := by
            unfold scanNextToken_preprocess at hok
            simp only [bind, Except.bind, pure, Except.pure] at hok
            split at hok
            · cases hok
            · rename_i s_content h_skip
              split at hok
              · rename_i h_hasMore
                obtain ⟨sp_c, hcorr_c⟩ := skipToContentLoop_ok_corr sc sp _ s_content hcorr
                  (Nat.le_refl _) h_skip
                have h_not_lt : ¬ s_content.offset < s_content.inputEnd := by
                  simp [ScannerState.hasMore] at h_hasMore; omega
                refine ⟨s_content, sp_c, h_skip, hcorr_c, ?_, eof_corr s_content sp_c hcorr_c h_not_lt⟩
                simpa [ScannerState.hasMore] using h_not_lt
              · rename_i h_hasMore
                split at hok
                · split at hok
                  · cases hok
                  · split at hok
                    · rename_i h_indent h_no_trailing h_peek_none
                      exfalso; rw [closeStaleExplicitKey_peek, saveSimpleKey_peek] at h_peek_none
                      unfold ScannerState.peek? at h_peek_none; dsimp only [] at h_peek_none
                      unfold unwindIndents at h_peek_none
                      simp only [unwindIndentsLoop_offset, unwindIndentsLoop_inputEnd,
                        unwindIndentsLoop_input] at h_peek_none
                      split at h_peek_none
                      · cases h_peek_none
                      · rename_i h_not_lt; simp [ScannerState.hasMore] at h_hasMore
                        exact h_not_lt h_hasMore
                    · cases hok
                · split at hok
                  · cases hok
                  · split at hok
                    · rename_i h_no_indent h_no_trailing h_peek_none
                      exfalso; rw [closeStaleExplicitKey_peek, saveSimpleKey_peek] at h_peek_none
                      unfold ScannerState.peek? at h_peek_none
                      split at h_peek_none
                      · cases h_peek_none
                      · rename_i h_not_lt; simp [ScannerState.hasMore] at h_hasMore
                        exact h_not_lt h_hasMore
                    · cases hok
          
          lemma next_none_reachable_eof (sc : ScannerState) (sp : SurfPos)
              (hcorr : ScannerSurfCorr sc sp)
              (hok : scanNextToken sc = .ok none) :
              ∃ (e : ScannerState) (p : SurfPos), skipToContent sc = .ok e ∧
                ScannerSurfCorr e p ∧ ¬ e.hasMore ∧ p.chars = [] := by
            unfold scanNextToken at hok
            simp only [bind, Except.bind, pure, Except.pure] at hok
            split at hok
            · simp at hok
            · split at hok
              · rename_i h_pre
                exact preprocess_none_reachable_eof sc sp hcorr h_pre
              · -- §9.2 dangling-node check (item 133)
                split at hok
                · simp at hok
                -- §8.1 flow-value floor (item 172)
                split at hok
                · simp at hok
                split at hok
                · simp at hok
                · split at hok
                  · exact absurd (Except.ok.inj hok) nofun
                  · -- pending-directives check (Fix B)
                    split at hok
                    · simp at hok
                    -- §9.2 bare-document check (item 132)
                    split at hok
                    · simp at hok
                    · split at hok
                      · simp at hok
                      · split at hok
                        · exact absurd (Except.ok.inj hok) nofun
                        · split at hok
                          · simp at hok
                          · split at hok
                            · exact absurd (Except.ok.inj hok) nofun
                            · -- adjacent-value check (item 47)
                              split at hok
                              · simp at hok
                              · split at hok
                                · simp at hok
                                · exact absurd (Except.ok.inj hok) nofun
          
          /-- The exact finite prefix of native successful scanner transitions.
              The count is the number of consumed scanner-loop fuel units. -/
          inductive ScanPrefix : Nat → ScannerState → ScannerState → Prop where
            | zero (s : ScannerState) : ScanPrefix 0 s s
            | step {n : Nat} {s t u : ScannerState} :
                scanNextToken s = .ok (some t) → ScanPrefix n t u →
                ScanPrefix (n + 1) s u
          
          /-- A successful run supplies its own reachable terminal cursor, the actual
              EOF preprocessing result, a related empty surface, and the very same
              returned token array, with the exact fuel accounting. -/
          theorem loop_reachable_eof (sc : ScannerState) (sp : SurfPos) (fuel : Nat)
              (tokens : Array (Positioned YamlToken))
              (hcorr : ScannerSurfCorr sc sp)
              (hok : scanLoop sc fuel = .ok tokens) :
              ∃ (n rest : Nat) (t e : ScannerState) (p : SurfPos),
                fuel = n + (rest + 1) ∧ ScanPrefix n sc t ∧
                scanNextToken t = .ok none ∧ skipToContent t = .ok e ∧
                ScannerSurfCorr e p ∧ ¬ e.hasMore ∧ p.chars = [] ∧
                scanLoop t (rest + 1) = .ok tokens := by
            induction fuel generalizing sc sp tokens with
            | zero => simp [scanLoop] at hok
            | succ fuel' ih =>
              cases hn : scanNextToken sc with
              | error err => simp [scanLoop, hn] at hok
              | ok v =>
                cases v with
                | none =>
                  obtain ⟨e, p, hs, hc, he, hp⟩ := next_none_reachable_eof sc sp hcorr hn
                  exact ⟨0, fuel', sc, e, p, by omega, .zero _, hn, hs, hc, he, hp, hok⟩
                | some t =>
                  obtain ⟨sp', hc⟩ := scanNextToken_corr sc sp hcorr t hn
                  have ht : scanLoop t fuel' = .ok tokens := by
                    simpa only [scanLoop, hn] using hok
                  obtain ⟨n, rest, u, e, p, hfuel, hpath, hnone, hs, hcorr', he, hp, hl⟩ :=
                    ih t sp' tokens hc ht
                  exact ⟨n + 1, rest, u, e, p, by omega, .step hn hpath, hnone, hs, hcorr', he, hp, hl⟩
          
          /-- Use the actual production initialization including BOM. -/
          @[expose] def scanInitial (input : String) : ScannerState :=
            let s := (ScannerState.mk' input).emit .streamStart
            match s.peek? with
            | some '\uFEFF' => s.consumeBOM
            | _ => s
          
          theorem full_consumption_reachable (input : String)
              (tokens : Array (Positioned YamlToken)) (h : scan input = .ok tokens) :
              ∃ (n rest : Nat) (t e : ScannerState) (p : SurfPos),
                (input.utf8ByteSize + 1) * 4 = n + (rest + 1) ∧
                ScanPrefix n (scanInitial input) t ∧
                scanNextToken t = .ok none ∧ skipToContent t = .ok e ∧
                ScannerSurfCorr e p ∧ ¬ e.hasMore ∧ p.chars = [] ∧
                scanLoop t (rest + 1) = .ok tokens := by
            have hloop : scanLoop (scanInitial input) ((input.utf8ByteSize + 1) * 4) = .ok tokens := h
            have h_chars := L4YAML.Proofs.ScanStrictCoupling.chars_from_zero_toList input
            have h_init := initial_corr input input.toList h_chars
            have h_emit : ScannerSurfCorr ((ScannerState.mk' input).emit .streamStart)
                ⟨input.toList, 0⟩ :=
              ⟨h_init.chars_from, h_init.col_eq, h_init.end_eq, h_init.input_prefix, h_init.indent_cols_nonneg⟩
            have h_bom : ∃ sp, ScannerSurfCorr (scanInitial input) sp := by
              unfold scanInitial
              dsimp only []
              split
              · exact (consumeBOM_corr _ _ h_emit).imp fun _ h => h.1
              · exact ⟨_, h_emit⟩
            obtain ⟨sp, hc⟩ := h_bom
            exact loop_reachable_eof _ sp _ tokens hc hloop
          
          #print axioms old_conclusion_without_execution
          #print axioms preprocess_none_reachable_eof
          #print axioms next_none_reachable_eof
          #print axioms loop_reachable_eof
          #print axioms full_consumption_reachable
          /-- Retain the actual initial grammar prefix, not just an arbitrary
              correlated surface. BOM consumes one character and no column. -/
          theorem initial_prefix_corr (input : String) :
              ∃ sp, GStar SLDocumentPrefix ⟨input.toList, 0⟩ sp ∧ sp.col = 0 ∧
                ScannerSurfCorr (scanInitial input) sp := by
            let s := (ScannerState.mk' input).emit .streamStart
            have hi := initial_corr input input.toList
              (L4YAML.Proofs.ScanStrictCoupling.chars_from_zero_toList input)
            have hc : ScannerSurfCorr s ⟨input.toList, 0⟩ :=
              ⟨hi.chars_from, hi.col_eq, hi.end_eq, hi.input_prefix, hi.indent_cols_nonneg⟩
            unfold scanInitial
            change ∃ sp, GStar SLDocumentPrefix ⟨input.toList, 0⟩ sp ∧ sp.col = 0 ∧
              ScannerSurfCorr (match s.peek? with
                | some '\uFEFF' => s.consumeBOM
                | _ => s) sp
            split
            · have hb : s.peek? = some '\uFEFF' := by assumption
              have hm : s.offset < s.inputEnd := by
                by_cases hn : s.offset < s.inputEnd
                · exact hn
                · simp [ScannerState.peek?, hn] at hb
              obtain ⟨c, rest, hchars, hpeek⟩ := peek_corr s ⟨input.toList, 0⟩ hc hm
              have he : c = '\uFEFF' := Option.some.inj (hpeek.symm.trans hb)
              subst c
              have hcs : input.toList = '\uFEFF' :: rest := hchars
              have hcol : s.col = 0 := hc.col_eq.symm
              have hstep : ScannerSurfCorr s ⟨'\uFEFF' :: rest, s.col⟩ := by
                rw [hcol, ← hcs]
                exact hc
              have ha := advance_non_newline_corr s '\uFEFF' rest hstep hm (by decide) (by decide)
              refine ⟨⟨rest, 0⟩, ?_, rfl, ?_⟩
              · rw [hcs]
                exact .cons _ _ _ (SLDocumentPrefix.bom rest 0 _ (.nil _)) (.nil _)
              · exact ⟨ha.chars_from, rfl, ha.end_eq, ha.input_prefix, ha.indent_cols_nonneg⟩
            · exact ⟨_, .nil _, rfl, hc⟩
          
          /-- Transport source correspondence through the exact native execution prefix. -/
          theorem prefix_corr {n : Nat} {s t : ScannerState}
              (path : ScanPrefix n s t) (sp : SurfPos)
              (hcorr : ScannerSurfCorr s sp) : ∃ p, ScannerSurfCorr t p := by
            induction path generalizing sp with
            | zero s => exact ⟨sp, hcorr⟩
            | step hn path ih =>
              obtain ⟨p, hp⟩ := scanNextToken_corr _ sp hcorr _ hn
              exact ih p hp
          
          /-- Public filtered entry point: preserve the actual initial source prefix,
              native transition path, correlated pre-terminal cursor and actual EOF,
              and the exact raw token array and its placeholder-filtered projection.
              No grammar trace, acceptance completeness, or step invariant is assumed
              or claimed by this theorem. -/
          theorem filtered_execution_boundary (input : String)
              (filtered : Array (Positioned YamlToken)) (h : scanFiltered input = .ok filtered) :
              ∃ (p_init p_terminal p_eof : SurfPos) (n rest : Nat)
                (t e : ScannerState) (raw : Array (Positioned YamlToken)),
                GStar SLDocumentPrefix ⟨input.toList, 0⟩ p_init ∧ p_init.col = 0 ∧
                ScannerSurfCorr (scanInitial input) p_init ∧
                (input.utf8ByteSize + 1) * 4 = n + (rest + 1) ∧
                ScanPrefix n (scanInitial input) t ∧ ScannerSurfCorr t p_terminal ∧
                scanNextToken t = .ok none ∧ skipToContent t = .ok e ∧
                ScannerSurfCorr e p_eof ∧ ¬ e.hasMore ∧ p_eof.chars = [] ∧
                scanLoop t (rest + 1) = .ok raw ∧ scan input = .ok raw ∧
                filtered = raw.filter (fun tok => tok.val != .placeholder) := by
            cases hs : scan input with
            | error err => simp [scanFiltered, hs] at h
            | ok raw =>
              have hf : raw.filter (fun tok => tok.val != .placeholder) = filtered := by
                simpa [scanFiltered, hs] using h
              obtain ⟨p_init, hp, hz, hi⟩ := initial_prefix_corr input
              obtain ⟨n, rest, t, e, p_eof, hfuel, hpath, hnone, hskip, hec, heof, hempty, hloop⟩ :=
                full_consumption_reachable input raw hs
              obtain ⟨p_terminal, htc⟩ := prefix_corr hpath p_init hi
              exact ⟨p_init, p_terminal, p_eof, n, rest, t, e, raw,
                hp, hz, hi, hfuel, hpath, htc, hnone, hskip, hec, heof, hempty, hloop,
                by first | exact hs | rfl, hf.symm⟩
          
          #print axioms initial_prefix_corr
          #print axioms prefix_corr
          #print axioms filtered_execution_boundary
          end L4YAML.Proofs.ReachableEOF
          LEAN
          cp Tests/Guards/Proofs/ReachableEOF.lean ../results/
          lake build Tests.Guards.Proofs.ReachableEOF 2>&1 | tee ../results/reachable-eof-proof.log
          for name in old_conclusion_without_execution preprocess_none_reachable_eof next_none_reachable_eof loop_reachable_eof full_consumption_reachable; do
            grep -F "$name" ../results/reachable-eof-proof.log
          done
          if grep -E 'sorryAx|declaration uses .sorry' ../results/reachable-eof-proof.log; then exit 1; fi
          git diff --check
          printf 'reachable_eof\t0\n' >> ../results/outcomes.tsv
      - name: Adversarial controls for actual post-key landing before proof
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/KeyLandingControls.lean <<'LEAN'
          module
          public import L4YAML.Scanner.Scanner
          public import L4YAML.Parser.Composition
          public meta import L4YAML.Scanner.Scanner
          public meta import L4YAML.Parser.Composition
          @[expose] public section Blanket
          open L4YAML L4YAML.Scanner
          def nextState (s : ScannerState) : IO ScannerState :=
            match scanNextToken s with
            | .ok (some s') => pure s'
            | _ => throw (IO.userError "expected scanner step")
          def checkLanding (input : String) : IO Unit := do
            let q ← nextState ((ScannerState.mk' input).emit .streamStart)
            let k ← nextState q
            match scanNextToken_preprocess k with
            | .ok (some (v, c)) =>
              IO.println (input, k.offset, k.col, k.peek?, k.peekBack?, v.col, c)
              unless c == ':' && v.col == q.explicitKeyCol.toNat &&
                k.col > v.col && !v.inFlow && (scanValue v).isOk &&
                (TokenParser.parseYaml input).isOk do
                throw (IO.userError "post-key column/colon prediction refuted")
            | _ => throw (IO.userError "post-key preprocessing rejected")
          #eval do
            for s in ["? a\n: b", "? a # note\n: b", "? \"a\" # note\n: b",
              "? 'a'\n# middle\n: b"] do
              checkLanding s
            unless !(TokenParser.parseYaml "? a\n\t: b").isOk &&
              !(TokenParser.parseYaml "? -\n  :").isOk do
              throw (IO.userError "tab/compact negative control refuted")
            IO.println "FOUR_LANDING_AND_TWO_NEGATIVE_CONTROLS_PASS"
          end Blanket
          LEAN
          lake build Tests.Guards.Proofs.KeyLandingControls 2>&1 | tee ../results/key-landing-controls.log
          grep -F FOUR_LANDING_AND_TWO_NEGATIVE_CONTROLS_PASS ../results/key-landing-controls.log
          cp Tests/Guards/Proofs/KeyLandingControls.lean ../results/
          git diff --exit-code -- L4YAML
      - name: Predict and test the lost initial dispatch-state distinction
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/RootDispatchControls.lean <<'LEAN'
          module
          public import L4YAML.Scanner.Scanner
          public import L4YAML.Parser.Composition
          public import L4YAML.Proofs.Serialization.TokenEvents
          public meta import L4YAML.Scanner.Scanner
          public meta import L4YAML.Parser.Composition
          public meta import L4YAML.Proofs.Serialization.TokenEvents
          @[expose] public section Blanket
          open L4YAML L4YAML.Scanner L4YAML.Proofs.Serialization.TokenEvents
          def openDoc (s : ScannerState) : ScannerState :=
            if s.allowDirectives then { s with allowDirectives := false, documentEverStarted := true } else s
          def init (input : String) : ScannerState :=
            let s := (ScannerState.mk' input).emit .streamStart
            match s.peek? with
            | some '\uFEFF' => s.consumeBOM
            | _ => s
          def checkBoundary (input : String) : IO Unit := do
            let start := init input
            match scanNextToken_preprocess start with
            | .ok (some (q, '?')) =>
              match scanKey q, scanKey (openDoc q), scanNextToken start with
              | .ok raw, .ok updated, .ok (some actual) =>
                IO.println (input, raw.allowDirectives, raw.documentEverStarted,
                  actual.allowDirectives, actual.documentEverStarted,
                  raw.tokens == actual.tokens, reprStr updated == reprStr actual)
                unless raw.allowDirectives && !raw.documentEverStarted &&
                    !actual.allowDirectives && actual.documentEverStarted &&
                    raw.tokens == actual.tokens && reprStr updated == reprStr actual &&
                    reprStr raw != reprStr actual &&
                    (TokenParser.parseYaml input).isOk do
                  throw (IO.userError "preprocess/dispatch distinction prediction refuted")
              | _, _, _ => throw (IO.userError "expected actual key transition")
            | _ => throw (IO.userError "expected initial question-mark preprocessing")
          #eval do
            for s in ["? a\n: b", "? a # key\n: b # value", "? 'a'\n: \"b\"", "# lead\n? a\n: b",
              "\uFEFF? a\n: b", "  ? a\n  : b"] do
              checkBoundary s
            IO.println "SIX_INITIAL_DISPATCH_ABLATION_CONTROLS_PASS"
          end Blanket
          LEAN
          cp Tests/Guards/Proofs/RootDispatchControls.lean ../results/
          lake build Tests.Guards.Proofs.RootDispatchControls 2>&1 | tee ../results/root-dispatch-controls.log
          grep -F SIX_INITIAL_DISPATCH_ABLATION_CONTROLS_PASS ../results/root-dispatch-controls.log
          git diff --exit-code -- L4YAML
      - name: Narrow only the annotated [211] grammar; replay frozen after-case
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("L4YAML/Proofs/Serialization/TraceOf/Document.lean")
          s=p.read_text()
          old="      TOpt TLAnyDocument s₂ s₃ e₁ →"
          new="      TOpt TLExplicitDocument s₂ s₃ e₁ →"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          after=Path("../solution/L4YAML/Proofs/Serialization/TraceOf/Document.lean").read_text()
          assert after.count(new)==1
          PY
          git diff -- L4YAML > ../results/grammar-only.diff
      - name: Retain the directive case by making its exact landing evidence explicit
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("L4YAML/Proofs/Serialization/TraceOf/DocBridge.lean")
          s=p.read_text()
          old="(TOpt.some _ _ _ (TLAnyDocument.explicit _ _ _\n      (TLExplicitDocument.withContent s₂ s₃ s' eb hde hb))) (TStar.nil _)"
          new="(TOpt.some _ _ _ (TLExplicitDocument.withContent s₂ s₃ s' eb hde hb)) (TStar.nil _)"
          assert s.count(old)==1
          s=s.replace(old,new)
          start=s.index("lemma TLYamlStream.directiveRoute")
          a=s.rfind("/--",0,start)
          b=s.index("/-- A star grows",start)
          assert a>=0 and "lemma TLYamlStream.directiveRoute" in s[a:b]
          s=s[:a]+'''/-- YAML [211] permits a directive document only in the initial document slot
          or a slot following one or more document suffixes. A closed arbitrary stream
          alone is not a certificate of either landing. -/
          inductive DirectiveLanding (s : SurfPos) : SurfPos → List Event → Prop where
            | initial (s' : SurfPos) (hp : GStar SLDocumentPrefix s s') :
                DirectiveLanding s s' []
            | afterSuffix (s₀ s₁ s' : SurfPos) (e₀ e₁ : List Event)
                (h : TLYamlStream s s₀ e₀) (hs : TPlus TLDocumentSuffix s₀ s₁ e₁)
                (hp : GStar SLDocumentPrefix s₁ s') :
                DirectiveLanding s s' (e₀ ++ e₁)

          /-- Directives then explicit body, retaining their proper event order and the
          actual [211] initial or post-suffix slot. This consumes landing evidence; it
          does not establish scanner reachability of such a landing. -/
          lemma TLYamlStream.directiveRoute {s s₂ s₃ s₄ s' : SurfPos} {e ed eb : List Event}
              (h : DirectiveLanding s s₂ e)
              (hd : TPlus TLDirective s₂ s₃ ed) (hde : SCDirectivesEnd s₃ s₄)
              (hb : TLExplicitBody s₄ s' eb) :
              TLYamlStream s s' (e ++ .beginDocument :: ed ++ eb) := by
            have doc : TLAnyDocument s₂ s' (.beginDocument :: ed ++ eb) :=
              .directive _ _ _ (.mk _ _ _ _ ed eb hd hde hb)
            cases h with
            | initial sp hp =>
              simpa using TLYamlStream.single _ _ _ _ (.beginDocument :: ed ++ eb) [] hp
                (TOpt.some _ _ _ doc) (TStar.nil _)
            | afterSuffix sp₀ sp₁ sp₂ e₀ e₁ hstream hs hp =>
              simpa [List.append_assoc] using TLYamlStream.suffixContinue _ _ _ _ _ _ e₀ e₁
                (.beginDocument :: ed ++ eb) [] hstream hs hp (TOpt.some _ _ _ doc) (TStar.nil _)

          '''+s[b:]
          p.write_text(s)
          p=Path("L4YAML/Proofs/Serialization/TraceOf/StreamBridge.lean")
          s=p.read_text()
          start=s.index("lemma docStart_step_run")
          end=s.index("/--",start)
          block=s[start:end]
          a="    (hS : TSLYamlStream sp_start s_prep sp_block ev_c [] p)\n"
          assert block.count(a)==1
          block=block.replace(a,a+"    (h_landing : DirectiveLanding sp_start sp_block ev_c)\n")
          a="TLYamlStream.directiveRoute hS.stream (GStar.nil _) (h_acc sp_prep h_pre) hde hb"
          assert block.count(a)==1
          block=block.replace(a,"TLYamlStream.directiveRoute h_landing (h_acc sp_prep h_pre) hde hb")
          s=s[:start]+block+s[end:]
          assert s.count("lemma docStart_step_run")==1
          assert "content_step_park" in s
          p.write_text(s)
          PY
          git diff --check
          git diff -- L4YAML > ../results/lawful-route.diff
          test "$(git diff --name-only -- L4YAML | wc -l)" = 3
      - name: Derive landing at real suffix and retain it in actual directive park
        working-directory: upstream
        shell: bash
        run: |
