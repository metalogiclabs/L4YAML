      - name: Compose certified colon partition with actual root value consumer
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/ColonRolePartition.lean <<'LEAN'
          module
          public import L4YAML.Proofs.Scanner.ExplicitKeyCoupling
          public import L4YAML.Parser.Composition
          public meta import L4YAML.Scanner.Scanner
          public meta import L4YAML.Parser.Composition
          @[expose] public section Blanket
          namespace L4YAML.Tests.Guards.ColonRolePartition
          open L4YAML L4YAML.Scanner
          open L4YAML.Proofs.ExplicitKeyCoupling
          
          /-- Explicitly preserve the alternative in the existing preprocessing theorem.
              It is not licensed to silently identify a re-read register with the old one. -/
          def StaleAt (s s1 : ScannerState) : Prop :=
            s.explicitKeyLine ≠ none ∧
              ∃ (t : ScannerState) (c' : Char), t.peek? = some c' ∧
                s1 = (t.closeStaleAt c').readPendingKey
          
          /-- The matching coordinate follows on the un-stamped, retained-register route.
              The actual scanner chain yields a partition, not unconditional equality.
              The stamp or either stale-register path must remain visible to a consumer. -/
          lemma scalar_colon_role_partition
              {q sc prep ad k v out : ScannerState} {c : Char}
              (hq : scanKey q = .ok sc)
              (hpre : scanNextToken_preprocess sc = .ok (some (prep, c)))
              (had : ad = if prep.allowDirectives then
                { prep with allowDirectives := false, documentEverStarted := true } else prep)
              (hdispatch : scanNextToken_dispatchContent ad c = .ok k)
              (hvpre : scanNextToken_preprocess k = .ok (some (v, ':')))
              (hv : scanValue v = .ok out)
              (hf : v.inFlow = false)
              (hp : v.peek? = some ':') :
              v.col = q.col ∨ out.implicitValueLine = some out.line ∨
                StaleAt sc prep ∨ StaleAt k v := by
            rcases preprocess_explicitKey_cases sc prep c hpre with h1 | h1
            · rcases preprocess_explicitKey_cases k v ':' hvpre with h2 | h2
              · have ha : ad.explicitKeyCol = prep.explicitKeyCol := by
                  rw [had]
                  split <;> rfl
                have hk := dispatchContent_preserves_explicitKeyCol ad c k hdispatch
                have hr : v.explicitKeyCol = (q.col : Int) :=
                  h2.2.trans (hk.trans (ha.trans (h1.2.trans (scanKey_ok_explicitKey hq).2)))
                by_cases hm : v.col = q.col
                · exact Or.inl hm
                · right
                  left
                  apply scanValue_stamp_of_col_ne hv hf hp
                  rw [hr]
                  omega
              · exact Or.inr (Or.inr (Or.inr h2))
            · exact Or.inr (Or.inr (Or.inl h1))
          
          /-- Recover the old coordinate premise only after the actual alternative
              branches have been excluded, never merely from scanner success. -/
          lemma matching_column_of_no_stamp_or_stale
              {q sc prep ad k v out : ScannerState} {c : Char}
              (hq : scanKey q = .ok sc)
              (hpre : scanNextToken_preprocess sc = .ok (some (prep, c)))
              (had : ad = if prep.allowDirectives then
                { prep with allowDirectives := false, documentEverStarted := true } else prep)
              (hdispatch : scanNextToken_dispatchContent ad c = .ok k)
              (hvpre : scanNextToken_preprocess k = .ok (some (v, ':')))
              (hv : scanValue v = .ok out)
              (hf : v.inFlow = false)
              (hp : v.peek? = some ':')
              (hn : out.implicitValueLine ≠ some out.line)
              (hs1 : ¬ StaleAt sc prep) (hs2 : ¬ StaleAt k v) :
              v.col = q.col := by
            rcases scalar_colon_role_partition hq hpre had hdispatch hvpre hv hf hp with
              h | h | h | h
            · exact h
            · exact False.elim (hn h)
            · exact False.elim (hs1 h)
            · exact False.elim (hs2 h)
          
          #print axioms scalar_colon_role_partition
          #print axioms matching_column_of_no_stamp_or_stale
          
          end L4YAML.Tests.Guards.ColonRolePartition
          end Blanket
          LEAN
          cat > Tests/Guards/Proofs/RootKeyValueControls.lean <<'LEAN'
          module
          public import L4YAML.Scanner.Scanner
          public import L4YAML.Parser.Composition
          public import L4YAML.Proofs.Serialization.TokenEvents
          public meta import L4YAML.Scanner.Scanner
          public meta import L4YAML.Parser.Composition
          public meta import L4YAML.Proofs.Serialization.TokenEvents
          @[expose] public section Blanket
          open L4YAML L4YAML.Scanner L4YAML.Proofs.Serialization.TokenEvents
          def nextState (s : ScannerState) : IO ScannerState :=
            match scanNextToken s with
            | .ok (some s') => pure s'
            | _ => throw (IO.userError "expected scanner step")
          def checkRootValue (input : String) : IO Unit := do
            let q ← nextState ((ScannerState.mk' input).emit .streamStart)
            let k ← nextState q
            match scanNextToken_preprocess k with
            | .ok (some (v, ':')) =>
              match scanValue v with
              | .ok out =>
                unless (v.col : Int) == q.explicitKeyCol &&
                  out.implicitValueLine != some out.line do
                  throw (IO.userError "not the root value colon")
                let val ← nextState out
                match scanFiltered input with
                | .ok ts =>
                  IO.println (input, q.explicitKeyCol, v.col, out.col, val.col,
                    val.offset, input.utf8ByteSize, (tokenEvents ts).length)
                  unless (tokenEvents val.tokens).isEmpty && (tokenEvents ts).isEmpty &&
                    (TokenParser.parseYaml input).isOk do
                    throw (IO.userError "root trace or parser control refuted")
                | .error _ => throw (IO.userError "expected whole scanner success")
              | .error _ => throw (IO.userError "expected successful value scan")
            | _ => throw (IO.userError "expected colon preprocessing")
          #eval do
            for s in ["? a\n: b", "? a # note\n: b", "? \"a\" # note\n: 'b'",
                "? 'a'\n# middle\n: \"b\"", "? a\n: b # tail\n"] do
              checkRootValue s
            unless !(TokenParser.parseYaml "? a\n\t: b").isOk do
              throw (IO.userError "tab control refuted")
            IO.println "FIVE_ROOT_KEY_VALUE_AND_ONE_NEGATIVE_CONTROL_PASS"
          end Blanket
          LEAN
          lake build Tests.Guards.Proofs.RootKeyValueControls 2>&1 | tee ../results/root-controls.log
          grep -F FIVE_ROOT_KEY_VALUE_AND_ONE_NEGATIVE_CONTROL_PASS ../results/root-controls.log
          cp Tests/Guards/Proofs/RootKeyValueControls.lean ../results/
      - name: Produce a scalar key certificate from actual scanKey and content dispatch
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/ScalarKeyProducer.lean <<'LEAN'
          /- Bounded conditional producer: scalar (plain/quoted) explicit keys only.
          No whole-stream route is assumed for the first lemma.  The second lemma
          consumes the retained key with the actual colon scanner production.
          Actual reachability of SlotGateAt, NextIsSep and the enclosing mapping
          route, and property/alias/block/flow keys, are separate obligations. -/
          module
          public import L4YAML.Proofs.Serialization.TraceOf.StreamBridge
          public import Tests.Guards.Proofs.ColonRolePartition
          public section
          namespace L4YAML.Tests.Guards.ScalarKeyProducer
          open L4YAML L4YAML.Scanner L4YAML.Surface
          open L4YAML.Proofs.Serialization.SerializationWellFormed
          open L4YAML.Proofs.Serialization.TraceOf
          open L4YAML.Proofs.Serialization.TraceOf.DocBridge
          open L4YAML.Proofs.Serialization.TraceOf.StreamBridge
          open L4YAML.Proofs.Serialization.TraceOf.ContentBridge
          open L4YAML.Proofs.CouplingBridge L4YAML.Proofs.StructureProduction
          open L4YAML.Proofs.PreprocessIndentStable
          open L4YAML.Proofs.PreprocessProduction
          open L4YAML.Proofs.ScannerWhitespace L4YAML.Proofs.ScannerCoupling
          open L4YAML.Proofs.TabIndentBridge
          open L4YAML.Proofs.StreamAccum (ContentArm NextIsSep SlotGateAt white_prepend_SSLComments)
          lemma scalar_key_prefix_retained_from_scan
              {s_q sc s_prep s_ad s' : ScannerState} {c : Char}
              {sp_q sp_prep sp_a : SurfPos}
              (hq_corr : ScannerSurfCorr s_q sp_q) (hq_peek : s_q.peek? = some '?')
              (hq_scan : scanKey s_q = .ok sc) (hq_flow : s_q.inFlow = false)
              (hq_nic : s_q.needIndentCheck = false)
              (h_next : NextIsSep sc)
              (h_ad : s_ad = if s_prep.allowDirectives then
                { s_prep with allowDirectives := false, documentEverStarted := true } else s_prep)
              (hcorr_prep : ScannerSurfCorr s_prep sp_prep)
              (hcorr' : ScannerSurfCorr s' sp_a)
              (h_preprocess : scanNextToken_preprocess sc = .ok (some (s_prep, c)))
              (arm : ContentArm s_ad s' c sp_prep sp_a)
              (h_depth : s_ad.flowLevel = 0)
              (h_dispatch : scanNextToken_dispatchContent s_ad c = .ok s')
              (h_not_doc : s_ad.col = 0 → atDocumentBoundary s_ad = false)
              (h_amp : c ≠ '&') (h_star : c ≠ '*') (h_bang : c ≠ '!')
              (h_pipe : c ≠ '|') (h_gt : c ≠ '>')
              (h_src : SlotGateAt s_prep) :
              ∃ sp_afterQ, GLit '?' sp_q sp_afterQ ∧ ScannerSurfCorr sc sp_afterQ ∧
                (((∃ sp_gram, GStar SSWhite sp_gram sp_a ∧
                    (sp_gram = sp_a → s'.col ≠ 0 →
                      ¬ (CommentOk s' ∧ s'.peek? = some '#')) ∧
                    ∀ sp_key, SSLComments sp_gram sp_key →
                    TBlockIndented s_q.col .blockOut sp_afterQ sp_key []) ∧
                  PushesTrace s_ad.tokens s'.tokens []) ∨
                  L4YAML.Proofs.FlowIndexLift.DedentLanding (s_q.col + 1) sp_afterQ sp_prep) := by
            obtain ⟨sp_afterQ, hq, h_corr⟩ := scanKey_prod s_q sp_q hq_corr hq_peek sc hq_scan
            refine ⟨sp_afterQ, hq, h_corr, ?_⟩
            have h_floor : IndentFloor sc (s_q.col + 1) :=
              IndentFloor.succ_of_int_le ((scanKey_needIndentCheck hq_flow hq_scan).trans hq_nic)
                (scanKey_col_le_currentIndent hq_flow hq_scan)
            have h_col : s_q.col + 1 ≤ sp_afterQ.col := by
              have hqc := hq_corr.col_eq
              cases hq
              simp_all
            have h_col0 : 0 < sp_afterQ.col := by omega
            have hflow : s_ad.inFlow = false := by unfold ScannerState.inFlow; rw [h_depth]; rfl
            have hcorr_ad : ScannerSurfCorr s_ad sp_prep := by
              rw [h_ad]
              exact L4YAML.Proofs.StreamAccum.corr_of_allowDirectives_update hcorr_prep
            have hpeek : s_ad.peek? = some c := by
              rw [h_ad]
              have := L4YAML.Proofs.StreamAccum.preprocess_some_peek h_preprocess
              split <;> exact this
            rcases TPendingNode.content_sep_of_preprocess h_ad h_floor h_col h_col0 h_next h_corr
                hcorr_prep hcorr' h_preprocess h_not_doc hflow h_dispatch h_src with
              ⟨h_sep, h_fl⟩ | h_ded
            · obtain ⟨sp_gram, sp_res, hT, hws, hgate, hcorr_res⟩ :=
                content_leaf_at_with_gate (s_q.col + 1) hcorr_ad hpeek hflow h_not_doc
                  h_amp h_star h_bang h_pipe h_gt h_dispatch h_fl
              obtain rfl : sp_res = sp_a := ScannerSurfCorr_unique hcorr_res hcorr'
              obtain ⟨ev_n, hpt, hdisj⟩ := accum_step_content_trace_out arm hcorr_ad hpeek h_depth h_dispatch
              have hev : ev_n = [] := by
                rcases hdisj with ⟨hev, -⟩ | ⟨hev, -⟩ | ⟨hev, -⟩ | ⟨hc, -⟩ | ⟨hc, -⟩ | ⟨hc, -⟩
                · exact hev
                · exact hev
                · exact hev
                · exact absurd hc h_amp
                · exact absurd hc h_bang
                · exact absurd hc h_star
              subst ev_n
              refine Or.inl ⟨⟨sp_gram, hws, hgate, ?_⟩, hpt⟩
              intro sp_key hssl
              exact .node _ .blockOut _ _ []
                (.flowInBlock _ .blockOut _ _ _ _ [] h_sep (.content _ _ _ _ _ hT)
                  hssl)
            · exact Or.inr h_ded
          
          /-- Consume the same retained key at the actual colon scan, supplying
          precisely the mapValue park that content_step_park already consumes.
          The map indentation and enclosing route remain explicit premises. -/
          lemma scalar_key_to_value_route
              {n : Nat} {sp_start sp_q sp_afterQ sp_key sp_colon : SurfPos}
              {sc sc' : ScannerState} {ev_c ev_o : List Event}
              (hq : GLit '?' sp_q sp_afterQ)
              (hk : TBlockIndented n .blockOut sp_afterQ sp_key [])
              (hi : SIndent n sp_key sp_colon)
              (hcorr : ScannerSurfCorr sc sp_colon)
              (hpeek : sc.peek? = some ':') (hok : scanValue sc = .ok sc')
              (route : ∀ sp ev, TBlockMapEntry n sp_q sp ev →
                TLYamlStream sp_start sp (ev_c ++ ev_o ++ ev)) :
              ∃ sp_afterColon, ScannerSurfCorr sc' sp_afterColon ∧
                (∀ sp_mid ev_v, TBlockNode (n + 1) .blockOut sp_afterColon sp_mid ev_v →
                  TLYamlStream sp_start sp_mid (ev_c ++ ev_o ++ ev_v)) := by
            obtain ⟨sp_afterColon, hc, hcorr'⟩ := scanValue_prod sc sp_colon hcorr hpeek sc' hok
            refine ⟨sp_afterColon, hcorr', ?_⟩
            intro sp_mid ev_v hv
            have he : TBlockMapEntry n sp_q sp_mid ([] ++ ev_v) :=
              .explicit n sp_q sp_afterQ sp_key sp_colon sp_afterColon sp_mid [] ev_v hq hk hi hc
                (.node n .blockOut _ _ _ hv)
            simpa using route sp_mid ([] ++ ev_v) he
          
          lemma scalar_key_to_value_park
              {n : Nat} {sp_start sp_q sp_afterQ sp_key sp_colon : SurfPos}
              {sc sc' : ScannerState} {c : Char} {ev_c ev_o : List Event}
              (hq : GLit '?' sp_q sp_afterQ)
              (hk : TBlockIndented n .blockOut sp_afterQ sp_key [])
              (hi : SIndent n sp_key sp_colon)
              (hcorr : ScannerSurfCorr sc sp_colon)
              (hpeek : sc.peek? = some ':') (hok : scanValue sc = .ok sc')
              (route : ∀ sp ev, TBlockMapEntry n sp_q sp ev →
                TLYamlStream sp_start sp (ev_c ++ ev_o ++ ev)) :
              ∃ sp_afterColon, ScannerSurfCorr sc' sp_afterColon ∧
                TPendingNode.ContentPark sp_start sp_afterColon c ev_c (n + 1) ev_o := by
            obtain ⟨sp_afterColon, hc, hr⟩ := scalar_key_to_value_route hq hk hi hcorr hpeek hok route
            exact ⟨sp_afterColon, hc, .mapValue n ev_o hr⟩
          /-- Compose the previously checked producer and colon consumer at the same
          actual scanner continuation. No independent key certificate may be assumed.
          The closing comment and indentation witnesses and enclosing route remain explicit. -/
          lemma scalar_key_actual_landing_to_value_route
              {s_q sc s_prep s_ad s' sc_colon sc_afterColon : ScannerState} {c : Char}
              {sp_start sp_q sp_prep sp_a sp_colon : SurfPos} {ev_c ev_o : List Event}
              (hq_corr : ScannerSurfCorr s_q sp_q) (hq_peek : s_q.peek? = some '?')
              (hq_scan : scanKey s_q = .ok sc) (hq_flow : s_q.inFlow = false)
              (hq_nic : s_q.needIndentCheck = false)
              (h_next : NextIsSep sc)
              (h_ad : s_ad = if s_prep.allowDirectives then
                { s_prep with allowDirectives := false, documentEverStarted := true } else s_prep)
              (hcorr_prep : ScannerSurfCorr s_prep sp_prep)
              (hcorr' : ScannerSurfCorr s' sp_a)
              (h_preprocess : scanNextToken_preprocess sc = .ok (some (s_prep, c)))
              (arm : ContentArm s_ad s' c sp_prep sp_a)
              (h_depth : s_ad.flowLevel = 0)
              (h_dispatch : scanNextToken_dispatchContent s_ad c = .ok s')
              (h_not_doc : s_ad.col = 0 → atDocumentBoundary s_ad = false)
              (h_amp : c ≠ '&') (h_star : c ≠ '*') (h_bang : c ≠ '!')
              (h_pipe : c ≠ '|') (h_gt : c ≠ '>')
              (h_src : SlotGateAt s_prep)
              (h_deeper : s_q.col < sp_a.col)
              (h_colon_col : sp_colon.col = s_q.col)
              (h_colon_flow : sc_colon.inFlow = false)
              (hpre_colon : scanNextToken_preprocess s' = .ok (some (sc_colon, ':')))
              (hcorr_colon : ScannerSurfCorr sc_colon sp_colon)
              (hcolon : scanValue sc_colon = .ok sc_afterColon)
              (route : ∀ sp ev, TBlockMapEntry s_q.col sp_q sp ev →
                TLYamlStream sp_start sp (ev_c ++ ev_o ++ ev)) :
              ∃ sp_afterQ, GLit '?' sp_q sp_afterQ ∧ ScannerSurfCorr sc sp_afterQ ∧
                ((∃ sp_afterColon, ScannerSurfCorr sc_afterColon sp_afterColon ∧
                  PushesTrace s_ad.tokens s'.tokens [] ∧
                  (∀ sp_mid ev_v, TBlockNode (s_q.col + 1) .blockOut sp_afterColon sp_mid ev_v →
                    TLYamlStream sp_start sp_mid (ev_c ++ ev_o ++ ev_v))) ∨
                  L4YAML.Proofs.FlowIndexLift.DedentLanding (s_q.col + 1) sp_afterQ sp_prep) := by
            obtain ⟨sp_afterQ, hq, hcorrQ, h⟩ :=
              scalar_key_prefix_retained_from_scan hq_corr hq_peek hq_scan hq_flow hq_nic
                h_next h_ad hcorr_prep hcorr' h_preprocess arm h_depth h_dispatch
                h_not_doc h_amp h_star h_bang h_pipe h_gt h_src
            refine ⟨sp_afterQ, hq, hcorrQ, ?_⟩
            rcases h with ⟨⟨sp_gram, hrun, hg, hkey⟩, hpush⟩ | hd
            · classical
              obtain ⟨sp_mid, sp_ws, sp_prep2, hland, hws, _, hcorr2, hpk, hsuf⟩ :=
                L4YAML.Proofs.StreamAccum.preprocess_some_ssl_comments_landing
                  s' sp_a sc_colon ':' hcorr' hpre_colon hrun hg
              have hp := L4YAML.Proofs.StreamAccum.preprocess_some_peek hpre_colon
              have h_eq : sp_prep2 = sp_ws := by
                rcases hpk with h | h
                · exact h
                · rw [hp] at h
                  cases h
              have h_pe : sp_colon = sp_ws :=
                (ScannerSurfCorr_unique hcorr_colon hcorr2).trans h_eq
              rw [← h_pe] at hws
              rcases hland with hland | hflat
              · have hi : SIndent s_q.col sp_mid sp_colon := by
                  rcases L4YAML.Proofs.StreamAccum.gstar_white_sIndent_or_tab hws with
                    ⟨k, hk⟩ | htab
                  · have hw := L4YAML.Proofs.StreamAccum.SIndent_col hk
                    have hz := hland.2.1
                    have he : k = s_q.col := by omega
                    simpa [he] using hk
                  · have hsuf' : sp_mid.chars <:+ sc_colon.input.toList := by
                      rw [preprocess_input hpre_colon]
                      exact hsuf.trans (corr_chars_suffix hcorr')
                    have ht := tabIndent_scans_of_located hcorr_colon hsuf' hland.2.1 hws htab
                    exact False.elim (scanValue_tab_ne h_colon_flow ht.2 hcolon)
                obtain ⟨sp_afterColon, hc, hpark⟩ :=
                  scalar_key_to_value_route hq (hkey sp_mid hland.1) hi
                    hcorr_colon hp hcolon route
                exact Or.inl ⟨sp_afterColon, hc, hpush, hpark⟩
              · obtain ⟨ws, _, _, hcolrun⟩ := gstar_sswhite_run hws
                have hmid := hflat.1
                rw [hmid] at hcolrun
                exfalso
                omega
            · exact Or.inr hd
          
          
          lemma scalar_key_actual_landing_to_value_park
              {s_q sc s_prep s_ad s' sc_colon sc_afterColon : ScannerState} {c vc : Char}
              {sp_start sp_q sp_prep sp_a sp_colon : SurfPos} {ev_c ev_o : List Event}
              (hq_corr : ScannerSurfCorr s_q sp_q) (hq_peek : s_q.peek? = some '?')
              (hq_scan : scanKey s_q = .ok sc) (hq_flow : s_q.inFlow = false)
              (hq_nic : s_q.needIndentCheck = false)
              (h_next : NextIsSep sc)
              (h_ad : s_ad = if s_prep.allowDirectives then
                { s_prep with allowDirectives := false, documentEverStarted := true } else s_prep)
              (hcorr_prep : ScannerSurfCorr s_prep sp_prep)
              (hcorr' : ScannerSurfCorr s' sp_a)
              (h_preprocess : scanNextToken_preprocess sc = .ok (some (s_prep, c)))
              (arm : ContentArm s_ad s' c sp_prep sp_a)
              (h_depth : s_ad.flowLevel = 0)
              (h_dispatch : scanNextToken_dispatchContent s_ad c = .ok s')
              (h_not_doc : s_ad.col = 0 → atDocumentBoundary s_ad = false)
              (h_amp : c ≠ '&') (h_star : c ≠ '*') (h_bang : c ≠ '!')
              (h_pipe : c ≠ '|') (h_gt : c ≠ '>')
              (h_src : SlotGateAt s_prep)
              (h_deeper : s_q.col < sp_a.col)
              (h_colon_col : sp_colon.col = s_q.col)
              (h_colon_flow : sc_colon.inFlow = false)
              (hpre_colon : scanNextToken_preprocess s' = .ok (some (sc_colon, ':')))
              (hcorr_colon : ScannerSurfCorr sc_colon sp_colon)
              (hcolon : scanValue sc_colon = .ok sc_afterColon)
              (route : ∀ sp ev, TBlockMapEntry s_q.col sp_q sp ev →
                TLYamlStream sp_start sp (ev_c ++ ev_o ++ ev)) :
              ∃ sp_afterQ, GLit '?' sp_q sp_afterQ ∧ ScannerSurfCorr sc sp_afterQ ∧
                ((∃ sp_afterColon, ScannerSurfCorr sc_afterColon sp_afterColon ∧
                  PushesTrace s_ad.tokens s'.tokens [] ∧
                  TPendingNode.ContentPark sp_start sp_afterColon vc ev_c (s_q.col + 1) ev_o) ∨
                  L4YAML.Proofs.FlowIndexLift.DedentLanding (s_q.col + 1) sp_afterQ sp_prep) := by
            obtain ⟨sp_afterQ, hq, hc, h⟩ :=
              scalar_key_actual_landing_to_value_route hq_corr hq_peek hq_scan hq_flow hq_nic
                h_next h_ad hcorr_prep hcorr' h_preprocess arm h_depth h_dispatch h_not_doc
                h_amp h_star h_bang h_pipe h_gt h_src h_deeper h_colon_col h_colon_flow
                hpre_colon hcorr_colon hcolon route
            refine ⟨sp_afterQ, hq, hc, ?_⟩
            rcases h with ⟨sp_afterColon, hcorr, hpush, hr⟩ | hd
            · exact Or.inl ⟨sp_afterColon, hcorr, hpush, .mapValue s_q.col ev_o hr⟩
            · exact Or.inr hd
          
          /-- The actual grammar supplies the enclosing root route; no arbitrary
              map-to-stream function is passed by the caller. The root prefix,
              comment boundary and indentation still have to be produced by the fold. -/
          lemma root_single_map_route
              {sp_start sp_root sp_line sp_q : SurfPos} {n : Nat}
              (hprefix : GStar SLDocumentPrefix sp_start sp_root)
              (hcomments : SSLComments sp_root sp_line)
              (hindent : SIndent n sp_line sp_q) :
              ∀ sp ev, TBlockMapEntry n sp_q sp ev → TLYamlStream sp_start sp ev := by
            intro sp ev hentry
            have he : TBlockMapEntries n sp_line sp ev :=
              .single n sp_line sp_q sp ev hindent hentry
            have hn : TBlockNode 0 .blockIn sp_root sp ev := by
              simpa using (TBlockNode.blockMap 0 .blockIn n sp_root sp_root sp_line sp [] ev
                (TOpt.none _) hcomments (by simpa using he))
            exact TLYamlStream.bareRoute hprefix sp ev hn
          
          /-- Consume the retained key using the certified colon partition, then spend
              the produced mapValue park in the actual item-534 content_step_park and
              total consumers. No assumed colon equality or abstract root map route.
              This is a one-entry bare-root slice; the nonmatching colon and both
              dedent branches remain alternatives, not contradictions. -/
          lemma scalar_root_key_value_fold_to_stream
              {s_q sc s_prep s_ad s' sc_colon sc_afterColon sv_prep sv_ad sv' : ScannerState}
              {c vc : Char}
              {sp_start sp_root sp_line sp_q sp_prep sp_a sp_colon sp_vstart sp_vprep sp_va sp_block sp_end : SurfPos}
              (hq_corr : ScannerSurfCorr s_q sp_q) (hq_peek : s_q.peek? = some '?')
              (hq_scan : scanKey s_q = .ok sc) (hq_flow : s_q.inFlow = false)
              (hq_nic : s_q.needIndentCheck = false)
              (h_next : NextIsSep sc)
              (h_ad : s_ad = if s_prep.allowDirectives then
                { s_prep with allowDirectives := false, documentEverStarted := true } else s_prep)
              (hcorr_prep : ScannerSurfCorr s_prep sp_prep)
              (hcorr' : ScannerSurfCorr s' sp_a)
              (h_preprocess : scanNextToken_preprocess sc = .ok (some (s_prep, c)))
              (arm : ContentArm s_ad s' c sp_prep sp_a)
              (h_depth : s_ad.flowLevel = 0)
              (h_dispatch : scanNextToken_dispatchContent s_ad c = .ok s')
              (h_not_doc : s_ad.col = 0 → atDocumentBoundary s_ad = false)
              (h_amp : c ≠ '&') (h_star : c ≠ '*') (h_bang : c ≠ '!')
              (h_pipe : c ≠ '|') (h_gt : c ≠ '>')
              (h_src : SlotGateAt s_prep)
              (h_deeper : s_q.col < sp_a.col)
              (h_colon_flow : sc_colon.inFlow = false)
              (hpre_colon : scanNextToken_preprocess s' = .ok (some (sc_colon, ':')))
              (hcorr_colon : ScannerSurfCorr sc_colon sp_colon)
              (hcolon : scanValue sc_colon = .ok sc_afterColon)
              (hprefix : GStar SLDocumentPrefix sp_start sp_root)
              (hcomments : SSLComments sp_root sp_line)
              (hindent : SIndent s_q.col sp_line sp_q)
              (hcorr_vstart : ScannerSurfCorr sc_afterColon sp_vstart)
              (h_vnic : sc_colon.needIndentCheck = false)
              (h_vfresh : sc_colon.simpleKey.possible = true → sc_colon.simpleKey.pos.col = sc_colon.col)
              (h_vnext : NextIsSep sc_afterColon)
              (h_vad : sv_ad = if sv_prep.allowDirectives then
                { sv_prep with allowDirectives := false, documentEverStarted := true } else sv_prep)
              (h_vpreprocess : scanNextToken_preprocess sc_afterColon = .ok (some (sv_prep, vc)))
              (hcorr_vprep : ScannerSurfCorr sv_prep sp_vprep)
              (hcorr_va : ScannerSurfCorr sv' sp_va)
              (arm_v : ContentArm sv_ad sv' vc sp_vprep sp_va)
              (h_vdepth : sv_ad.flowLevel = 0)
              (h_vdispatch : scanNextToken_dispatchContent sv_ad vc = .ok sv')
              (h_vnotdoc : sv_ad.col = 0 → atDocumentBoundary sv_ad = false)
              (h_vsrc : SlotGateAt sv_prep)
              (hS : TSLYamlStream sp_start sv_ad sp_block [] [] [])
              (h_end : SSLComments sp_va sp_end) :
              TLYamlStream sp_start sp_end (L4YAML.Proofs.Serialization.TokenEvents.tokenEvents sv'.tokens) ∨
              (∃ sp_afterQ, L4YAML.Proofs.FlowIndexLift.DedentLanding (s_q.col + 1) sp_afterQ sp_prep) ∨
              L4YAML.Proofs.FlowIndexLift.DedentLanding (s_q.col + 1) sp_vstart sp_vprep ∨
              sc_afterColon.implicitValueLine = some sc_afterColon.line ∨
              L4YAML.Tests.Guards.ColonRolePartition.StaleAt sc s_prep ∨
              L4YAML.Tests.Guards.ColonRolePartition.StaleAt s' sc_colon := by
            have hp := L4YAML.Proofs.StreamAccum.preprocess_some_peek hpre_colon
            rcases L4YAML.Tests.Guards.ColonRolePartition.scalar_colon_role_partition
              hq_scan h_preprocess h_ad h_dispatch hpre_colon hcolon h_colon_flow hp with hm | hs | hs1 | hs2
            · have hcc : sp_colon.col = s_q.col := hcorr_colon.col_eq.trans hm
              have route : ∀ sp ev, TBlockMapEntry s_q.col sp_q sp ev →
                  TLYamlStream sp_start sp ([] ++ [] ++ ev) := by
                intro sp ev he
                simpa using root_single_map_route hprefix hcomments hindent sp ev he
              obtain ⟨sp_afterQ, _, _, h⟩ :=
                scalar_key_actual_landing_to_value_park (vc := vc)
                  hq_corr hq_peek hq_scan hq_flow hq_nic h_next h_ad hcorr_prep hcorr'
                  h_preprocess arm h_depth h_dispatch h_not_doc h_amp h_star h_bang h_pipe h_gt
                  h_src h_deeper hcc h_colon_flow hpre_colon hcorr_colon hcolon route
              rcases h with ⟨sp_afterColon, hcorr_after, _, hpark⟩ | hded
              · have h_after_eq : sp_afterColon = sp_vstart := ScannerSurfCorr_unique hcorr_after hcorr_vstart
                rw [h_after_eq] at hpark
                obtain ⟨sp_tmp, hgl, hcorr_tmp⟩ :=
                  scanValue_prod sc_colon sp_colon hcorr_colon hp sc_afterColon hcolon
                have h_tmp_eq : sp_tmp = sp_vstart := ScannerSurfCorr_unique hcorr_tmp hcorr_vstart
                rw [h_tmp_eq] at hgl
                have h_vcol : s_q.col + 1 ≤ sp_vstart.col := by
                  cases hgl
                  simp_all
                have h_vcol0 : 0 < sp_vstart.col := by omega
                have h_vfloor : IndentFloor sc_afterColon (s_q.col + 1) :=
                  IndentFloor.succ_of_int_le ((scanValue_needIndentCheck hcolon).trans h_vnic)
                    (by rw [← hm]; exact scanValue_col_le_currentIndent h_colon_flow h_vfresh hcolon)
                rcases TPendingNode.content_step_park hS hpark h_vad h_vfloor h_vcol h_vcol0
                    h_vnext hcorr_vstart hcorr_vprep hcorr_va h_vpreprocess arm_v h_vdepth
                    h_vdispatch h_vnotdoc h_vsrc with ⟨ev_n, hS', hP⟩ | hd
                · exact Or.inl (TPendingNode.total hS' hP h_end)
                · exact Or.inr (Or.inr (Or.inl hd))
              · exact Or.inr (Or.inl ⟨sp_afterQ, hded⟩)
            · exact Or.inr (Or.inr (Or.inr (Or.inl hs)))
            · exact Or.inr (Or.inr (Or.inr (Or.inr (Or.inl hs1))))
            · exact Or.inr (Or.inr (Or.inr (Or.inr (Or.inr hs2))))
          
          #print axioms root_single_map_route
          #print axioms scalar_root_key_value_fold_to_stream
          
          #print axioms content_leaf_at_with_gate
          #print axioms scalar_key_prefix_retained_from_scan
          #print axioms scalar_key_to_value_park
          #print axioms scalar_key_actual_landing_to_value_park
          end L4YAML.Tests.Guards.ScalarKeyProducer
          end
          LEAN
          cp Tests/Guards/Proofs/ScalarKeyProducer.lean ../results/
          lake build Tests.Guards.Proofs.ScalarKeyProducer 2>&1 | tee ../results/key-actual-landing.log
          grep -F 'scalar_key_actual_landing_to_value_park' ../results/key-actual-landing.log
          grep -F 'scalar_root_key_value_fold_to_stream' ../results/key-actual-landing.log
          grep -F 'root_single_map_route' ../results/key-actual-landing.log
          if grep -E 'sorryAx|declaration uses .sorry' ../results/key-actual-landing.log; then exit 1; fi
          git diff --check
      - name: Native root terminal controls before new transport proof
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/RootEOFControls.lean <<'LEAN'
          module
          public import L4YAML.Scanner.Scanner
          public import L4YAML.Parser.Composition
          public import L4YAML.Proofs.Serialization.TokenEvents
          public meta import L4YAML.Scanner.Scanner
          public meta import L4YAML.Parser.Composition
          public meta import L4YAML.Proofs.Serialization.TokenEvents
          @[expose] public section Blanket
          open L4YAML L4YAML.Scanner L4YAML.Proofs.Serialization.TokenEvents
          def step (s : ScannerState) : IO ScannerState :=
            match scanNextToken s with
            | .ok (some s') => pure s'
            | _ => throw (IO.userError "expected scanner step")
          def checkEOF (input : String) : IO Unit := do
            let q ← step ((ScannerState.mk' input).emit .streamStart)
            let k ← step q
            let v ← step k
            let a ← step v
            match skipToContent a, scanNextToken a, scanLoop a (4 * (input.utf8ByteSize + 1)), scanFiltered input with
            | .ok endState, .ok none, .ok ts, .ok filtered =>
              let actual := ts.filter fun t => t.val != .placeholder
              IO.println (input, a.offset, endState.offset, input.utf8ByteSize,
                a.tokens.size, ts.size, filtered.size, (tokenEvents filtered).length)
              unless !endState.hasMore && actual == filtered &&
                  goOut a.tokens.toList [] == ([], []) &&
                  tokenEvents a.tokens == tokenEvents filtered &&
                  (TokenParser.parseYaml input).isOk do
                throw (IO.userError "root EOF transport control refuted")
            | _, _, _, _ => throw (IO.userError "expected actual terminal states")
          #eval do
            for s in ["? a\n: b", "? a\n: b\n", "? a\n: b # tail",
              "? a\n: b # tail\n", "? \"a\" # key\n: 'b' # tail\n# last\n",
              "? 'a'\n# middle\n: \"b\"  \n"] do
              checkEOF s
            unless !(TokenParser.parseYaml "? a\n: [b").isOk do
              throw (IO.userError "open-flow negative control refuted")
            IO.println "SIX_NATIVE_ROOT_EOF_AND_ONE_NEGATIVE_CONTROL_PASS"
          end Blanket
          LEAN
          lake build Tests.Guards.Proofs.RootEOFControls 2>&1 | tee ../results/root-eof-controls.log
          grep -F SIX_NATIVE_ROOT_EOF_AND_ONE_NEGATIVE_CONTROL_PASS ../results/root-eof-controls.log
          cp Tests/Guards/Proofs/RootEOFControls.lean ../results/
      - name: Derive initial root events and terminal transport from actual scanner steps
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/RootEventEOF.lean <<'LEAN'
          module
          public import Tests.Guards.Proofs.ScalarKeyProducer
          public import L4YAML.Proofs.Scanner.ExplicitKeyCoupling
          public section
          namespace L4YAML.Tests.Guards.RootEventEOF
          open L4YAML L4YAML.Scanner L4YAML.Surface
          open L4YAML.Proofs.Serialization.SerializationWellFormed
          open L4YAML.Proofs.Serialization.TokenEvents
          open L4YAML.Proofs.Serialization.TraceOf
          open L4YAML.Proofs.Serialization.TraceOf.DocBridge
          open L4YAML.Proofs.Serialization.TraceOf.StreamBridge
          open L4YAML.Proofs.Serialization.TraceOf.ContentBridge
          open L4YAML.Proofs.ScannerCorrectness L4YAML.Proofs.ExplicitKeyCoupling
          open L4YAML.Proofs.CloseStaleExplicitKey L4YAML.Proofs.CouplingBridge
          open L4YAML.Proofs.PreprocessProduction L4YAML.Proofs.ScannerCoupling
          open L4YAML.Proofs.StreamAccum (ContentArm NextIsSep SlotGateAt)
          open L4YAML.Tests.Guards.ScalarKeyProducer
          
          /-- Event preservation is about the trace, not token-array equality. -/
          lemma goOut_push_silent (ts : Array (Positioned YamlToken)) (t : Positioned YamlToken)
              (p : List String) (hev : tokenEvent t.val = none)
              (hds : t.val ≠ .documentStart)
              (htd : ∀ h px, t.val ≠ .tagDirective h px) :
              goOut (ts.push t).toList p = goOut ts.toList p := by
            rw [Array.toList_push, goOut_append, goOut_silent t hev hds htd]
            simp
          
          lemma emit_silent (s : ScannerState) (tok : YamlToken) (p : List String)
              (hev : tokenEvent tok = none) (hds : tok ≠ .documentStart)
              (htd : ∀ h px, tok ≠ .tagDirective h px) :
              goOut (s.emit tok).tokens.toList p = goOut s.tokens.toList p := by
            unfold ScannerState.emit
            exact goOut_push_silent _ _ p hev hds htd
          
          lemma unwind_silent (s : ScannerState) (col : Int) (p : List String) :
              goOut (unwindIndents s col).tokens.toList p = goOut s.tokens.toList p := by
            obtain ⟨ends, htok, hend⟩ := unwindIndents_tokens_append s col
            rw [htok, goOut_append]
            have he := goOut_blockEnds ends hend [] (goOut s.tokens.toList p).2
            rw [List.append_nil] at he
            rw [he]
            simp
          
          lemma save_silent (s : ScannerState) (p : List String) :
              goOut (saveSimpleKey s).tokens.toList p = goOut s.tokens.toList p := by
            unfold saveSimpleKey
            split
            · rfl
            · split
              · dsimp only []
                rw [goOut_push_silent _ _ p (by rfl) (by simp) (by intro h px; simp)]
                exact goOut_push_silent _ _ p (by rfl) (by simp) (by intro h px; simp)
              · rfl
          
          lemma mapping_indent_silent (s : ScannerState) (col : Int) (p : List String) :
              goOut (pushMappingIndent s col).tokens.toList p = goOut s.tokens.toList p := by
            unfold pushMappingIndent
            split
            · exact emit_silent s .blockMappingStart p (by rfl) (by decide) (by intro h px; simp)
            · rfl
          
          lemma key_silent {s s' : ScannerState} (h : scanKey s = .ok s') (p : List String) :
              goOut s'.tokens.toList p = goOut s.tokens.toList p := by
            unfold scanKey at h
            simp only [bind, Except.bind] at h
            repeat (any_goals (split at h))
            all_goals (try contradiction)
            all_goals (simp only [Except.ok.injEq] at h; subst h)
            all_goals
              first
              | (change goOut ((pushMappingIndent s (s.col : Int)).emit .key).advance.tokens.toList p = _
                 rw [advance_preserves_tokens, emit_silent _ .key p (by rfl) (by decide) (by intro h px; simp)]
                 exact mapping_indent_silent s _ p)
              | (change goOut (s.emit .key).advance.tokens.toList p = _
                 rw [advance_preserves_tokens]
                 exact emit_silent s .key p (by rfl) (by decide) (by intro h px; simp))
              | (change goOut (((if !s.inFlow then pushMappingIndent s (s.col : Int) else s).emit .key).advance.tokens.toList) p = _
                 rw [advance_preserves_tokens, emit_silent _ .key p (by rfl) (by decide) (by intro h px; simp)]
                 split
                 · exact mapping_indent_silent s _ p
                 · rfl)
          
          lemma preprocess_silent (s s1 : ScannerState) (c : Char)
              (h : scanNextToken_preprocess s = .ok (some (s1, c))) (p : List String) :
              goOut s1.tokens.toList p = goOut s.tokens.toList p := by
            unfold scanNextToken_preprocess at h
            simp only [bind, pure, Pure.pure, Except.pure, Except.bind] at h
            split at h
            · contradiction
            · rename_i v heq_skip
              have h_skip := skipToContent_preserves_tokens s v heq_skip
              split at h
              · simp at h
              · split at h
                · split at h
                  · contradiction
                  · split at h
                    · simp at h
                    · simp only [Except.ok.injEq, Option.some.injEq, Prod.mk.injEq] at h
                      obtain ⟨h1, _⟩ := h
                      rw [← h1, closeStaleExplicitKey_tokens, save_silent]
                      change goOut (unwindIndents v v.col).tokens.toList p = _
                      rw [unwind_silent, h_skip]
                · split at h
                  · contradiction
                  · split at h
                    · simp at h
                    · simp only [Except.ok.injEq, Option.some.injEq, Prod.mk.injEq] at h
                      obtain ⟨h1, _⟩ := h
                      rw [← h1, closeStaleExplicitKey_tokens, save_silent, h_skip]
          
          /-- The cleared explicit value cannot overwrite a reservation. A real
              implicit-key overwrite belongs to the separate stamped route. -/
          lemma value_prepare_cleared_silent (s : ScannerState)
              (hc : s.simpleKey.possible = false) (p : List String) :
              goOut (scanValuePrepare s).tokens.toList p = goOut s.tokens.toList p := by
            unfold scanValuePrepare
            simp only [hc, Bool.false_eq_true, if_false]
            split
            · rfl
            · split
              · exact mapping_indent_silent s _ p
              · rfl
          
          lemma value_cleared_silent {s s' : ScannerState}
              (h : scanValue s = .ok s')
              (hc : (scanValueClearKey s).simpleKey.possible = false) (p : List String) :
              goOut s'.tokens.toList p = goOut s.tokens.toList p := by
            unfold scanValue at h
            simp only [bind, Except.bind] at h
            split at h
            · cases h
            · split at h
              · cases h
              · split at h
                · cases h
                · have he := Except.ok.inj h
                  subst he
                  change goOut ((scanValuePrepare (scanValueClearKey s)).emit .value).advance.tokens.toList p = _
                  rw [advance_preserves_tokens,
                    emit_silent _ .value p (by rfl) (by decide) (by intro h px; simp),
                    value_prepare_cleared_silent _ hc,
                    scanValueClearKey_preserves_tokens]
          
          lemma scalar_dispatch_silent {s_ad s' : ScannerState} {c : Char} {sp_prep sp_a : SurfPos}
              (arm : ContentArm s_ad s' c sp_prep sp_a)
              (hcorr : ScannerSurfCorr s_ad sp_prep) (hpeek : s_ad.peek? = some c)
              (hdepth : s_ad.flowLevel = 0) (hdisp : scanNextToken_dispatchContent s_ad c = .ok s')
              (ha : c ≠ '&') (ht : c ≠ '!') (hl : c ≠ '*') (p : List String) :
              goOut s'.tokens.toList p = goOut s_ad.tokens.toList p := by
            obtain ⟨ev, hpush, hd⟩ := accum_step_content_trace_out arm hcorr hpeek hdepth hdisp
            have he : ev = [] := by
              rcases hd with ⟨h, -⟩ | ⟨h, -⟩ | ⟨h, -⟩ | ⟨h, -⟩ | ⟨h, -⟩ | ⟨h, -⟩
              · exact h
              · exact h
              · exact h
              · exact False.elim (ha h)
              · exact False.elim (ht h)
              · exact False.elim (hl h)
            subst ev
            simpa using hpush.goOut_at p
          
          /-- Same initialization, including the BOM arm, as native scan. -/
          @[expose] def initial (input : String) : ScannerState :=
            let s := (ScannerState.mk' input).emit .streamStart
            match s.peek? with
            | some '\uFEFF' => s.consumeBOM
            | _ => s
          
          /-- Retain successful native scan evidence, using the same local conversion
              as the verified full_consumption_reachable proof. No exported rfl equation. -/
          lemma scan_success_initial_loop (input : String) (tokens : Array (Positioned YamlToken))
              (h : scan input = .ok tokens) :
              scanLoop (initial input) ((input.utf8ByteSize + 1) * 4) = .ok tokens := by
            exact h
          
          lemma initial_silent (input : String) :
              goOut (initial input).tokens.toList [] = ([], []) := by
            unfold initial
            dsimp only []
            split
            · change goOut ((ScannerState.mk' input).emit .streamStart).advance.tokens.toList [] = _
              rw [advance_preserves_tokens]
              rfl
            · rfl
          
          /-- The native key route pays the previously free root TSLYamlStream event
              premise. No assumption about token-array equality or empty events. -/
          lemma root_event_from_steps_retained
              {input : String}
              {q_prep q sc prep ad k v out vp va : ScannerState} {c vc : Char}
              {sp_prep sp_a : SurfPos}
              (hinit : scanNextToken_preprocess (initial input) = .ok (some (q_prep, '?')))
              (hqtok : q.tokens = q_prep.tokens)
              (hq : scanKey q = .ok sc)
              (hpre : scanNextToken_preprocess sc = .ok (some (prep, c)))
              (had : ad = if prep.allowDirectives then
                { prep with allowDirectives := false, documentEverStarted := true } else prep)
              (hcorr : ScannerSurfCorr ad sp_prep)
              (hpeek : ad.peek? = some c)
              (arm : ContentArm ad k c sp_prep sp_a)
              (hdepth : ad.flowLevel = 0)
              (hdisp : scanNextToken_dispatchContent ad c = .ok k)
              (ha : c ≠ '&') (ht : c ≠ '!') (hl : c ≠ '*')
              (hvpre : scanNextToken_preprocess k = .ok (some (v, ':')))
              (hv : scanValue v = .ok out)
              (hvflow : v.inFlow = false) (hvpeek : v.peek? = some ':')
              (hnotstamp : out.implicitValueLine ≠ some out.line)
              (hvprep : scanNextToken_preprocess out = .ok (some (vp, vc)))
              (hvad : va = if vp.allowDirectives then
                { vp with allowDirectives := false, documentEverStarted := true } else vp) :
              TSLYamlStream ⟨input.toList, 0⟩ va ⟨input.toList, 0⟩ [] [] [] := by
            have hc : (scanValueClearKey v).simpleKey.possible = false := by
              cases he : (scanValueClearKey v).simpleKey.possible
              · rfl
              · exact False.elim (hnotstamp (scanValue_stamp_of_cleared_key hv hvflow hvpeek he))
            have hatok : ad.tokens = prep.tokens := by rw [had]; split <;> rfl
            have hvatok : va.tokens = vp.tokens := by rw [hvad]; split <;> rfl
            refine ⟨.single _ _ _ _ [] [] (.nil _) (.none _) (.nil _), ?_⟩
            rw [hvatok, preprocess_silent _ _ _ hvprep, value_cleared_silent hv hc,
              preprocess_silent _ _ _ hvpre,
              scalar_dispatch_silent arm hcorr hpeek hdepth hdisp ha ht hl,
              hatok, preprocess_silent _ _ _ hpre, key_silent hq,
              hqtok, preprocess_silent _ _ _ hinit, initial_silent]
            rfl
          
          
          lemma root_event_from_steps
              {input : String}
              {q sc prep ad k v out vp va : ScannerState} {c vc : Char}
              {sp_prep sp_a : SurfPos}
              (hinit : scanNextToken_preprocess (initial input) = .ok (some (q, '?')))
              (hq : scanKey q = .ok sc)
              (hpre : scanNextToken_preprocess sc = .ok (some (prep, c)))
              (had : ad = if prep.allowDirectives then
                { prep with allowDirectives := false, documentEverStarted := true } else prep)
              (hcorr : ScannerSurfCorr ad sp_prep)
              (hpeek : ad.peek? = some c)
              (arm : ContentArm ad k c sp_prep sp_a)
              (hdepth : ad.flowLevel = 0)
              (hdisp : scanNextToken_dispatchContent ad c = .ok k)
              (ha : c ≠ '&') (ht : c ≠ '!') (hl : c ≠ '*')
              (hvpre : scanNextToken_preprocess k = .ok (some (v, ':')))
              (hv : scanValue v = .ok out)
              (hvflow : v.inFlow = false) (hvpeek : v.peek? = some ':')
              (hnotstamp : out.implicitValueLine ≠ some out.line)
              (hvprep : scanNextToken_preprocess out = .ok (some (vp, vc)))
              (hvad : va = if vp.allowDirectives then
                { vp with allowDirectives := false, documentEverStarted := true } else vp) :
              TSLYamlStream ⟨input.toList, 0⟩ va ⟨input.toList, 0⟩ [] [] [] := by
            exact root_event_from_steps_retained hinit rfl hq hpre had hcorr hpeek arm hdepth hdisp
              ha ht hl hvpre hv hvflow hvpeek hnotstamp hvprep hvad
          
          /-- The filtered-away token is silent at every pending-handle state. -/
          lemma goOut_filter_placeholders (l : List (Positioned YamlToken)) (p : List String) :
              goOut (l.filter fun t => t.val != .placeholder) p = goOut l p := by
            induction l generalizing p with
            | nil => rfl
            | cons t ts ih =>
              by_cases hv : t.val = .placeholder
              · have hb : (t.val != .placeholder) = false := by simp [hv]
                simp only [List.filter, hb]
                rw [goOut_silent t (by rw [hv]; rfl) (by rw [hv]; simp)
                  (by intro h px; rw [hv]; simp)]
                exact ih p
              · have hb : (t.val != .placeholder) = true := bne_iff_ne.mpr hv
                simp only [List.filter, hb]
                change goOut ([t] ++ ts.filter (fun u => u.val != .placeholder)) p =
                  goOut ([t] ++ ts) p
                rw [goOut_append, goOut_append, ih]
          
          lemma filter_events (ts : Array (Positioned YamlToken)) :
              tokenEvents (ts.filter fun t => t.val != .placeholder) = tokenEvents ts := by
            simp only [tokenEvents_eq_goOut, Array.toList_filter, goOut_filter_placeholders]
          
          /-- Native terminal action closes block contexts and emits streamEnd,
              neither of which alters goOut or tokenEvents. -/
          lemma terminal_events (s : ScannerState) (fuel : Nat) (ts : Array (Positioned YamlToken))
              (hnext : scanNextToken s = .ok none) (hloop : scanLoop s (fuel + 1) = .ok ts) :
              tokenEvents (ts.filter fun t => t.val != .placeholder) = tokenEvents s.tokens := by
            rw [filter_events]
            simp only [scanLoop, hnext] at hloop
            split at hloop
            · contradiction
            · split at hloop
              · contradiction
              · split at hloop
                · contradiction
                · split at hloop
                  · contradiction
                  · have he := Except.ok.inj hloop
                    rw [← he]
                    simp only [tokenEvents_eq_goOut]
                    rw [emit_silent _ .streamEnd [] (by rfl) (by decide) (by intro h px; simp),
                      unwind_silent]
          
          /-- EOF is generated by the real whitespace/comment scanner, not inferred
              from the presence of a final token. This adapter consumes the retained
              scalar grammar endpoint and comment gate. -/
          lemma eof_from_retained_park {input : String}
              {s s_result : ScannerState} {sp_gram sp_scan : SurfPos}
              {fuel : Nat} {ts : Array (Positioned YamlToken)}
              (hcorr : ScannerSurfCorr s sp_scan)
              (hrun : GStar SSWhite sp_gram sp_scan)
              (hgate : sp_gram = sp_scan → s.col ≠ 0 →
                ¬ (CommentOk s ∧ s.peek? = some '#'))
              (hskip : skipToContent s = .ok s_result) (heof : ¬s_result.hasMore)
              (hloop : scanLoop s (fuel + 1) = .ok ts)
              (hclose : ∀ sp_end, SSLComments sp_gram sp_end →
                TLYamlStream ⟨input.toList, 0⟩ sp_end (tokenEvents s.tokens)) :
              TraceOf input (tokenEvents (ts.filter fun t => t.val != .placeholder)) := by
            obtain ⟨sp_end, hfrom, hchars, h_ok⟩ :=
              skipToContent_eof_ssl_comments s sp_scan s_result hcorr hskip heof
            have hssl := SSLCommentsFrom_at_park hcorr hrun hgate hfrom h_ok
            have hnext : scanNextToken s = .ok none := by
              have hf : s_result.hasMore = false := by
                cases h : s_result.hasMore <;> simp_all
              unfold scanNextToken scanNextToken_preprocess
              simp [bind, Except.bind, pure, Pure.pure, Except.pure, hskip, hf]
            rw [terminal_events s fuel ts hnext hloop]
            have htrace := hclose sp_end hssl
            cases sp_end with
            | mk chars col =>
              simp only [] at hchars
              subst chars
              exact ⟨col, htrace⟩
          
          #print axioms scan_success_initial_loop
          #print axioms root_event_from_steps
          #print axioms filter_events
          #print axioms terminal_events
          #print axioms eof_from_retained_park
          end L4YAML.Tests.Guards.RootEventEOF
          LEAN
          cp Tests/Guards/Proofs/RootEventEOF.lean ../results/
          lake build Tests.Guards.Proofs.RootEventEOF 2>&1 | tee ../results/root-event-eof.log
          for name in root_event_from_steps filter_events terminal_events eof_from_retained_park; do
            grep -F "$name" ../results/root-event-eof.log
          done
          if grep -E 'sorryAx|declaration uses .sorry' ../results/root-event-eof.log; then exit 1; fi
          git diff --check
          printf 'root_event_eof\t0\n' >> ../results/outcomes.tsv
      - name: Consume root key and value through the actual filtered terminal scan
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/RootComposedTrace.lean <<'LEAN'
          module
          public import Tests.Guards.Proofs.RootEventEOF
          public import Tests.Guards.Proofs.ReachableEOF
          public section
          namespace L4YAML.Tests.Guards.RootComposedTrace
          open L4YAML L4YAML.Scanner L4YAML.Surface
          open L4YAML.Proofs.Serialization.SerializationWellFormed
          open L4YAML.Proofs.Serialization.TokenEvents
          open L4YAML.Proofs.Serialization.TraceOf
          open L4YAML.Proofs.Serialization.TraceOf.DocBridge
          open L4YAML.Proofs.Serialization.TraceOf.StreamBridge
          open L4YAML.Proofs.Serialization.TraceOf.ContentBridge
          open L4YAML.Proofs.CouplingBridge L4YAML.Proofs.StructureProduction
          open L4YAML.Proofs.PreprocessIndentStable
          open L4YAML.Proofs.PreprocessProduction L4YAML.Proofs.ScannerCoupling
          open L4YAML.Proofs.StreamAccum (ContentArm NextIsSep SlotGateAt)
          open L4YAML.Tests.Guards.ScalarKeyProducer L4YAML.Tests.Guards.RootEventEOF
          
          lemma scan_four_steps_to_terminal
              {input : String} {sc k out sv' : ScannerState} {filtered : Array (Positioned YamlToken)}
              (h1 : scanNextToken (initial input) = .ok (some sc))
              (h2 : scanNextToken sc = .ok (some k))
              (h3 : scanNextToken k = .ok (some out))
              (h4 : scanNextToken out = .ok (some sv'))
              (hf : scanFiltered input = .ok filtered) :
              ∃ fuel ts, scanLoop sv' (fuel + 1) = .ok ts ∧
                filtered = ts.filter (fun t => t.val != .placeholder) := by
            have hsize : (input.utf8ByteSize + 1) * 4 = input.utf8ByteSize * 4 + 4 := by omega
            have hprefix (n : Nat) : scanLoop (initial input) (n + 4) = scanLoop sv' n := by
              calc
                scanLoop (initial input) (n + 4) = scanLoop sc (n + 3) := by rw [scanLoop, h1]
                _ = scanLoop k (n + 2) := by rw [scanLoop, h2]
                _ = scanLoop out (n + 1) := by rw [scanLoop, h3]
                _ = scanLoop sv' n := by rw [scanLoop, h4]
            cases hs : scan input with
            | error e => simp [scanFiltered, hs] at hf
            | ok raw =>
              have hloop := scan_success_initial_loop input raw hs
              rw [hsize, hprefix] at hloop
              have he : raw.filter (fun t => t.val != .placeholder) = filtered := by
                simpa [scanFiltered, hs] using hf
              cases hn : input.utf8ByteSize * 4 with
              | zero => simp [scanLoop, hn] at hloop
              | succ fuel =>
                refine ⟨fuel, raw, ?_, he.symm⟩
                first | exact hloop | simpa [hn] using hloop
          
          
          /-- Conditional restricted actual-prefix-to-filtered-trace theorem.  The key's
              preprocessed state and dispatched state are distinct, and the value route
              consumes the very same leaf's retained comment gate. All non-root roles
              and dedents remain explicit outcomes. No arbitrary final closing function,
              assumed event invariant, or final grammar comment premise. -/
          lemma scalar_root_actual_filtered_trace
              {input : String} {q_prep s_q sc s_prep s_ad s' sc_colon sc_afterColon sv_prep sv_ad sv' : ScannerState} {filtered : Array (Positioned YamlToken)}
              {c vc : Char}
              {sp_root sp_line sp_q sp_prep sp_a sp_colon sp_vstart sp_vprep sp_va : SurfPos}
              (hinit : scanNextToken_preprocess (initial input) = .ok (some (q_prep, '?')))
              (hq_ad : s_q = if q_prep.allowDirectives then
                { q_prep with allowDirectives := false, documentEverStarted := true } else q_prep)
              (hstepQ : scanNextToken (initial input) = .ok (some sc))
              (hstepK : scanNextToken sc = .ok (some s'))
              (hstepColon : scanNextToken s' = .ok (some sc_afterColon))
              (hstepV : scanNextToken sc_afterColon = .ok (some sv'))
              (hfiltered : scanFiltered input = .ok filtered)
              (hq_corr : ScannerSurfCorr s_q sp_q) (hq_peek : s_q.peek? = some '?')
              (hq_scan : scanKey s_q = .ok sc) (hq_flow : s_q.inFlow = false)
              (hq_nic : s_q.needIndentCheck = false)
              (h_next : NextIsSep sc)
              (h_ad : s_ad = if s_prep.allowDirectives then
                { s_prep with allowDirectives := false, documentEverStarted := true } else s_prep)
              (hcorr_prep : ScannerSurfCorr s_prep sp_prep)
              (hcorr' : ScannerSurfCorr s' sp_a)
              (h_preprocess : scanNextToken_preprocess sc = .ok (some (s_prep, c)))
              (arm : ContentArm s_ad s' c sp_prep sp_a)
              (h_depth : s_ad.flowLevel = 0)
              (h_dispatch : scanNextToken_dispatchContent s_ad c = .ok s')
              (h_not_doc : s_ad.col = 0 → atDocumentBoundary s_ad = false)
              (h_amp : c ≠ '&') (h_star : c ≠ '*') (h_bang : c ≠ '!')
              (h_pipe : c ≠ '|') (h_gt : c ≠ '>')
              (h_src : SlotGateAt s_prep)
              (h_deeper : s_q.col < sp_a.col)
              (h_colon_flow : sc_colon.inFlow = false)
              (hpre_colon : scanNextToken_preprocess s' = .ok (some (sc_colon, ':')))
              (hcorr_colon : ScannerSurfCorr sc_colon sp_colon)
              (hcolon : scanValue sc_colon = .ok sc_afterColon)
              (hprefix : GStar SLDocumentPrefix ⟨input.toList, 0⟩ sp_root)
              (hcomments : SSLComments sp_root sp_line)
              (hindent : SIndent s_q.col sp_line sp_q)
              (hcorr_vstart : ScannerSurfCorr sc_afterColon sp_vstart)
              (h_vnic : sc_colon.needIndentCheck = false)
              (h_vfresh : sc_colon.simpleKey.possible = true → sc_colon.simpleKey.pos.col = sc_colon.col)
              (h_vnext : NextIsSep sc_afterColon)
              (h_vad : sv_ad = if sv_prep.allowDirectives then
                { sv_prep with allowDirectives := false, documentEverStarted := true } else sv_prep)
              (h_vpreprocess : scanNextToken_preprocess sc_afterColon = .ok (some (sv_prep, vc)))
              (hcorr_vprep : ScannerSurfCorr sv_prep sp_vprep)
              (hcorr_va : ScannerSurfCorr sv' sp_va)
              (arm_v : ContentArm sv_ad sv' vc sp_vprep sp_va)
              (h_vdepth : sv_ad.flowLevel = 0)
              (h_vdispatch : scanNextToken_dispatchContent sv_ad vc = .ok sv')
              (h_vnotdoc : sv_ad.col = 0 → atDocumentBoundary sv_ad = false)
              (h_vsrc : SlotGateAt sv_prep)
              (h_vamp : vc ≠ '&') (h_vstar : vc ≠ '*') (h_vbang : vc ≠ '!')
              (h_vpipe : vc ≠ '|') (h_vgt : vc ≠ '>')
              (hterminal : scanNextToken sv' = .ok none) :
              TraceOf input (tokenEvents filtered) ∨
              (∃ sp_afterQ, L4YAML.Proofs.FlowIndexLift.DedentLanding (s_q.col + 1) sp_afterQ sp_prep) ∨
              L4YAML.Proofs.FlowIndexLift.DedentLanding (s_q.col + 1) sp_vstart sp_vprep ∨
              sc_afterColon.implicitValueLine = some sc_afterColon.line ∨
              L4YAML.Tests.Guards.ColonRolePartition.StaleAt sc s_prep ∨
              L4YAML.Tests.Guards.ColonRolePartition.StaleAt s' sc_colon := by
            have hp := L4YAML.Proofs.StreamAccum.preprocess_some_peek hpre_colon
            rcases L4YAML.Tests.Guards.ColonRolePartition.scalar_colon_role_partition
              hq_scan h_preprocess h_ad h_dispatch hpre_colon hcolon h_colon_flow hp with hm | hs | hs1 | hs2
            · by_cases hstamp : sc_afterColon.implicitValueLine = some sc_afterColon.line
              · exact Or.inr (Or.inr (Or.inr (Or.inl hstamp)))
              have hcc : sp_colon.col = s_q.col := hcorr_colon.col_eq.trans hm
              have route : ∀ sp ev, TBlockMapEntry s_q.col sp_q sp ev →
                  TLYamlStream ⟨input.toList, 0⟩ sp ([] ++ [] ++ ev) := by
                intro sp ev he
                simpa using root_single_map_route hprefix hcomments hindent sp ev he
              obtain ⟨sp_afterQ, _, _, h⟩ :=
                scalar_key_actual_landing_to_value_route
                  hq_corr hq_peek hq_scan hq_flow hq_nic h_next h_ad hcorr_prep hcorr'
                  h_preprocess arm h_depth h_dispatch h_not_doc h_amp h_star h_bang h_pipe h_gt
                  h_src h_deeper hcc h_colon_flow hpre_colon hcorr_colon hcolon route
              rcases h with ⟨sp_afterColon, hcorr_after, _, hroute⟩ | hded
              · have h_after_eq : sp_afterColon = sp_vstart := ScannerSurfCorr_unique hcorr_after hcorr_vstart
                rw [h_after_eq] at hroute
                obtain ⟨sp_tmp, hgl, hcorr_tmp⟩ :=
                  scanValue_prod sc_colon sp_colon hcorr_colon hp sc_afterColon hcolon
                have h_tmp_eq : sp_tmp = sp_vstart := ScannerSurfCorr_unique hcorr_tmp hcorr_vstart
                rw [h_tmp_eq] at hgl
                have h_vcol : s_q.col + 1 ≤ sp_vstart.col := by
                  cases hgl
                  simp_all
                have h_vcol0 : 0 < sp_vstart.col := by omega
                have h_vfloor : IndentFloor sc_afterColon (s_q.col + 1) :=
                  IndentFloor.succ_of_int_le ((scanValue_needIndentCheck hcolon).trans h_vnic)
                    (by rw [← hm]; exact scanValue_col_le_currentIndent h_colon_flow h_vfresh hcolon)
                have hflow : sv_ad.inFlow = false := by
                  unfold ScannerState.inFlow
                  rw [h_vdepth]
                  rfl
                rcases TPendingNode.content_sep_of_preprocess h_vad h_vfloor h_vcol h_vcol0
                    h_vnext hcorr_vstart hcorr_vprep hcorr_va h_vpreprocess h_vnotdoc
                    hflow h_vdispatch h_vsrc with ⟨hsep, hfl⟩ | hd
                · have hcorr_ad : ScannerSurfCorr s_ad sp_prep := by
                    rw [h_ad]
                    exact L4YAML.Proofs.StreamAccum.corr_of_allowDirectives_update hcorr_prep
                  have hpeek_ad : s_ad.peek? = some c := by
                    rw [h_ad]
                    have := L4YAML.Proofs.StreamAccum.preprocess_some_peek h_preprocess
                    split <;> exact this
                  have hqtok : s_q.tokens = q_prep.tokens := by
                    rw [hq_ad]
                    split <;> rfl
                  have hS := root_event_from_steps_retained hinit hqtok hq_scan h_preprocess
                    h_ad hcorr_ad hpeek_ad arm h_depth h_dispatch h_amp h_bang h_star
                    hpre_colon hcolon h_colon_flow hp hstamp h_vpreprocess h_vad
                  have hcorr_vad : ScannerSurfCorr sv_ad sp_vprep := by
                    rw [h_vad]
                    exact L4YAML.Proofs.StreamAccum.corr_of_allowDirectives_update hcorr_vprep
                  have hpeek_vad : sv_ad.peek? = some vc := by
                    rw [h_vad]
                    have := L4YAML.Proofs.StreamAccum.preprocess_some_peek h_vpreprocess
                    split <;> exact this
                  obtain ⟨sp_gram, sp_scan, hT, hws, hgate, hc⟩ :=
                    content_leaf_at_with_gate (s_q.col + 1) hcorr_vad hpeek_vad hflow h_vnotdoc
                      h_vamp h_vstar h_vbang h_vpipe h_vgt h_vdispatch hfl
                  have hevents : tokenEvents sv'.tokens = [] := by
                    rw [tokenEvents_eq_goOut,
                      scalar_dispatch_silent arm_v hcorr_vad hpeek_vad h_vdepth h_vdispatch
                        h_vamp h_vbang h_vstar [], hS.events]
                    simp
                  have hclose : ∀ sp_end, SSLComments sp_gram sp_end →
                      TLYamlStream ⟨input.toList, 0⟩ sp_end (tokenEvents sv'.tokens) := by
                    intro sp_end hssl
                    rw [hevents]
                    simpa using hroute sp_end []
                      (.flowInBlock (s_q.col + 1) .blockOut sp_vstart sp_vprep sp_gram sp_end []
                        hsep (.content _ _ _ _ _ hT) hssl)
                  obtain ⟨fuel, raw, hloop, heq⟩ :=
                    scan_four_steps_to_terminal hstepQ hstepK hstepColon hstepV hfiltered
                  left
                  rw [heq]
                  obtain ⟨s_result, p_eof, hskip, _, heof, _⟩ :=
                    L4YAML.Proofs.ReachableEOF.next_none_reachable_eof sv' sp_scan hc hterminal
                  exact eof_from_retained_park hc hws hgate hskip heof hloop hclose
                · exact Or.inr (Or.inr (Or.inl hd))
              · exact Or.inr (Or.inl ⟨sp_afterQ, hded⟩)
            · exact Or.inr (Or.inr (Or.inr (Or.inl hs)))
            · exact Or.inr (Or.inr (Or.inr (Or.inr (Or.inl hs1))))
            · exact Or.inr (Or.inr (Or.inr (Or.inr (Or.inr hs2))))
          
          
          #print axioms scan_four_steps_to_terminal
          #print axioms root_event_from_steps_retained
          #print axioms scalar_key_actual_landing_to_value_route
          #print axioms scalar_root_actual_filtered_trace
          end L4YAML.Tests.Guards.RootComposedTrace
          end
          LEAN
          cp Tests/Guards/Proofs/RootComposedTrace.lean ../results/
          lake build Tests.Guards.Proofs.RootComposedTrace 2>&1 | tee ../results/root-composed-trace.log
          for n in scan_four_steps_to_terminal root_event_from_steps_retained scalar_key_actual_landing_to_value_route scalar_root_actual_filtered_trace; do
            grep -F "$n" ../results/root-composed-trace.log
          done
          if grep -E 'sorryAx|declaration uses .sorry' ../results/root-composed-trace.log; then exit 1; fi
          git diff --check
          printf 'root_actual_filtered_trace\t0\n' >> ../results/outcomes.tsv
          echo 'Conditional four-step scalar root slice only; geometry, actual scanner arms, separation gates, native terminal-none and alternate roles remain explicit; skip/EOF produced by qualified ReachableEOF.' > ../results/root-composition-boundary.txt
      - name: Select native matched root route before proof
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/RootMatchingControls.lean <<'LEAN'
          module
          public import L4YAML.Scanner.Scanner
          public import L4YAML.Parser.Composition
          public meta import L4YAML.Scanner.Scanner
          public meta import L4YAML.Parser.Composition
          @[expose] public section Blanket
          open L4YAML L4YAML.Scanner
          def updateDoc (s : ScannerState) : ScannerState :=
            if s.allowDirectives then {s with allowDirectives := false, documentEverStarted := true} else s
          def rootInit (input : String) : ScannerState :=
            let s := (ScannerState.mk' input).emit .streamStart
            match s.peek? with
            | some '\uFEFF' => s.consumeBOM
            | _ => s
          def checkMatched (input : String) : IO Unit := do
            let init := rootInit input
            let .ok (some (q0, '?')) := scanNextToken_preprocess init
              | throw (IO.userError "expected root key landing")
            let q := updateDoc q0
            let .ok sc := scanKey q | throw (IO.userError "key dispatch failed")
            let .ok (some (kp, kc)) := scanNextToken_preprocess sc
              | throw (IO.userError "expected scalar key landing")
            let .ok k := scanNextToken_dispatchContent (updateDoc kp) kc
              | throw (IO.userError "scalar key dispatch failed")
            let .ok (some (v, ':')) := scanNextToken_preprocess k
              | throw (IO.userError "expected explicit colon landing")
            let .ok out := scanValue v | throw (IO.userError "colon dispatch failed")
            let .ok (some (vp, vc)) := scanNextToken_preprocess out
              | throw (IO.userError "expected scalar value landing")
            let .ok value := scanNextToken_dispatchContent (updateDoc vp) vc
              | throw (IO.userError "scalar value dispatch failed")
            let .ok none := scanNextToken value | throw (IO.userError "expected EOF after value")
            unless v.col == q.col && out.implicitValueLine != some out.line &&
                kp.col >= q.col + 1 && vp.col >= q.col + 1 &&
                !q.inFlow && !v.inFlow && !q.needIndentCheck && !v.needIndentCheck &&
                (!v.simpleKey.possible || v.simpleKey.pos.col == v.col) &&
                (TokenParser.parseYaml input).isOk do
              throw (IO.userError "matched route guard prediction refuted")
            IO.println (input, q.col, kp.col, v.col, vp.col, out.implicitValueLine, v.simpleKey.possible)
          #eval do
            for input in ["? a\n: b", "? a # key\n: b # tail", "? \"a\"\n: 'b'",
                "# lead\n? a\n: b", "\uFEFF? a\n: b", "  ? a\n  : b",
                "? a\n: b\n# final\n", "? 'é'\n: \"漢\""] do
              checkMatched input
            IO.println "EIGHT_MATCHED_NATIVE_GUARD_CONTROLS_PASS"
          end Blanket
          LEAN
          cp Tests/Guards/Proofs/RootMatchingControls.lean ../results/
          lake build Tests.Guards.Proofs.RootMatchingControls 2>&1 | tee ../results/root-matching-controls.log
          grep -F EIGHT_MATCHED_NATIVE_GUARD_CONTROLS_PASS ../results/root-matching-controls.log
      - name: Reuse qualified source-derived root geometry
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/RootPrefixGeometry.lean <<'LEAN'
          module
          public import L4YAML.Proofs.Production.StreamAccum
          public import L4YAML.Proofs.Foundation.SurfaceSpanSupply
          public import L4YAML.Proofs.Scanner.ScanStrictCoupling
          public section
          set_option autoImplicit false
          namespace L4YAML.Proofs.RootPrefixGeometry
          open L4YAML L4YAML.Surface L4YAML.Scanner
          open L4YAML.Proofs.CouplingBridge L4YAML.Proofs.ScannerCoupling
          open L4YAML.Proofs.StructureCoupling L4YAML.Proofs.ScalarCoupling
          open L4YAML.Proofs.ScanStrictCoupling L4YAML.Proofs.CloseStaleExplicitKey
          open L4YAML.Proofs.PreprocessProduction L4YAML.Proofs.PreprocessIndentStable
          open L4YAML.Proofs.TabIndentBridge L4YAML.Proofs.SurfaceSpan
          
          /-- Unwind bookkeeping changes the stack and tokens, not the source position.
              Retain the *same* surface rather than weakening to an existential. -/
          lemma unwindLoop_same_surface (sc : ScannerState) (sp : SurfPos)
              (hcorr : ScannerSurfCorr sc sp) (col : Int) (fuel : Nat) :
              ScannerSurfCorr (unwindIndentsLoop sc col fuel) sp := by
            induction fuel generalizing sc with
            | zero => simpa only [unwindIndentsLoop] using hcorr
            | succ fuel' ih =>
              unfold unwindIndentsLoop; split
              · have hcorr_emit := corr_of_emit .blockEnd hcorr
                exact ih { (sc.emit .blockEnd) with indents := _, pendingKeys := _ }
                  ⟨hcorr_emit.chars_from, hcorr_emit.col_eq, hcorr_emit.end_eq, hcorr_emit.input_prefix,
                   fun i hi h0 => by
                     simp only [ScannerState.emit] at hi ⊢
                     rw [Array.getElem_pop]
                     exact hcorr.indent_cols_nonneg i (by simp [Array.size_pop] at hi; omega) h0⟩
              · exact hcorr
          
          lemma unwind_same_surface (sc : ScannerState) (sp : SurfPos)
              (hcorr : ScannerSurfCorr sc sp) (col : Int) :
              ScannerSurfCorr (unwindIndents sc col) sp := by
            unfold unwindIndents
            exact unwindLoop_same_surface sc sp hcorr col _
          
          /-- Actual nonterminal preprocessing retains the skip-to-content cursor's
              surface correspondence and establishes that the skip did not reach EOF. -/
          lemma preprocess_retains_skip (sc s' : ScannerState) (c : Char)
              (hok : scanNextToken_preprocess sc = .ok (some (s', c))) :
              ∃ s_content : ScannerState, skipToContent sc = .ok s_content ∧
                s_content.offset < s_content.inputEnd ∧
                (∀ sp, ScannerSurfCorr s_content sp → ScannerSurfCorr s' sp) := by
            unfold scanNextToken_preprocess at hok
            simp only [bind, Except.bind, pure, Except.pure] at hok
            split at hok
            · simp at hok
            · rename_i s_content h_skip
              split at hok
              · simp at hok
              · rename_i h_more
                have hm : s_content.offset < s_content.inputEnd := by
                  simp [ScannerState.hasMore] at h_more
                  omega
                refine ⟨s_content, by first | exact h_skip | rfl, hm, ?_⟩
                intro sp1 hcorr1
                split at hok
                · split at hok
                  · simp at hok
                  · split at hok
                    · simp at hok
                    · have h := Except.ok.inj hok; injection h with h
                      obtain ⟨h1, h2⟩ := Prod.mk.inj h; subst h1; subst h2
                      have hcorr2 := unwind_same_surface s_content sp1 hcorr1 (↑s_content.col)
                      have hcorr3 : ScannerSurfCorr
                          { (unwindIndents s_content ↑s_content.col) with
                            needIndentCheck := false } sp1 :=
                        ⟨hcorr2.chars_from, hcorr2.col_eq, hcorr2.end_eq, hcorr2.input_prefix, hcorr2.indent_cols_nonneg⟩
                      exact closeStaleExplicitKey_corr _ sp1 (saveSimpleKey_corr _ sp1 hcorr3)
                · split at hok
                  · simp at hok
                  · split at hok
                    · simp at hok
                    · have h := Except.ok.inj hok; injection h with h
                      obtain ⟨h1, h2⟩ := Prod.mk.inj h; subst h1; subst h2
                      exact closeStaleExplicitKey_corr _ sp1 (saveSimpleKey_corr _ sp1 hcorr1)
          
          /-- Produce the grammar prefix and exact indentation at a successful explicit
              key landing. The tab alternative is excluded by the actual scanKey result,
              not by a supplied grammar assumption. The start is a correlated column-0
              surface (e.g. the initial no-BOM cursor). -/
          theorem explicit_key_prefix_geometry
              {sc prep q out : ScannerState} {sp : SurfPos}
              (hcorr : ScannerSurfCorr sc sp) (hzero : sp.col = 0)
              (hpre : scanNextToken_preprocess sc = .ok (some (prep, '?')))
              (had : q = if prep.allowDirectives then
                  { prep with allowDirectives := false, documentEverStarted := true } else prep)
              (hflow : q.inFlow = false) (hkey : scanKey q = .ok out) :
              ∃ sp_root sp_q, GStar SLDocumentPrefix sp sp_root ∧
                SSLComments sp_root sp_root ∧ SIndent q.col sp_root sp_q ∧
                ScannerSurfCorr q sp_q := by
            obtain ⟨s_content, hskip, hm, htransport⟩ := preprocess_retains_skip sc prep '?' hpre
            obtain ⟨sp_root, sp_ws, sp_q, hp, hz, hws, _, hc, hpk⟩ :=
              skipToContent_documentPrefix_prod sc sp s_content hcorr hzero hskip
            have heq : sp_q = sp_ws := by
              rcases hpk with h | h
              · exact h
              · obtain ⟨c, rest, hchars, hpeek⟩ := peek_corr s_content sp_q hc hm
                rw [hpeek] at h
                cases h
            rw [← heq] at hws
            have hprep : ScannerSurfCorr prep sp_q := htransport _ hc
            have hq : ScannerSurfCorr q sp_q := by
              rw [had]
              exact L4YAML.Proofs.StreamAccum.corr_of_allowDirectives_update hprep
            have hin : prep.input = sc.input := preprocess_input hpre
            have hqin : q.input = sc.input := by
              rw [had]
              split <;> exact hin
            rcases L4YAML.Proofs.StreamAccum.gstar_white_sIndent_or_tab hws with ⟨k, hk⟩ | htab
            · have hcol := L4YAML.Proofs.StreamAccum.SIndent_col hk
              have hqc := hq.col_eq
              have hkq : k = q.col := by omega
              rw [hkq] at hk
              refine ⟨sp_root, sp_q, .cons _ _ _ hp (.nil _), ?_, hk, hq⟩
              cases sp_root with
              | mk cs col =>
                simp only [] at hz
                subst col
                exact start_of_line_gives_SSLComments cs
            · have hsuf : sp_root.chars <:+ q.input.toList := by
                rw [hqin]
                exact (slDocumentPrefix_suffix hp).trans (corr_chars_suffix hcorr)
              have ht := tabIndent_scans_of_located hq hsuf hz hws htab
              exact False.elim (scanKey_tab_ne hflow ht.1 hkey)
          
          /-- No-BOM initialization specialization: consumes the actual first preprocessing
              equation and key dispatch, without free source geometry witnesses. -/
          theorem initial_no_bom_key_geometry
              {input : String} {prep q out : ScannerState}
              (hpre : scanNextToken_preprocess ((ScannerState.mk' input).emit .streamStart) =
                .ok (some (prep, '?')))
              (had : q = if prep.allowDirectives then
                  { prep with allowDirectives := false, documentEverStarted := true } else prep)
              (hflow : q.inFlow = false) (hkey : scanKey q = .ok out) :
              ∃ sp_root sp_q, GStar SLDocumentPrefix ⟨input.toList, 0⟩ sp_root ∧
                SSLComments sp_root sp_root ∧ SIndent q.col sp_root sp_q ∧
                ScannerSurfCorr q sp_q := by
            have hinit := initial_corr input input.toList
              (L4YAML.Proofs.ScanStrictCoupling.chars_from_zero_toList input)
            have hc : ScannerSurfCorr ((ScannerState.mk' input).emit .streamStart) ⟨input.toList, 0⟩ :=
              ⟨hinit.chars_from, hinit.col_eq, hinit.end_eq, hinit.input_prefix, hinit.indent_cols_nonneg⟩
            exact explicit_key_prefix_geometry hc rfl hpre had hflow hkey
          
          #print axioms unwind_same_surface
          #print axioms preprocess_retains_skip
          #print axioms explicit_key_prefix_geometry
          #print axioms initial_no_bom_key_geometry
          end L4YAML.Proofs.RootPrefixGeometry
          LEAN
          cp Tests/Guards/Proofs/RootPrefixGeometry.lean ../results/
          lake build Tests.Guards.Proofs.RootPrefixGeometry 2>&1 | tee ../results/root-prefix-geometry.log
          if grep -E 'sorryAx|declaration uses .sorry' ../results/root-prefix-geometry.log; then exit 1; fi
      - name: Derive trace without disjunctive escape on matched explicit key route
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/RootMatchingTrace.lean <<'LEAN'
          module
          public import Tests.Guards.Proofs.RootComposedTrace
          public import Tests.Guards.Proofs.RootPrefixGeometry
          public section
          namespace L4YAML.Tests.Guards.RootMatchingTrace
          open L4YAML L4YAML.Scanner L4YAML.Surface
          open L4YAML.Proofs.Serialization.SerializationWellFormed
          open L4YAML.Proofs.Serialization.TokenEvents
          open L4YAML.Proofs.Serialization.TraceOf
          open L4YAML.Proofs.Serialization.TraceOf.DocBridge
          open L4YAML.Proofs.Serialization.TraceOf.StreamBridge
          open L4YAML.Proofs.Serialization.TraceOf.ContentBridge
          open L4YAML.Proofs.CouplingBridge L4YAML.Proofs.StructureProduction
          open L4YAML.Proofs.PreprocessIndentStable
          open L4YAML.Proofs.PreprocessProduction L4YAML.Proofs.ScannerCoupling
          open L4YAML.Proofs.StreamAccum (ContentArm NextIsSep SlotGateAt)
          open L4YAML.Tests.Guards.ScalarKeyProducer L4YAML.Tests.Guards.RootEventEOF
          open L4YAML.Tests.Guards.RootComposedTrace
          
          /-- A dedent has a strictly smaller landing column. This consequence follows
              from the independent grammar, not from negating an overapproximation. -/
          lemma dedent_landing_col_lt {n : Nat} {a b : SurfPos}
              (h : L4YAML.Proofs.FlowIndexLift.DedentLanding n a b) : b.col < n := by
            obtain ⟨mid, j, _, hz, hj, hi⟩ := h
            have hc := L4YAML.Proofs.StreamAccum.SIndent_col hi
            omega
          
          /-- Same actual scanner and independent grammar as the qualified theorem.
              Select the matched explicit-key role by the actual column and stamp.
              Exclude the two dedent routes via the actual preprocessing columns.
              This does not require negating the overapproximating StaleAt relation.
              All remaining geometry, dispatch and separation premises stay explicit. -/
          lemma scalar_root_matching_filtered_trace
              {input : String} {q_prep s_q sc s_prep s_ad s' sc_colon sc_afterColon sv_prep sv_ad sv' : ScannerState} {filtered : Array (Positioned YamlToken)}
              {c vc : Char}
              {sp_root sp_line sp_q sp_prep sp_a sp_colon sp_vstart sp_vprep sp_va : SurfPos}
              (hinit : scanNextToken_preprocess (initial input) = .ok (some (q_prep, '?')))
              (hq_ad : s_q = if q_prep.allowDirectives then
                { q_prep with allowDirectives := false, documentEverStarted := true } else q_prep)
              (hstepQ : scanNextToken (initial input) = .ok (some sc))
              (hstepK : scanNextToken sc = .ok (some s'))
              (hstepColon : scanNextToken s' = .ok (some sc_afterColon))
              (hstepV : scanNextToken sc_afterColon = .ok (some sv'))
              (hfiltered : scanFiltered input = .ok filtered)
              (hq_corr : ScannerSurfCorr s_q sp_q) (hq_peek : s_q.peek? = some '?')
              (hq_scan : scanKey s_q = .ok sc) (hq_flow : s_q.inFlow = false)
              (hq_nic : s_q.needIndentCheck = false)
              (h_next : NextIsSep sc)
              (h_ad : s_ad = if s_prep.allowDirectives then
                { s_prep with allowDirectives := false, documentEverStarted := true } else s_prep)
              (hcorr_prep : ScannerSurfCorr s_prep sp_prep)
              (hcorr' : ScannerSurfCorr s' sp_a)
              (h_preprocess : scanNextToken_preprocess sc = .ok (some (s_prep, c)))
              (arm : ContentArm s_ad s' c sp_prep sp_a)
              (h_depth : s_ad.flowLevel = 0)
              (h_dispatch : scanNextToken_dispatchContent s_ad c = .ok s')
              (h_not_doc : s_ad.col = 0 → atDocumentBoundary s_ad = false)
              (h_amp : c ≠ '&') (h_star : c ≠ '*') (h_bang : c ≠ '!')
              (h_pipe : c ≠ '|') (h_gt : c ≠ '>')
              (h_src : SlotGateAt s_prep)
              (h_deeper : s_q.col < sp_a.col)
              (h_colon_flow : sc_colon.inFlow = false)
              (hpre_colon : scanNextToken_preprocess s' = .ok (some (sc_colon, ':')))
              (hcorr_colon : ScannerSurfCorr sc_colon sp_colon)
              (hcolon : scanValue sc_colon = .ok sc_afterColon)
              (hprefix : GStar SLDocumentPrefix ⟨input.toList, 0⟩ sp_root)
              (hcomments : SSLComments sp_root sp_line)
              (hindent : SIndent s_q.col sp_line sp_q)
              (hcorr_vstart : ScannerSurfCorr sc_afterColon sp_vstart)
              (h_vnic : sc_colon.needIndentCheck = false)
              (h_vfresh : sc_colon.simpleKey.possible = true → sc_colon.simpleKey.pos.col = sc_colon.col)
              (h_vnext : NextIsSep sc_afterColon)
              (h_vad : sv_ad = if sv_prep.allowDirectives then
                { sv_prep with allowDirectives := false, documentEverStarted := true } else sv_prep)
              (h_vpreprocess : scanNextToken_preprocess sc_afterColon = .ok (some (sv_prep, vc)))
              (hcorr_vprep : ScannerSurfCorr sv_prep sp_vprep)
              (hcorr_va : ScannerSurfCorr sv' sp_va)
              (arm_v : ContentArm sv_ad sv' vc sp_vprep sp_va)
              (h_vdepth : sv_ad.flowLevel = 0)
              (h_vdispatch : scanNextToken_dispatchContent sv_ad vc = .ok sv')
              (h_vnotdoc : sv_ad.col = 0 → atDocumentBoundary sv_ad = false)
              (h_vsrc : SlotGateAt sv_prep)
              (h_vamp : vc ≠ '&') (h_vstar : vc ≠ '*') (h_vbang : vc ≠ '!')
              (h_vpipe : vc ≠ '|') (h_vgt : vc ≠ '>')
              (hterminal : scanNextToken sv' = .ok none)
              (hmatch : sc_colon.col = s_q.col)
              (hnostamp : sc_afterColon.implicitValueLine ≠ some sc_afterColon.line)
              (hkeyfloor : s_q.col + 1 ≤ s_prep.col)
              (hvaluefloor : s_q.col + 1 ≤ sv_prep.col) :
              TraceOf input (tokenEvents filtered) := by
            have hp := L4YAML.Proofs.StreamAccum.preprocess_some_peek hpre_colon
            have hcc : sp_colon.col = s_q.col := hcorr_colon.col_eq.trans hmatch
            have route : ∀ sp ev, TBlockMapEntry s_q.col sp_q sp ev →
                TLYamlStream ⟨input.toList, 0⟩ sp ([] ++ [] ++ ev) := by
              intro sp ev he
              simpa using root_single_map_route hprefix hcomments hindent sp ev he
            obtain ⟨sp_afterQ, _, _, h⟩ :=
              scalar_key_actual_landing_to_value_route
                hq_corr hq_peek hq_scan hq_flow hq_nic h_next h_ad hcorr_prep hcorr'
                h_preprocess arm h_depth h_dispatch h_not_doc h_amp h_star h_bang h_pipe h_gt
                h_src h_deeper hcc h_colon_flow hpre_colon hcorr_colon hcolon route
            rcases h with ⟨sp_afterColon, hcorr_after, _, hroute⟩ | hded
            · have h_after_eq : sp_afterColon = sp_vstart := ScannerSurfCorr_unique hcorr_after hcorr_vstart
              rw [h_after_eq] at hroute
              obtain ⟨sp_tmp, hgl, hcorr_tmp⟩ :=
                scanValue_prod sc_colon sp_colon hcorr_colon hp sc_afterColon hcolon
              have h_tmp_eq : sp_tmp = sp_vstart := ScannerSurfCorr_unique hcorr_tmp hcorr_vstart
              rw [h_tmp_eq] at hgl
              have h_vcol : s_q.col + 1 ≤ sp_vstart.col := by
                cases hgl
                simp_all
              have h_vcol0 : 0 < sp_vstart.col := by omega
              have h_vfloor : IndentFloor sc_afterColon (s_q.col + 1) :=
                IndentFloor.succ_of_int_le ((scanValue_needIndentCheck hcolon).trans h_vnic)
                  (by rw [← hmatch]; exact scanValue_col_le_currentIndent h_colon_flow h_vfresh hcolon)
              have hflow : sv_ad.inFlow = false := by
                unfold ScannerState.inFlow
                rw [h_vdepth]
                rfl
              rcases TPendingNode.content_sep_of_preprocess h_vad h_vfloor h_vcol h_vcol0
                  h_vnext hcorr_vstart hcorr_vprep hcorr_va h_vpreprocess h_vnotdoc
                  hflow h_vdispatch h_vsrc with ⟨hsep, hfl⟩ | hd
              · have hcorr_ad : ScannerSurfCorr s_ad sp_prep := by
                  rw [h_ad]
                  exact L4YAML.Proofs.StreamAccum.corr_of_allowDirectives_update hcorr_prep
                have hpeek_ad : s_ad.peek? = some c := by
                  rw [h_ad]
                  have := L4YAML.Proofs.StreamAccum.preprocess_some_peek h_preprocess
                  split <;> exact this
                have hqtok : s_q.tokens = q_prep.tokens := by
                  rw [hq_ad]
                  split <;> rfl
                have hS := root_event_from_steps_retained hinit hqtok hq_scan h_preprocess
                  h_ad hcorr_ad hpeek_ad arm h_depth h_dispatch h_amp h_bang h_star
                  hpre_colon hcolon h_colon_flow hp hnostamp h_vpreprocess h_vad
                have hcorr_vad : ScannerSurfCorr sv_ad sp_vprep := by
                  rw [h_vad]
                  exact L4YAML.Proofs.StreamAccum.corr_of_allowDirectives_update hcorr_vprep
                have hpeek_vad : sv_ad.peek? = some vc := by
                  rw [h_vad]
                  have := L4YAML.Proofs.StreamAccum.preprocess_some_peek h_vpreprocess
                  split <;> exact this
                obtain ⟨sp_gram, sp_scan, hT, hws, hgate, hc⟩ :=
                  content_leaf_at_with_gate (s_q.col + 1) hcorr_vad hpeek_vad hflow h_vnotdoc
                    h_vamp h_vstar h_vbang h_vpipe h_vgt h_vdispatch hfl
                have hevents : tokenEvents sv'.tokens = [] := by
                  rw [tokenEvents_eq_goOut,
                    scalar_dispatch_silent arm_v hcorr_vad hpeek_vad h_vdepth h_vdispatch
                      h_vamp h_vbang h_vstar [], hS.events]
                  simp
                have hclose : ∀ sp_end, SSLComments sp_gram sp_end →
                    TLYamlStream ⟨input.toList, 0⟩ sp_end (tokenEvents sv'.tokens) := by
                  intro sp_end hssl
                  rw [hevents]
                  simpa using hroute sp_end []
                    (.flowInBlock (s_q.col + 1) .blockOut sp_vstart sp_vprep sp_gram sp_end []
                      hsep (.content _ _ _ _ _ hT) hssl)
                obtain ⟨fuel, raw, hloop, heq⟩ :=
                  scan_four_steps_to_terminal hstepQ hstepK hstepColon hstepV hfiltered
                rw [heq]
                obtain ⟨s_result, p_eof, hskip, _, heof, _⟩ :=
                  L4YAML.Proofs.ReachableEOF.next_none_reachable_eof sv' sp_scan hc hterminal
                exact eof_from_retained_park hc hws hgate hskip heof hloop hclose
              · have hlt := dedent_landing_col_lt hd
                have hcol := hcorr_vprep.col_eq
                omega
            · have hlt := dedent_landing_col_lt hded
              have hcol := hcorr_prep.col_eq
              omega
          
          /-- Concatenate two independently produced document-prefix paths. -/
          lemma root_prefix_append {a b c : SurfPos}
              (h : GStar SLDocumentPrefix a b) (k : GStar SLDocumentPrefix b c) :
              GStar SLDocumentPrefix a c := by
            induction h with
            | nil => exact k
            | cons a b d hstep htail ih => exact .cons _ _ _ hstep (ih k)

          lemma scalar_root_geometry_filtered_trace
              {input : String} {q_prep s_q sc s_prep s_ad s' sc_colon sc_afterColon sv_prep sv_ad sv' : ScannerState} {filtered : Array (Positioned YamlToken)}
              {c vc : Char}
              {sp_prep sp_a sp_colon sp_vstart sp_vprep sp_va : SurfPos}
              (hinit : scanNextToken_preprocess (initial input) = .ok (some (q_prep, '?')))
              (hq_ad : s_q = if q_prep.allowDirectives then
                { q_prep with allowDirectives := false, documentEverStarted := true } else q_prep)
              (hstepQ : scanNextToken (initial input) = .ok (some sc))
              (hstepK : scanNextToken sc = .ok (some s'))
              (hstepColon : scanNextToken s' = .ok (some sc_afterColon))
              (hstepV : scanNextToken sc_afterColon = .ok (some sv'))
              (hfiltered : scanFiltered input = .ok filtered)
              
              (hq_scan : scanKey s_q = .ok sc) (hq_flow : s_q.inFlow = false)
              (hq_nic : s_q.needIndentCheck = false)
              (h_next : NextIsSep sc)
              (h_ad : s_ad = if s_prep.allowDirectives then
                { s_prep with allowDirectives := false, documentEverStarted := true } else s_prep)
              (hcorr_prep : ScannerSurfCorr s_prep sp_prep)
              (hcorr' : ScannerSurfCorr s' sp_a)
              (h_preprocess : scanNextToken_preprocess sc = .ok (some (s_prep, c)))
              (arm : ContentArm s_ad s' c sp_prep sp_a)
              (h_depth : s_ad.flowLevel = 0)
              (h_dispatch : scanNextToken_dispatchContent s_ad c = .ok s')
              (h_not_doc : s_ad.col = 0 → atDocumentBoundary s_ad = false)
              (h_amp : c ≠ '&') (h_star : c ≠ '*') (h_bang : c ≠ '!')
              (h_pipe : c ≠ '|') (h_gt : c ≠ '>')
              (h_src : SlotGateAt s_prep)
              (h_deeper : s_q.col < sp_a.col)
              (h_colon_flow : sc_colon.inFlow = false)
              (hpre_colon : scanNextToken_preprocess s' = .ok (some (sc_colon, ':')))
              (hcorr_colon : ScannerSurfCorr sc_colon sp_colon)
              (hcolon : scanValue sc_colon = .ok sc_afterColon)
              (hcorr_vstart : ScannerSurfCorr sc_afterColon sp_vstart)
              (h_vnic : sc_colon.needIndentCheck = false)
              (h_vfresh : sc_colon.simpleKey.possible = true → sc_colon.simpleKey.pos.col = sc_colon.col)
              (h_vnext : NextIsSep sc_afterColon)
              (h_vad : sv_ad = if sv_prep.allowDirectives then
                { sv_prep with allowDirectives := false, documentEverStarted := true } else sv_prep)
              (h_vpreprocess : scanNextToken_preprocess sc_afterColon = .ok (some (sv_prep, vc)))
              (hcorr_vprep : ScannerSurfCorr sv_prep sp_vprep)
              (hcorr_va : ScannerSurfCorr sv' sp_va)
              (arm_v : ContentArm sv_ad sv' vc sp_vprep sp_va)
              (h_vdepth : sv_ad.flowLevel = 0)
              (h_vdispatch : scanNextToken_dispatchContent sv_ad vc = .ok sv')
              (h_vnotdoc : sv_ad.col = 0 → atDocumentBoundary sv_ad = false)
              (h_vsrc : SlotGateAt sv_prep)
              (h_vamp : vc ≠ '&') (h_vstar : vc ≠ '*') (h_vbang : vc ≠ '!')
              (h_vpipe : vc ≠ '|') (h_vgt : vc ≠ '>')
              (hterminal : scanNextToken sv' = .ok none)
              (hmatch : sc_colon.col = s_q.col)
              (hnostamp : sc_afterColon.implicitValueLine ≠ some sc_afterColon.line)
              (hkeyfloor : s_q.col + 1 ≤ s_prep.col)
              (hvaluefloor : s_q.col + 1 ≤ sv_prep.col) :
              TraceOf input (tokenEvents filtered) := by
            obtain ⟨p0, hp0, hz, hc0⟩ :=
              L4YAML.Proofs.ReachableEOF.initial_prefix_corr input
            have hc : ScannerSurfCorr (initial input) p0 := hc0
            obtain ⟨sp_root, sp_q, hg, hcomments, hindent, hq_corr⟩ :=
              L4YAML.Proofs.RootPrefixGeometry.explicit_key_prefix_geometry
                hc hz hinit hq_ad hq_flow hq_scan
            have hprefix : GStar SLDocumentPrefix ⟨input.toList, 0⟩ sp_root := by
              exact root_prefix_append hp0 hg
            have hq_peek : s_q.peek? = some '?' := by
              rw [hq_ad]
              have h := L4YAML.Proofs.StreamAccum.preprocess_some_peek hinit
              split <;> exact h
            have hp := L4YAML.Proofs.StreamAccum.preprocess_some_peek hpre_colon
            have hcc : sp_colon.col = s_q.col := hcorr_colon.col_eq.trans hmatch
            have route : ∀ sp ev, TBlockMapEntry s_q.col sp_q sp ev →
                TLYamlStream ⟨input.toList, 0⟩ sp ([] ++ [] ++ ev) := by
              intro sp ev he
              simpa using root_single_map_route hprefix hcomments hindent sp ev he
            obtain ⟨sp_afterQ, _, _, h⟩ :=
              scalar_key_actual_landing_to_value_route
                hq_corr hq_peek hq_scan hq_flow hq_nic h_next h_ad hcorr_prep hcorr'
                h_preprocess arm h_depth h_dispatch h_not_doc h_amp h_star h_bang h_pipe h_gt
                h_src h_deeper hcc h_colon_flow hpre_colon hcorr_colon hcolon route
            rcases h with ⟨sp_afterColon, hcorr_after, _, hroute⟩ | hded
            · have h_after_eq : sp_afterColon = sp_vstart := ScannerSurfCorr_unique hcorr_after hcorr_vstart
              rw [h_after_eq] at hroute
              obtain ⟨sp_tmp, hgl, hcorr_tmp⟩ :=
                scanValue_prod sc_colon sp_colon hcorr_colon hp sc_afterColon hcolon
              have h_tmp_eq : sp_tmp = sp_vstart := ScannerSurfCorr_unique hcorr_tmp hcorr_vstart
              rw [h_tmp_eq] at hgl
              have h_vcol : s_q.col + 1 ≤ sp_vstart.col := by
                cases hgl
                simp_all
              have h_vcol0 : 0 < sp_vstart.col := by omega
              have h_vfloor : IndentFloor sc_afterColon (s_q.col + 1) :=
                IndentFloor.succ_of_int_le ((scanValue_needIndentCheck hcolon).trans h_vnic)
                  (by rw [← hmatch]; exact scanValue_col_le_currentIndent h_colon_flow h_vfresh hcolon)
              have hflow : sv_ad.inFlow = false := by
                unfold ScannerState.inFlow
                rw [h_vdepth]
                rfl
              rcases TPendingNode.content_sep_of_preprocess h_vad h_vfloor h_vcol h_vcol0
                  h_vnext hcorr_vstart hcorr_vprep hcorr_va h_vpreprocess h_vnotdoc
                  hflow h_vdispatch h_vsrc with ⟨hsep, hfl⟩ | hd
              · have hcorr_ad : ScannerSurfCorr s_ad sp_prep := by
                  rw [h_ad]
                  exact L4YAML.Proofs.StreamAccum.corr_of_allowDirectives_update hcorr_prep
                have hpeek_ad : s_ad.peek? = some c := by
                  rw [h_ad]
                  have := L4YAML.Proofs.StreamAccum.preprocess_some_peek h_preprocess
                  split <;> exact this
                have hqtok : s_q.tokens = q_prep.tokens := by
                  rw [hq_ad]
                  split <;> rfl
                have hS := root_event_from_steps_retained hinit hqtok hq_scan h_preprocess
                  h_ad hcorr_ad hpeek_ad arm h_depth h_dispatch h_amp h_bang h_star
                  hpre_colon hcolon h_colon_flow hp hnostamp h_vpreprocess h_vad
                have hcorr_vad : ScannerSurfCorr sv_ad sp_vprep := by
                  rw [h_vad]
                  exact L4YAML.Proofs.StreamAccum.corr_of_allowDirectives_update hcorr_vprep
                have hpeek_vad : sv_ad.peek? = some vc := by
                  rw [h_vad]
                  have := L4YAML.Proofs.StreamAccum.preprocess_some_peek h_vpreprocess
                  split <;> exact this
                obtain ⟨sp_gram, sp_scan, hT, hws, hgate, hc⟩ :=
                  content_leaf_at_with_gate (s_q.col + 1) hcorr_vad hpeek_vad hflow h_vnotdoc
                    h_vamp h_vstar h_vbang h_vpipe h_vgt h_vdispatch hfl
                have hevents : tokenEvents sv'.tokens = [] := by
                  rw [tokenEvents_eq_goOut,
                    scalar_dispatch_silent arm_v hcorr_vad hpeek_vad h_vdepth h_vdispatch
                      h_vamp h_vbang h_vstar [], hS.events]
                  simp
                have hclose : ∀ sp_end, SSLComments sp_gram sp_end →
                    TLYamlStream ⟨input.toList, 0⟩ sp_end (tokenEvents sv'.tokens) := by
                  intro sp_end hssl
                  rw [hevents]
                  simpa using hroute sp_end []
                    (.flowInBlock (s_q.col + 1) .blockOut sp_vstart sp_vprep sp_gram sp_end []
                      hsep (.content _ _ _ _ _ hT) hssl)
                obtain ⟨fuel, raw, hloop, heq⟩ :=
                  scan_four_steps_to_terminal hstepQ hstepK hstepColon hstepV hfiltered
                rw [heq]
                obtain ⟨s_result, p_eof, hskip, _, heof, _⟩ :=
                  L4YAML.Proofs.ReachableEOF.next_none_reachable_eof sv' sp_scan hc hterminal
                exact eof_from_retained_park hc hws hgate hskip heof hloop hclose
              · have hlt := dedent_landing_col_lt hd
                have hcol := hcorr_vprep.col_eq
                omega
            · have hlt := dedent_landing_col_lt hded
              have hcol := hcorr_prep.col_eq
              omega
          
          #print axioms scalar_root_geometry_filtered_trace
          #print axioms dedent_landing_col_lt
          #print axioms scalar_root_matching_filtered_trace
          end L4YAML.Tests.Guards.RootMatchingTrace
          end
          LEAN
          cp Tests/Guards/Proofs/RootMatchingTrace.lean ../results/
          lake build Tests.Guards.Proofs.RootMatchingTrace 2>&1 | tee ../results/root-matching-trace.log
          grep -F "scalar_root_matching_filtered_trace" ../results/root-matching-trace.log
          grep -F "scalar_root_geometry_filtered_trace" ../results/root-matching-trace.log
          if grep -E 'sorryAx|declaration uses .sorry' ../results/root-matching-trace.log; then exit 1; fi
          git diff --check
          printf 'root_matching_filtered_trace\t0\n' >> ../results/outcomes.tsv
      - name: Derive all matched-root premises from an executable scanner route
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > Tests/Guards/Proofs/RootInhabited.lean <<'LEAN'
          module
          public import Tests.Guards.Proofs.RootMatchingTrace
          public meta import Tests.Guards.Proofs.RootEventEOF
          public meta import L4YAML.Scanner.Scanner
          @[expose] public section Blanket
          namespace L4YAML.Tests.Guards.RootInhabited
          open L4YAML L4YAML.Scanner L4YAML.Surface
          open L4YAML.Proofs.CouplingBridge L4YAML.Proofs.ScannerCoupling
          open L4YAML.Proofs.ScanStrictCoupling L4YAML.Proofs.StreamAccum
          open L4YAML.Proofs.Serialization.SerializationWellFormed
          open L4YAML.Proofs.Serialization.TokenEvents
          open L4YAML.Proofs.Serialization.TraceOf
          open L4YAML.Tests.Guards.RootEventEOF L4YAML.Tests.Guards.RootMatchingTrace
          set_option maxHeartbeats 2000000
          
          /-- Extraction is total only for constructing a candidate. Every default
              branch must be ruled out by a success equation before the proof spends it. -/
          def getOk {a : Type} [Inhabited a] (x : Except ScanError a) : a :=
            match x with | .ok v => v | .error _ => default
          
          lemma getOk_eq {a : Type} [Inhabited a] {x : Except ScanError a}
              (h : x.isOk = true) : x = .ok (getOk x) := by
            cases x with
            | error e => change false = true at h; contradiction
            | ok v => rfl
          
          def someGood {a : Type} (x : Except ScanError (Option a)) : Bool :=
            match x with | .ok (some _) => true | _ => false
          
          def noneGood {a : Type} (x : Except ScanError (Option a)) : Bool :=
            match x with | .ok none => true | _ => false
          
          lemma noneGood_eq {a : Type} {x : Except ScanError (Option a)}
              (h : noneGood x = true) : x = .ok none := by
            cases x with
            | error e => simp [noneGood] at h
            | ok o => cases o <;> simp_all [noneGood]
          
          lemma unitGood_eq {x : Except ScanError Unit} (h : x.isOk = true) : x = .ok () := by
            cases x with
            | error e => change false = true at h; contradiction
            | ok u => cases u; rfl
          
          def prePair (s : ScannerState) : ScannerState × Char :=
            match scanNextToken_preprocess s with
            | .ok (some p) => p
            | _ => default
          
          lemma pre_eq {s : ScannerState}
              (h : someGood (scanNextToken_preprocess s) = true) :
              scanNextToken_preprocess s = .ok (some (prePair s)) := by
            unfold prePair
            cases hx : scanNextToken_preprocess s with
            | error e => simp [hx, someGood] at h
            | ok o =>
              cases o with
              | none => simp [hx, someGood] at h
              | some p => simp [hx]
          
          def upd (s : ScannerState) : ScannerState :=
            if s.allowDirectives then {s with allowDirectives := false, documentEverStarted := true} else s
          
          /-- Real prefix checks that all scanner dispatch paths perform. -/
          def Common (s p : ScannerState) (c : Char) : Prop :=
            (scanNextToken_checkDanglingNode s p).isOk = true ∧
            (scanNextToken_checkFlowValueIndent s p).isOk = true ∧
            noneGood (scanNextToken_dispatchStructural p c) = true ∧
            (scanNextToken_checkNoPendingDirectives p).isOk = true ∧
            (scanNextToken_checkBareDocument p).isOk = true ∧
            noneGood (scanNextToken_dispatchFlowIndicators (upd p) c) = true
          
          lemma stepBlock {s p t : ScannerState} {c : Char}
              (hp : scanNextToken_preprocess s = .ok (some (p,c)))
              (hc : Common s p c)
              (hb : scanNextToken_dispatchBlockIndicators (upd p) c = .ok (some t)) :
              scanNextToken s = .ok (some t) := by
            rcases hc with ⟨hd, hf, hs, hn, hbare, hflow⟩
            have hflow' := noneGood_eq hflow
            unfold upd at hflow' hb
            unfold scanNextToken
            simp [hp, unitGood_eq hd, unitGood_eq hf, noneGood_eq hs,
              unitGood_eq hn, unitGood_eq hbare, hflow', hb,
              bind, Except.bind, pure, Pure.pure, Except.pure]
          
          lemma stepContent {s p t : ScannerState} {c : Char}
              (hp : scanNextToken_preprocess s = .ok (some (p,c)))
              (hc : Common s p c)
              (hb : noneGood (scanNextToken_dispatchBlockIndicators (upd p) c) = true)
              (ha : (scanNextToken_checkAdjacentValue (upd p) c).isOk = true)
              (ht : scanNextToken_dispatchContent (upd p) c = .ok t) :
              scanNextToken s = .ok (some t) := by
            rcases hc with ⟨hd, hf, hs, hn, hbare, hflow⟩
            have hflow' := noneGood_eq hflow
            have hb' := noneGood_eq hb
            have ha' := unitGood_eq ha
            unfold upd at hflow' hb' ha' ht
            unfold scanNextToken
            simp [hp, unitGood_eq hd, unitGood_eq hf, noneGood_eq hs,
              unitGood_eq hn, unitGood_eq hbare, hflow', hb', ha', ht,
              bind, Except.bind, pure, Pure.pure, Except.pure]
          
          /-- A real token offering the slot is a constructive witness, not an assumed SlotGateAt. -/
          def offerIndex (s : ScannerState) : Nat := (prevRealIdx? s.tokens s.tokens.size).getD 0
          def OfferGuard (s : ScannerState) : Prop :=
            prevRealIdx? s.tokens s.tokens.size = some (offerIndex s) ∧
              s.tokens[offerIndex s]!.val.offersNodeSlot = true
          lemma slot_of_guard {s : ScannerState} (h : OfferGuard s) : SlotGateAt s :=
            slotGateAt_of_offerPred_top ⟨offerIndex s, h.1, h.2⟩
          
          def ScalarGuard (c : Char) : Prop :=
            c ≠ '&' ∧ c ≠ '*' ∧ c ≠ '!' ∧ c ≠ '|' ∧ c ≠ '>'
          
          /-- Candidate states are obtained from actual preprocessing and dispatch;
              no fabricated ScannerState or grammar position is supplied. -/
          structure Run where
            q0 : ScannerState
            qc : Char
            q : ScannerState
            sc : ScannerState
            kp : ScannerState
            kc : Char
            ka : ScannerState
            k : ScannerState
            v : ScannerState
            cc : Char
            out : ScannerState
            vp : ScannerState
            vc : Char
            va : ScannerState
            value : ScannerState
            filtered : Array (Positioned YamlToken)
          
          def route (input : String) : Run :=
            let (q0,qc) := prePair (initial input)
            let q := upd q0
            let sc := getOk (scanKey q)
            let (kp,kc) := prePair sc
            let ka := upd kp
            let k := getOk (scanNextToken_dispatchContent ka kc)
            let (v,cc) := prePair k
            let out := getOk (scanValue v)
            let (vp,vc) := prePair out
            let va := upd vp
            let value := getOk (scanNextToken_dispatchContent va vc)
            let filtered := getOk (scanFiltered input)
            ⟨q0,qc,q,sc,kp,kc,ka,k,v,cc,out,vp,vc,va,value,filtered⟩
          
          /-- Computable admission of the matched explicit scalar route. The actual
              successful scan is checked independently of its local dispatch candidates.
              The fragment deliberately admits a space after each indicator. -/
          def Guard (input : String) (r : Run) : Prop :=
            someGood (scanNextToken_preprocess (initial input)) = true ∧
            r.qc = '?' ∧ Common (initial input) r.q0 r.qc ∧
            (isKeyCandidate r.q && flowKeyPredecessorOk r.q && flowKeyFollowerOk r.q) = true ∧
            (scanKey r.q).isOk = true ∧ r.q.inFlow = false ∧ r.q.needIndentCheck = false ∧
            r.sc.peek? = some ' ' ∧
            someGood (scanNextToken_preprocess r.sc) = true ∧ Common r.sc r.kp r.kc ∧
            noneGood (scanNextToken_dispatchBlockIndicators r.ka r.kc) = true ∧
            (scanNextToken_checkAdjacentValue r.ka r.kc).isOk = true ∧
            (scanNextToken_dispatchContent r.ka r.kc).isOk = true ∧
            r.ka.flowLevel = 0 ∧ r.ka.col ≠ 0 ∧ ScalarGuard r.kc ∧ OfferGuard r.kp ∧
            r.q.col < r.k.col ∧
            someGood (scanNextToken_preprocess r.k) = true ∧ r.cc = ':' ∧ Common r.k r.v r.cc ∧
            r.v.allowDirectives = false ∧ isValueCandidate r.v = true ∧ (scanValue r.v).isOk = true ∧
            r.v.inFlow = false ∧ r.v.needIndentCheck = false ∧
            (r.v.simpleKey.possible = true → r.v.simpleKey.pos.col = r.v.col) ∧
            r.out.peek? = some ' ' ∧
            someGood (scanNextToken_preprocess r.out) = true ∧ Common r.out r.vp r.vc ∧
            noneGood (scanNextToken_dispatchBlockIndicators r.va r.vc) = true ∧
            (scanNextToken_checkAdjacentValue r.va r.vc).isOk = true ∧
            (scanNextToken_dispatchContent r.va r.vc).isOk = true ∧
            r.va.flowLevel = 0 ∧ r.va.col ≠ 0 ∧ ScalarGuard r.vc ∧ OfferGuard r.vp ∧
            noneGood (scanNextToken r.value) = true ∧ (scanFiltered input).isOk = true ∧
            r.v.col = r.q.col ∧ r.out.implicitValueLine ≠ some r.out.line ∧
            r.q.col + 1 ≤ r.kp.col ∧ r.q.col + 1 ≤ r.vp.col
          
          set_option maxRecDepth 4096 in
          set_option maxSynthPendingDepth 256 in
          instance (input : String) (r : Run) : Decidable (Guard input r) := by
            unfold Guard Common ScalarGuard OfferGuard
            repeat' refine @instDecidableAnd _ _ ?_ ?_
            all_goals infer_instance
          
          /-- Every admitted input has an actual successful filtered output and a direct
              independent grammar trace. All former scanner-state and grammar witnesses
              are constructed inside the proof. No oracle for TraceOf occurs in Guard. -/
          theorem checked_root_trace (input : String) (h : Guard input (route input)) :
              ∃ filtered, scanFiltered input = .ok filtered ∧ TraceOf input (tokenEvents filtered) := by
            let r := route input
            change Guard input r at h
            rcases h with ⟨hpreQ, hqc, hcommonQ, hkeyflag, hkeyok, hqflow, hqnic, hqspace,
              hpreK, hcommonK, hblockK, hadjK, hdispK, hkdepth, hkcol, hscalarK, hofferK, hdeep,
              hpreC, hcc, hcommonC, hallow, hvalflag, hvalok, hcolflow, hvnic, hvfresh, hvspace,
              hpreV, hcommonV, hblockV, hadjV, hdispV, hvdepth, hvcol, hscalarV, hofferV,
              hterm, hscan, hmatch, hnostamp, hkeyfloor, hvaluefloor⟩
            have hinit : scanNextToken_preprocess (initial input) = .ok (some (r.q0, r.qc)) := pre_eq hpreQ
            have hqscan : scanKey r.q = .ok r.sc := getOk_eq hkeyok
            have hprekey : scanNextToken_preprocess r.sc = .ok (some (r.kp,r.kc)) := pre_eq hpreK
            have hkd : scanNextToken_dispatchContent r.ka r.kc = .ok r.k := getOk_eq hdispK
            have hprecolon : scanNextToken_preprocess r.k = .ok (some (r.v,r.cc)) := pre_eq hpreC
            have hcolon : scanValue r.v = .ok r.out := getOk_eq hvalok
            have hprevalue : scanNextToken_preprocess r.out = .ok (some (r.vp,r.vc)) := pre_eq hpreV
            have hvd : scanNextToken_dispatchContent r.va r.vc = .ok r.value := getOk_eq hdispV
            have hfiltered : scanFiltered input = .ok r.filtered := getOk_eq hscan
            have hterminal : scanNextToken r.value = .ok none := noneGood_eq hterm
            rw [hqc] at hinit hcommonQ
            rw [hcc] at hprecolon hcommonC
            have hbQ : scanNextToken_dispatchBlockIndicators r.q '?' = .ok (some r.sc) := by
              simp [scanNextToken_dispatchBlockIndicators, hkeyflag, hqscan,
                bind, Except.bind, pure, Pure.pure, Except.pure]
            have hstepQ := stepBlock hinit hcommonQ hbQ
            have hstepK := stepContent hprekey hcommonK hblockK hadjK hkd
            have hupdate : upd r.v = r.v := by simp [upd, hallow]
            have hbC : scanNextToken_dispatchBlockIndicators (upd r.v) ':' = .ok (some r.out) := by
              rw [hupdate]
              simp [scanNextToken_dispatchBlockIndicators, hvalflag, hcolon,
                bind, Except.bind, pure, Pure.pure, Except.pure]
            have hstepC := stepBlock hprecolon hcommonC hbC
            have hstepV := stepContent hprevalue hcommonV hblockV hadjV hvd
            have hnextK : NextIsSep r.sc := by unfold NextIsSep; rw [hqspace]; decide
            have hnextV : NextIsSep r.out := by unfold NextIsSep; rw [hvspace]; decide
            obtain ⟨p0, _, _, hc0⟩ := L4YAML.Proofs.ReachableEOF.initial_prefix_corr input
            have hi : ScannerSurfCorr (initial input) p0 := hc0
            obtain ⟨psc, hcsc⟩ := scanNextToken_corr _ _ hi _ hstepQ
            obtain ⟨pkp, hckp⟩ := scanNextToken_preprocess_corr _ _ hcsc _ _ hprekey
            have hcka : ScannerSurfCorr r.ka pkp := corr_of_allowDirectives_update hckp
            have hpeekK : r.ka.peek? = some r.kc := by
              change (upd r.kp).peek? = _
              unfold upd
              have hp := preprocess_some_peek hprekey
              split <;> exact hp
            have hnotK : r.ka.col = 0 → atDocumentBoundary r.ka = false :=
              fun h => False.elim (hkcol h)
            obtain ⟨pk, armK⟩ := contentArm_of_dispatch r.ka pkp r.kc hcka hpeekK hnotK
              (by omega) hkd
            obtain ⟨pk', hck'⟩ := scanNextToken_corr _ _ hcsc _ hstepK
            have hck : ScannerSurfCorr r.k pk := by
              cases armK <;> assumption
            obtain ⟨pv, hcv⟩ := scanNextToken_preprocess_corr _ _ hck _ _ hprecolon
            obtain ⟨pout, hcout⟩ := scanNextToken_corr _ _ hck _ hstepC
            obtain ⟨pvp, hcvp⟩ := scanNextToken_preprocess_corr _ _ hcout _ _ hprevalue
            have hcva : ScannerSurfCorr r.va pvp := corr_of_allowDirectives_update hcvp
            have hpeekV : r.va.peek? = some r.vc := by
              change (upd r.vp).peek? = _
              unfold upd
              have hp := preprocess_some_peek hprevalue
              split <;> exact hp
            have hnotV : r.va.col = 0 → atDocumentBoundary r.va = false :=
              fun h => False.elim (hvcol h)
            obtain ⟨pval, armV⟩ := contentArm_of_dispatch r.va pvp r.vc hcva hpeekV hnotV
              (by omega) hvd
            have hcval : ScannerSurfCorr r.value pval := by
              cases armV <;> assumption
            have hdeeper : r.q.col < pk.col := by rw [hck.col_eq]; exact hdeep
            rcases hscalarK with ⟨ha, hs, ht, hp, hg⟩
            rcases hscalarV with ⟨hva, hvs, hvt, hvp, hvg⟩
            refine ⟨r.filtered, hfiltered, ?_⟩
            exact scalar_root_geometry_filtered_trace hinit (by rfl) hstepQ hstepK hstepC hstepV hfiltered
              hqscan hqflow hqnic hnextK (by rfl) hckp hck hprekey armK hkdepth hkd hnotK
              ha hs ht hp hg (slot_of_guard hofferK) hdeeper hcolflow hprecolon hcv hcolon
              hcout hvnic hvfresh hnextV (by rfl) hprevalue hcvp hcval armV hvdepth hvd hnotV
              (slot_of_guard hofferV) hva hvs hvt hvp hvg hterminal hmatch hnostamp hkeyfloor hvaluefloor
          
          /-- One closed, actual input; the only finite oracle is the executable guard,
              never a direct decision of the target TraceOf proposition. -/
          theorem fixture_guard : Guard "? a\n: b" (route "? a\n: b") := by
            first | decide | native_decide
          
          theorem fixture_trace :
              ∃ filtered, scanFiltered "? a\n: b" = .ok filtered ∧
                TraceOf "? a\n: b" (tokenEvents filtered) :=
            checked_root_trace _ fixture_guard
          
          #print axioms checked_root_trace
          #print axioms fixture_guard
          #print axioms fixture_trace
          end L4YAML.Tests.Guards.RootInhabited
          end Blanket
          LEAN
          cp Tests/Guards/Proofs/RootInhabited.lean ../results/
          lake build Tests.Guards.Proofs.RootInhabited 2>&1 | tee ../results/root-inhabited.log
          for n in checked_root_trace fixture_guard fixture_trace; do
            grep -F "$n" ../results/root-inhabited.log
          done
          if grep -E 'sorryAx|declaration uses .sorry' ../results/root-inhabited.log; then exit 1; fi
          git diff --check
          printf 'root_inhabited_trace\t0\n' >> ../results/outcomes.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-geometry-composition-evidence
          path: results/
          if-no-files-found: error
