name: Normative comment repair qualification
on:
  push:
    branches: ['research/normative-comments']
    paths-ignore: ['research/whole-source/obligations.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Record candidate boundary and protect tests and dependencies
        run: |
          set -euo pipefail
          mkdir -p comment-evidence
          git rev-parse HEAD HEAD^{tree} > comment-evidence/identity.txt
          git diff --stat 9f38b679d0432fc7dfe49459dc9a8d3a59bdf1fb > comment-evidence/diff-stat.txt
          git diff --exit-code 9f38b679d0432fc7dfe49459dc9a8d3a59bdf1fb -- Tests lean-toolchain lakefile.lean lake-manifest.json yaml-test-suite
          git submodule status --recursive > comment-evidence/submodules.txt
          git diff 9f38b679d0432fc7dfe49459dc9a8d3a59bdf1fb -- L4YAML > comment-evidence/production.patch
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check | tee comment-evidence/toolchain.txt
          tar --no-same-owner --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake
          key: normative-comments-lean435-${{ github.sha }}
          restore-keys: |
            normative-comments-lean435-
            whole-directives-production-64795a8-lean435-
            directive-bridge-deps-64795a8-lean435-
      - name: Build legacy runtime dependencies
        id: runtime
        run: |
          set -euo pipefail
          lake build L4YAML.Parser.Composition > comment-evidence/runtime-build.log 2>&1
          tail -60 comment-evidence/runtime-build.log
      - name: Legacy controls and kernel rejection proof
        id: legacy_controls
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake env lean --root=research/whole-source -o research/whole-source/NormativeCommentCore.olean research/whole-source/NormativeCommentCore.lean > comment-evidence/controls.log 2>&1
          cat comment-evidence/controls.log
      - name: Build indexed runtime dependencies
        id: indexed
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake build L4YAML.Scanner.IndexedDispatch > comment-evidence/indexed-build.log 2>&1
          tail -60 comment-evidence/indexed-build.log
      - name: Indexed boundary controls
        id: indexed_controls
        if: ${{ !cancelled() && steps.indexed.outcome == 'success' }}
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD/research/whole-source:$(lake env printenv LEAN_PATH)"
          lean research/whole-source/NormativeComments.lean > comment-evidence/indexed-controls.log 2>&1
          cat comment-evidence/indexed-controls.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: normative-comment-boundary-early
          path: comment-evidence/
          retention-days: 30
      - name: Full unchanged proof and guard suite
        if: ${{ !cancelled() && steps.legacy_controls.outcome == 'success' && steps.indexed_controls.outcome == 'success' }}
        id: full
        run: |
          set -euo pipefail
          lake build > comment-evidence/full-build.log 2>&1
          tail -100 comment-evidence/full-build.log
      - name: Unchanged native regression suite
        if: ${{ !cancelled() && steps.full.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake build tests demo limittests > comment-evidence/runtime-exes.log 2>&1
          lake run run-all-tests -- docs/reports > comment-evidence/native-tests.log 2>&1
          tail -100 comment-evidence/native-tests.log
      - name: Post-run tracked source identity
        if: always()
        run: |
          git diff --exit-code HEAD
          git rev-parse HEAD HEAD^{tree} > comment-evidence/post-identity.txt
          cmp comment-evidence/identity.txt comment-evidence/post-identity.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: normative-comment-candidate
          path: comment-evidence/
          retention-days: 30
