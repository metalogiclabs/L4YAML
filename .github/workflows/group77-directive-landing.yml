name: Group 7.7 lawful directive landing without diagnostic cut
on:
  push:
    branches: [research/group77-directive-landing-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: evidence
      - uses: actions/checkout@v4
        with:
          repository: nasa-jpl/L4YAML
          ref: 92c622bc1015febac29897be08192eb73c6aa744
          path: upstream
      - uses: actions/checkout@v4
        with:
          repository: metalogiclabs/L4YAML
          ref: 26baf55ec8c3023d4903a9444505e1c88a3b5da9
          path: solution
      - name: Verify all pinned inputs
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../results
          test "$(git rev-parse HEAD)" = 92c622bc1015febac29897be08192eb73c6aa744
          test "$(git rev-parse HEAD:L4YAML/Proofs/Serialization/TraceOf/Document.lean)" = 29f20ab3947dacef278808153130ff7fcd1861b4
          test "$(git rev-parse HEAD:L4YAML/Proofs/Serialization/TraceOf/DocBridge.lean)" = 570e6330fd3d6f27df37fcd8a344b01552c2c7b3
          test "$(git rev-parse HEAD:L4YAML/Proofs/Serialization/TraceOf/StreamBridge.lean)" = 213a3576c024e3cc4b56d109942ec9085715f9d3
          test "$(git -C ../solution rev-parse HEAD)" = 26baf55ec8c3023d4903a9444505e1c88a3b5da9
          test "$(git -C ../solution rev-parse HEAD:Tests/Guards/Proofs/TraceOfBlockAmbiguity.lean)" = 4741497a77d31446a94c3ebfbfa512d50f2fce0b
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.36.0
          git rev-parse HEAD HEAD:L4YAML > ../results/source.txt
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Replay positive and negative explicit-key runtime observations
        working-directory: upstream
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cat > Tests/Guards/Proofs/ExplicitKeyRuntimeDiagnostic.lean <<'LEAN'
          module
          public import L4YAML.Proofs.Serialization.TokenEvents
          public import L4YAML.Scanner.Scanner
          public import L4YAML.Parser.Composition
          public meta import L4YAML.Proofs.Serialization.TokenEvents
          public meta import L4YAML.Scanner.Scanner
          public meta import L4YAML.Parser.Composition
          @[expose] public section Blanket
          open L4YAML L4YAML.Proofs.Serialization.TokenEvents
          #eval (["", "? a\n: b", "? a", "? -\n  :", "? &k a\n: *k", "%YAML 1.2\n---\n\"b\"\n", "# c\n%YAML 1.2\n---\n\"b\"\n", "\"a\"\n...\n%YAML 1.2\n---\n\"b\"\n", "\"a\"\n%YAML 1.2\n---\n\"b\"\n", "\"a\"\n---\n\"b\"\n"].map fun s =>
            (s, (Scanner.scanFiltered s).isOk,
              (match Scanner.scanFiltered s with | .ok ts => (tokenEvents ts).length | .error _ => 999),
              (TokenParser.parseYamlRaw s).isOk,
              (match TokenParser.parseYamlRaw s with | .ok ds => ds.size | .error _ => 999)))
          end Blanket
          LEAN
          lake build Tests.Guards.Proofs.ExplicitKeyRuntimeDiagnostic 2>&1 | tee ../results/runtime.log
          rc=${PIPESTATUS[0]}
          printf 'runtime_observations\t%s\n' "$rc" >> ../results/outcomes.tsv
          git diff --exit-code -- L4YAML
      - name: Narrow only the annotated [211] grammar; replay frozen after-case
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("L4YAML/Proofs/Serialization/TraceOf/Document.lean")
          s=p.read_text()
          old="      TOpt TLAnyDocument s₂ s₃ e₁ →"
          new="      TOpt TLExplicitDocument s₂ s₃ e₁ →"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          after=Path("../solution/L4YAML/Proofs/Serialization/TraceOf/Document.lean").read_text()
          assert after.count(new)==1
          PY
          cp ../solution/Tests/Guards/Proofs/TraceOfBlockAmbiguity.lean Tests/Guards/Proofs/Group77CorrectedGuard.lean
          git diff -- L4YAML > ../results/grammar-only.diff
          set +e
          set -o pipefail
          lake build Tests.Guards.Proofs.Group77CorrectedGuard 2>&1 | tee ../results/corrected-witness.log
          rc=${PIPESTATUS[0]}
          printf 'corrected_witness\t%s\n' "$rc" >> ../results/outcomes.tsv
      - name: Expose earliest genuine transfer obstruction
        working-directory: upstream
        shell: bash
        run: |
          set +e
          set -uo pipefail
          lake build L4YAML.Proofs.Serialization.TraceOf.DocBridge 2>&1 | tee ../results/uncut-route.log
          rc=${PIPESTATUS[0]}
          printf 'uncut_docbridge\t%s\n' "$rc" >> ../results/outcomes.tsv
      - name: Retain the directive case by making its exact landing evidence explicit
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("L4YAML/Proofs/Serialization/TraceOf/DocBridge.lean")
          s=p.read_text()
          old="(TOpt.some _ _ _ (TLAnyDocument.explicit _ _ _\n      (TLExplicitDocument.withContent s₂ s₃ s' eb hde hb))) (TStar.nil _)"
          new="(TOpt.some _ _ _ (TLExplicitDocument.withContent s₂ s₃ s' eb hde hb)) (TStar.nil _)"
          assert s.count(old)==1
          s=s.replace(old,new)
          start=s.index("lemma TLYamlStream.directiveRoute")
          a=s.rfind("/--",0,start)
          b=s.index("/-- A star grows",start)
          assert a>=0 and "lemma TLYamlStream.directiveRoute" in s[a:b]
          s=s[:a]+'''/-- YAML [211] permits a directive document only in the initial document slot
          or a slot following one or more document suffixes. A closed arbitrary stream
          alone is not a certificate of either landing. -/
          inductive DirectiveLanding (s : SurfPos) : SurfPos → List Event → Prop where
            | initial (s' : SurfPos) (hp : GStar SLDocumentPrefix s s') :
                DirectiveLanding s s' []
            | afterSuffix (s₀ s₁ s' : SurfPos) (e₀ e₁ : List Event)
                (h : TLYamlStream s s₀ e₀) (hs : TPlus TLDocumentSuffix s₀ s₁ e₁)
                (hp : GStar SLDocumentPrefix s₁ s') :
                DirectiveLanding s s' (e₀ ++ e₁)

          /-- Directives then explicit body, retaining their proper event order and the
          actual [211] initial or post-suffix slot. This consumes landing evidence; it
          does not establish scanner reachability of such a landing. -/
          lemma TLYamlStream.directiveRoute {s s₂ s₃ s₄ s' : SurfPos} {e ed eb : List Event}
              (h : DirectiveLanding s s₂ e)
              (hd : TPlus TLDirective s₂ s₃ ed) (hde : SCDirectivesEnd s₃ s₄)
              (hb : TLExplicitBody s₄ s' eb) :
              TLYamlStream s s' (e ++ .beginDocument :: ed ++ eb) := by
            have doc : TLAnyDocument s₂ s' (.beginDocument :: ed ++ eb) :=
              .directive _ _ _ (.mk _ _ _ _ ed eb hd hde hb)
            cases h with
            | initial sp hp =>
              simpa using TLYamlStream.single _ _ _ _ (.beginDocument :: ed ++ eb) [] hp
                (TOpt.some _ _ _ doc) (TStar.nil _)
            | afterSuffix sp₀ sp₁ sp₂ e₀ e₁ hstream hs hp =>
              simpa [List.append_assoc] using TLYamlStream.suffixContinue _ _ _ _ _ e₀ e₁
                (.beginDocument :: ed ++ eb) [] hstream hs hp (TOpt.some _ _ _ doc) (TStar.nil _)

          '''+s[b:]
          p.write_text(s)
          p=Path("L4YAML/Proofs/Serialization/TraceOf/StreamBridge.lean")
          s=p.read_text()
          start=s.index("lemma docStart_step_run")
          end=s.index("/--",start)
          block=s[start:end]
          a="    (hS : TSLYamlStream sp_start s_prep sp_block ev_c [] p)\n"
          assert block.count(a)==1
          block=block.replace(a,a+"    (h_landing : DirectiveLanding sp_start sp_block ev_c)\n")
          a="TLYamlStream.directiveRoute hS.stream (GStar.nil _) (h_acc sp_prep h_pre) hde hb"
          assert block.count(a)==1
          block=block.replace(a,"TLYamlStream.directiveRoute h_landing (h_acc sp_prep h_pre) hde hb")
          s=s[:start]+block+s[end:]
          assert s.count("lemma docStart_step_run")==1
          assert "content_step_park" in s
          p.write_text(s)
          PY
          git diff --check
          git diff -- L4YAML > ../results/lawful-route.diff
          test "$(git diff --name-only -- L4YAML | wc -l)" = 3
      - name: Check actual DocBridge and StreamBridge with directive route retained
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          lake build L4YAML.Proofs.Serialization.TraceOf.DocBridge 2>&1 | tee ../results/lawful-docbridge.log
          printf 'lawful_docbridge\t0\n' >> ../results/outcomes.tsv
          lake build L4YAML.Proofs.Serialization.TraceOf.StreamBridge 2>&1 | tee ../results/lawful-streambridge.log
          printf 'lawful_streambridge\t0\n' >> ../results/outcomes.tsv
      - name: Consume the actual value-content producer through an explicit key
        working-directory: upstream
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cat > Tests/Guards/Proofs/ExplicitKeyRouteCut.lean <<'LEAN'
          /- Conditional local consumer, not a scanner reachability invariant.
          The actual #376 value producer is used after a certified explicit key.
          The two alternatives share the same '?' and key derivation.
          The missing producer is required to construct the prefix and same-map route. -/
          module
          public import L4YAML.Proofs.Serialization.TraceOf.StreamBridge
          public section
          namespace L4YAML.Tests.Guards.ExplicitKeyRouteCut
          open L4YAML L4YAML.Scanner L4YAML.Surface
          open L4YAML.Proofs.Serialization.SerializationWellFormed
          open L4YAML.Proofs.Serialization.TokenEvents
          open L4YAML.Proofs.Serialization.TraceOf
          open L4YAML.Proofs.Serialization.TraceOf.DocBridge
          open L4YAML.Proofs.Serialization.TraceOf.StreamBridge
          open L4YAML.Proofs.CouplingBridge
          open L4YAML.Proofs.StreamAccum (ContentArm)
          open L4YAML.Proofs.PreprocessIndentStable (minContentIndentOf)
          /-- Key-only closure is lawful at a certified terminal entry. -/
          lemma key_can_close_empty {n : Nat} {sp_start sp_q sp_afterQ sp_key : SurfPos}
              {ev_c ev_o ev_k : List Event}
              (hq : GLit '?' sp_q sp_afterQ)
              (hk : TBlockIndented n .blockOut sp_afterQ sp_key ev_k)
              (route : ∀ sp ev, TBlockMapEntry n sp_q sp ev →
                TLYamlStream sp_start sp (ev_c ++ ev_o ++ ev)) :
              TLYamlStream sp_start sp_key (ev_c ++ ev_o ++ ev_k) :=
            route sp_key ev_k (.explicitEmpty n sp_q sp_afterQ sp_key ev_k hq hk)
          /-- A subsequent colon at the mapping indent uses the SAME key derivation;
          do not erase the key by prematurely closing the stream. -/
          lemma key_value_content_step {n : Nat}
              {sp_start sp_block sp_q sp_afterQ sp_key sp_colon sp_afterColon sp_prep sp_a sp_end : SurfPos}
              {sc s_prep s_ad s' : ScannerState} {c : Char} {ev_c ev_o ev_k : List Event}
              (hq : GLit '?' sp_q sp_afterQ)
              (hk : TBlockIndented n .blockOut sp_afterQ sp_key ev_k)
              (hi : SIndent n sp_key sp_colon)
              (hc : GLit ':' sp_colon sp_afterColon)
              (route : ∀ sp ev, TBlockMapEntry n sp_q sp ev →
                TLYamlStream sp_start sp (ev_c ++ ev_o ++ ev))
              (hS : TSLYamlStream sp_start s_ad sp_block ev_c (ev_o ++ ev_k) [])
              (h_ad : s_ad = if s_prep.allowDirectives then
                { s_prep with allowDirectives := false, documentEverStarted := true } else s_prep)
              (h_floor : L4YAML.Proofs.PreprocessIndentStable.IndentFloor sc (n + 1))
              (h_col : n + 1 ≤ sp_afterColon.col) (h_col0 : 0 < sp_afterColon.col)
              (h_next : L4YAML.Proofs.StreamAccum.NextIsSep sc)
              (h_corr : ScannerSurfCorr sc sp_afterColon)
              (hcorr_prep : ScannerSurfCorr s_prep sp_prep) (hcorr' : ScannerSurfCorr s' sp_a)
              (h_preprocess : scanNextToken_preprocess sc = .ok (some (s_prep, c)))
              (arm : ContentArm s_ad s' c sp_prep sp_a)
              (h_depth : s_ad.flowLevel = 0)
              (h_dispatch : scanNextToken_dispatchContent s_ad c = .ok s')
              (h_not_doc : s_ad.col = 0 → atDocumentBoundary s_ad = false)
              (h_src : L4YAML.Proofs.StreamAccum.SlotGateAt s_prep)
              (h_ssl : SSLComments sp_a sp_end) :
              (∃ ev_v, (goOut s'.tokens.toList []).1 = ev_c ++ ((ev_o ++ ev_k) ++ ev_v) ∧
                TLYamlStream sp_start sp_end (ev_c ++ ((ev_o ++ ev_k) ++ ev_v))) ∨
              L4YAML.Proofs.FlowIndexLift.DedentLanding (n + 1) sp_afterColon sp_prep := by
            have h_close : ∀ sp_mid ev_v, TBlockNode (n + 1) .blockOut sp_afterColon sp_mid ev_v →
                TLYamlStream sp_start sp_mid (ev_c ++ (ev_o ++ ev_k) ++ ev_v) := by
              intro sp_mid ev_v hv
              have he : TBlockMapEntry n sp_q sp_mid (ev_k ++ ev_v) :=
                .explicit n sp_q sp_afterQ sp_key sp_colon sp_afterColon sp_mid ev_k ev_v hq hk hi hc
                  (.node n .blockOut _ _ _ hv)
              simpa only [List.append_assoc] using route sp_mid (ev_k ++ ev_v) he
            have park : TPendingNode.ContentPark sp_start sp_afterColon c ev_c (n + 1) (ev_o ++ ev_k) :=
              .mapValue n (ev_o ++ ev_k) h_close
            rcases TPendingNode.content_step_park hS park h_ad h_floor h_col h_col0 h_next h_corr
              hcorr_prep hcorr' h_preprocess arm h_depth h_dispatch h_not_doc h_src with
              ⟨ev_v, hS', h_park⟩ | h_ded
            · exact Or.inl ⟨ev_v, congrArg Prod.fst hS'.events, TPendingNode.close_with_ssl hS' h_park h_ssl⟩
            · exact Or.inr h_ded
          #print axioms key_can_close_empty
          #print axioms key_value_content_step
          end L4YAML.Tests.Guards.ExplicitKeyRouteCut
          end
          LEAN
          lake build Tests.Guards.Proofs.ExplicitKeyRouteCut 2>&1 | tee ../results/explicit-key-consumer.log
          rc=${PIPESTATUS[0]}
          printf 'explicit_key_consumer\t%s\n' "$rc" >> ../results/outcomes.tsv
          cp Tests/Guards/Proofs/ExplicitKeyRouteCut.lean ../results/
      - name: Check exact route profiles and frozen explicit-key consumer
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          for target in runtime_observations corrected_witness lawful_docbridge lawful_streambridge explicit_key_consumer; do
            grep -Fx "$(printf '%s\t0' "$target")" ../results/outcomes.tsv
          done
          grep -Fx "$(printf 'uncut_docbridge\t1')" ../results/outcomes.tsv
          grep -F 'DocBridge.lean:877:' ../results/uncut-route.log
          grep -F 'DocBridge.lean:887:' ../results/uncut-route.log
          cat > Tests/Guards/Proofs/DirectiveLandingProfiles.lean <<'LEAN'
          module
          public import L4YAML.Proofs.Serialization.TraceOf.StreamBridge
          public section
          open L4YAML.Proofs.Serialization.TraceOf.DocBridge
          open L4YAML.Proofs.Serialization.TraceOf.StreamBridge
          #print axioms TLYamlStream.directiveRoute
          #print axioms TPendingNode.docStart_step_run
          end
          LEAN
          lake build Tests.Guards.Proofs.DirectiveLandingProfiles 2>&1 | tee ../results/route-profiles.log
          grep -F 'directiveRoute' ../results/route-profiles.log
          grep -F 'docStart_step_run' ../results/route-profiles.log
          if grep -E 'sorryAx|declaration uses .sorry' ../results/corrected-witness.log ../results/explicit-key-consumer.log ../results/route-profiles.log; then exit 1; fi
          git diff --check
          # Raw nonstandard dependencies retained; no claim of replay admission here.
          echo 'Conditional route and local explicit-key consumer only; landing producer and inherited native admission remain separate obligations.' | tee ../results/boundary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lawful-directive-landing-evidence
          path: results/
          if-no-files-found: error
