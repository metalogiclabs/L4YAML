name: Right-wall exact-native parser/trace split
on:
  push:
    branches: [research/right-wall-parser-observation-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Lean 4.35.0
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Native parser observation and independent T proof
        shell: bash
        run: |
          set -eo pipefail
          git rev-parse HEAD HEAD^{tree}
          lake build Tests.Guards.Proofs.ParseYamlNativeWitness 2>&1 | tee native-observation.log
          ! grep -E "sorryAx|declaration uses .sorry" native-observation.log
